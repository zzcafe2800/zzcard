            await D.set(D.ref(db, 'pcrec/' + uid + '/' + today), rec);
            if (o.done === false) return;   /* 体操して いない 日は 丘に 出さない */
            const key = 'posts/' + uid + '_' + today;
            const cur = await D.get(D.ref(db, key)).then((s) => s.val()).catch(() => null);
            let ph = null;   /* 写真：サイトと 同じ 形（photos＝本体・photoidx＝見本）。その日の 写真が あれば うしろに たす（4まいまで） */
            if (o.photos && o.photos.length) {
              const pk = uid + '_' + today, prev = await D.get(D.ref(db, 'photos/' + pk)).then((s) => s.val()).catch(() => null);
              const pidx = await D.get(D.ref(db, 'photoidx/' + pk)).then((s) => s.val()).catch(() => null);
              const name = (cur && cur.name) || (prev && prev.name) || '匿名さん', at = now;
              const imgs = ((prev && prev.imgs) || []).concat(o.photos.map((q) => ({ u: q.u, w: q.w, h: q.h }))).slice(0, 4);
              const ts = ((pidx && pidx.ts) || []).concat(o.photos.map((q) => ({ t: q.t, w: q.w, h: q.h }))).slice(0, 4);
              await D.set(D.ref(db, 'photos/' + pk), { uid, name, at, imgs });
              await D.set(D.ref(db, 'photoidx/' + pk), { uid, name, at, ts });
              ph = { n: imgs.length, th: ts[0].t };
            }
            if (cur) {   /* サイトで もう 投稿している → ひとこと・時間・写真だけ たす */
              const up = { wakeHF: o.wake };
              if (o.comment) up.comment = String(o.comment).slice(0, 30);
              if (ph) { up.phN = ph.n; up.phT = ph.th; }
              await D.update(D.ref(db, key), up);
              return;
            }
            let tpl = null;
            try {
              const v = (await D.get(D.query(D.ref(db, 'posts'), D.orderByChild('uid'), D.equalTo(uid), D.limitToLast(5)))).val() || {};
              tpl = Object.values(v).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))[0] || null;
            } catch (_) {}
            const t = tpl || {};
            const post = { uid, name: t.name || '匿名さん', color: t.color || '#a6bfd2', catBody: t.catBody || '#1c1c1c', acos: t.acos || null, cos: t.cos || null, pose: t.pose || 'sit', y1: t.y1 || null, date: today, createdAt: now, wakeHF: o.wake, fromPc: 1 };
            if (o.comment) post.comment = String(o.comment).slice(0, 30); else if (!ph) post.catOnly = 1;
            if (ph) { post.phN = ph.n; post.phT = ph.th; }
            await D.set(D.ref(db, key), post);
          }

          /* うつりかわり：サイトの きろく（クラウドの sync）と PC版の きろく（pcrec） */
          export async function recData(uid) {
            const { db, D } = await fb();
            const get = (p) => D.get(D.ref(db, p)).then((s) => s.val()).catch(() => null);
            const [sy, pr] = await Promise.all([get('sync/' + uid), get('pcrec/' + uid)]);
            let data = {}; try { data = JSON.parse((sy && sy.data) || '{}') || {}; } catch (_) {}
            return { data, pcrec: pr || {} };
          }
          /* タップ数：PC版を 開いている 人どうしで 共有（見せる 設定の 人だけ） */
          export async function pubTaps(uid, n, share) {
            const { db, D } = await fb();
            if (!share) { await D.remove(D.ref(db, 'pctaps/' + uid)).catch(() => {}); return; }
            await D.set(D.ref(db, 'pctaps/' + uid), { n: n | 0, day: jstKey(), t: Date.now() });
          }
          export async function allTaps() {
            const { db, D } = await fb();
            const v = (await D.get(D.ref(db, 'pctaps')).catch(() => null));
            const o = (v && v.val()) || {}, now = Date.now(), day = jstKey(), out = {};
            Object.keys(o).forEach((u) => { const x = o[u]; if (x && x.day === day && now - (x.t || 0) < 120000) out[u] = x.n | 0; });
            return out;
          }
          ZZEOF
          cat > pc/prep.js << 'ZZEOF'
          /* サイトの index.html から PC版に いる 部品だけを 取り出す：アイコン・景色・空の色・猫の うごき・Firebaseの 設定 */
          const fs = require('fs');
          const s = fs.readFileSync('index.html', 'utf8');
          function cut(a, b, name) { const i = s.indexOf(a), j = s.indexOf(b, i + 1); if (i < 0 || j <= i) { console.error('not found: ' + name); process.exit(1); } return s.slice(i, j); }
          function fn(name) { const i = s.indexOf('function ' + name + '('); if (i < 0) { console.error('not found: ' + name); process.exit(1); } let d = 0, k = i, st = false; for (; k < s.length; k++) { const c = s[k]; if (c === '{') { d++; st = true; } else if (c === '}') { d--; if (st && d === 0) break; } } return s.slice(i, k + 1); }
          const m = s.match(/rel="apple-touch-icon" href="data:image\/png;base64,([^"]+)"/);
          if (!m) { console.error('icon not found'); process.exit(1); }
          fs.writeFileSync('pc/dist/icon192.png', Buffer.from(m[1], 'base64'));
          fs.writeFileSync('pc/dist/engine.js', cut('/* ===== UIが 消えている 間：今日 体操した 子たちが 奥で あそぶ', '/* ===== /奥で あそぶ 猫 ===== */', 'engine'));
          fs.writeFileSync('pc/dist/scene.js', cut('function _scPal(tk){', 'function renderHomeScenery(', 'scene') + '\n' + fn('skyGradientForHour') + '\n');
          const cfg = cut('const firebaseConfig={', '};', 'firebaseConfig').replace('const firebaseConfig=', 'window.FBCFG=') + '};\n';
          fs.writeFileSync('pc/dist/fbconfig.js', cfg);
          /* きろく用：気分（いちばん上の 3つ）・ねむけ・顔の イラスト */
          function stmt(a) { const i = s.indexOf(a); if (i < 0) { console.error('not found: ' + a); process.exit(1); } let d = 0, k = s.indexOf('[', i); for (; k < s.length; k++) { if (s[k] === '[') d++; else if (s[k] === ']') { d--; if (d === 0) break; } } return s.slice(s.indexOf('[', i), k + 1); }
          const vm = require('vm');
          const M = vm.runInNewContext('(' + stmt('var MOOD3=') + ')').map((x) => ({ e: x.e, l: x.l }));
          const Y = vm.runInNewContext('(' + stmt('var KR_SLPY=') + ')');
          fs.writeFileSync('pc/dist/rec.js', 'window.ZZREC=' + JSON.stringify({ mood: M, slpy: Y }) + ';\n' + fn('_krFace') + '\n');
          console.log('prep ok');
          /* サイトの「きろくの うつりかわり」グラフを そのまま 取り出す（PC版の グラフ用） */
          function graphJS(s) {
            const FN = ['buildRecGraph','_buildBedGraph','_buildMoodGraph','_buildWakeGraph','_circMean','_dayMid','_floatHM','_graphAnchorCalc','_graphCont','_graphHourLines','_graphRange','_graphSpan','_graphWrap','_graphYf','_moodMap','_moodVal','_recDot','_recHM','_sleepDurColor','_sleepDurOf','dk','fmtHM','getProfile','getSleepLog','getSleepTs','getWakeLog','hx','lsGet','profileWake','profileWakeHM','rgb','jstKey','addDays'];
            const VARS = ['DEFAULT_WAKE','GRAPH_ANCHOR','MMOOD_KEY','PROF_KEY','SLEEPTS_KEY','SLEEP_KEY','_MOOD_VAL','_recGraphModes','WAKELOG_KEY'];
            function fn(name) { const i = s.indexOf('function ' + name + '('); if (i < 0) throw new Error('graph fn not found: ' + name); let d = 0, k = i, st = false; for (; k < s.length; k++) { const c = s[k]; if (c === '{') { d++; st = true; } else if (c === '}') { d--; if (st && d === 0) break; } } return s.slice(i, k + 1); }
            function stmt(name) {
              const re = new RegExp('(^|\\n)[ \\t]*(var|const|let)\\s[^;\\n]*?\\b' + name.replace(/\$/g, '\\$') + '\\s*=', 'g'); const m = re.exec(s);
              if (!m) throw new Error('graph var not found: ' + name);
              const st = m.index + m[1].length; let d = 0, q = null, k = st;
              for (; k < s.length; k++) { const c = s[k]; if (q) { if (c === '\\') { k++; continue; } if (c === q) q = null; continue; } if (c === '"' || c === "'" || c === '`') { q = c; continue; } if ('([{'.includes(c)) d++; else if (')]}'.includes(c)) d--; else if (c === ';' && d === 0) break; }
              return s.slice(st, k + 1).replace(/^\s*(const|let)\s/, 'var ');
            }
            const seen = new Set(); let out = '';
            VARS.forEach((v) => { const t = stmt(v); if (!seen.has(t)) { seen.add(t); out += t + '\n'; } });
            FN.forEach((f) => { out += fn(f) + '\n'; });
            return out;
          }
          fs.writeFileSync('pc/dist/graph.js', graphJS(s));
          console.log('graph ok');
          ZZEOF
          sed -i "s/0\.3\.RUNNUM/0.3.$GITHUB_RUN_NUMBER/" pc/src-tauri/tauri.conf.json
          grep '"version"' pc/src-tauri/tauri.conf.json
          node pc/prep.js
          rm pc/prep.js
      - name: アイコンを 大きくする（1024px）
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $src = [System.Drawing.Image]::FromFile("$PWD\pc\dist\icon192.png")
          $bmp = New-Object System.Drawing.Bitmap 1024, 1024
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
          $g.PixelOffsetMode = [System.Drawing.Drawing2D.PixelOffsetMode]::HighQuality
          $g.DrawImage($src, 0, 0, 1024, 1024)
          $bmp.Save("$PWD\pc\app-icon.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose(); $bmp.Dispose(); $src.Dispose()
          Remove-Item "$PWD\pc\dist\icon192.png"
      - name: PC版を 作る
        working-directory: pc
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          npm install
          npx tauri icon app-icon.png
          npx tauri build
          ls src-tauri/target/release/bundle/nsis
      - name: Releases に のせる（インストーラー と 自動アップデート用の latest.json）
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="0.3.$GITHUB_RUN_NUMBER"
          EXE=$(ls pc/src-tauri/target/release/bundle/nsis/*-setup.exe | head -n 1)
          cp "$EXE" zzcard-setup.exe
          SIG=$(cat "$EXE.sig")
          printf '{"version":"%s","notes":"PC版 %s","pub_date":"%s","platforms":{"windows-x86_64":{"signature":"%s","url":"https://github.com/zzcafe2800/zzcard/releases/download/v%s/zzcard-setup.exe"}}}\n' "$VER" "$VER" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$SIG" "$VER" > latest.json
          cat latest.json
          ls -la zzcard-setup.exe
          git tag "v$VER"
          git push origin "v$VER"
          gh release create "v$VER" zzcard-setup.exe latest.json --title "PC版 $VER" --notes "ズズラジオ体操部 PC版 $VER（かるい 版）" --latest
