# ズズラジオ体操部 PC版（Windows・かるい Tauri 版）を つくる
# Actions の「PC版をつくる」→「Run workflow」で、Releases に zzcard-setup.exe（数MB）と latest.json（自動アップデート用）が できる。
# 景色・猫の うごき・グラフ・Firebaseの 設定は、作る時に サイトの index.html から 取り出す。
# 自動アップデートの 署名には、リポジトリの Secrets の TAURI_SIGNING_PRIVATE_KEY を 使う。
name: PC版をつくる
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "pc/src-tauri -> target"
      - name: PC版の ファイルを 組み立てる
        shell: bash
        run: |
          mkdir -p pc/dist pc/src-tauri/src pc/src-tauri/capabilities
          cat > pc/package.json << 'ZZEOF'
          { "name": "zzcard-pc", "private": true, "devDependencies": { "@tauri-apps/cli": "^2.12.0" } }
          ZZEOF
          cat > pc/src-tauri/Cargo.toml << 'ZZEOF'
          [package]
          name = "zzcard"
          version = "0.3.0"
          edition = "2021"

          [build-dependencies]
          tauri-build = { version = "2", features = [] }

          [dependencies]
          tauri = { version = "2", features = [] }
          tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
          tauri-plugin-deep-link = "2"
          tauri-plugin-global-shortcut = "2"
          tauri-plugin-autostart = "2"
          tauri-plugin-updater = "2"
          tauri-plugin-notification = "2"
          serde = { version = "1", features = ["derive"] }
          serde_json = "1"
          chrono = "0.4"

          [profile.release]
          codegen-units = 1
          lto = true
          opt-level = "s"
          panic = "abort"
          strip = true
          ZZEOF
          cat > pc/src-tauri/build.rs << 'ZZEOF'
          fn main() {
              tauri_build::build()
          }
          ZZEOF
          cat > pc/src-tauri/tauri.conf.json << 'ZZEOF'
          {
            "$schema": "https://schema.tauri.app/config/2",
            "productName": "ズズラジオ体操部",
            "mainBinaryName": "zzcard",
            "version": "0.3.RUNNUM",
            "identifier": "io.github.zzcafe2800.zzcard",
            "build": { "frontendDist": "../dist" },
            "app": { "withGlobalTauri": true, "security": { "csp": null }, "windows": [] },
            "bundle": {
              "active": true,
              "targets": ["nsis"],
              "createUpdaterArtifacts": true,
              "icon": ["icons/32x32.png", "icons/128x128.png", "icons/128x128@2x.png", "icons/icon.ico"],
              "windows": { "nsis": { "installMode": "currentUser" } }
            },
            "plugins": {
              "updater": { "pubkey": "dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDlBMzA2MEI0OTUyMDdGQzkKUldUSmZ5Q1Z0R0F3bXJoWWJSZGUvdnJ3Qlp0Vi9iT3c5Z2xiOFkyUlU0NEVLV2dBVklHRWFXUnoK", "endpoints": ["https://github.com/zzcafe2800/zzcard/releases/latest/download/latest.json"], "windows": { "installMode": "passive" } },
              "deep-link": { "desktop": { "schemes": ["zzcard"] } }
            }
          }
          ZZEOF
          cat > pc/src-tauri/capabilities/default.json << 'ZZEOF'
          {
            "$schema": "../gen/schemas/desktop-schema.json",
            "identifier": "default",
            "windows": ["*"],
            "permissions": ["core:default", "core:window:allow-start-dragging"]
          }
          ZZEOF
          cat > pc/src-tauri/src/main.rs << 'ZZEOF'
          // ズズラジオ体操部 PC版（Tauri・かるい 版）
          // ・はじめての 時だけ 設定（つなぐ → 壁紙／タスクバー／全画面 → はじめる）
          // ・Ctrl+Alt+P で きろく（この まどは タスクバーにも いて、閉じると PC版ごと おわる）・Ctrl+Alt+Shift+P で 設定
          // ・タスクバーの 位置を 本当に 調べて、猫の 足を タスクバーの 上の ふちに。タスクバーが 消えたら 猫も 消える
          // ・全画面の 時・画面ロック中は 止める（全画面モードは ロック中だけ）。起きる 時刻に 知らせる。今日の タップ数を 数える
          #![cfg_attr(not(debug_assertions), windows_subsystem = "windows")]

          use std::sync::{Arc, Mutex};
          use std::time::Duration;

          use chrono::Timelike;
          use serde_json::{json, Value};
          use tauri::{AppHandle, Emitter, Manager, PhysicalPosition, PhysicalSize, WebviewUrl, WebviewWindowBuilder, WindowEvent};
          use tauri_plugin_autostart::{MacosLauncher, ManagerExt};
          use tauri_plugin_global_shortcut::{Code, GlobalShortcutExt, Modifiers, Shortcut, ShortcutState};
          use tauri_plugin_notification::NotificationExt;
          use tauri_plugin_updater::UpdaterExt;

          /* 壁紙の まどは デスクトップの アイコンの 層の うしろに あるので、WebView2 が「かくれて いる」と 思って
             描くのを 止める ことが ある → 止めない 合図。WebView2 は 全部の まどで 同じ 合図に しないと まどが 作れない */
          const WV_ARGS: &str = "--disable-features=msWebOOUI,msPdfOOUI,msSmartScreenProtection,CalculateNativeWinOcclusion --disable-background-timer-throttling --disable-renderer-backgrounding --disable-backgrounding-occluded-windows";
          struct Zz {
              s: Mutex<Value>,
              taps: Mutex<(String, u64)>,
              sent: Mutex<i64>,
              paused: Mutex<bool>,
              wake: Mutex<Option<f64>>,
              link: Mutex<Option<String>>,
              cats: Mutex<String>,
              seq: Mutex<u32>,
              bar_shown: Mutex<bool>,
              tab: Mutex<Option<String>>,
              wall: Mutex<String>,
              update: Mutex<Option<String>>,
          }
          type St = Arc<Zz>;

          fn today() -> String { chrono::Local::now().format("%Y-%m-%d").to_string() }
          fn data_path(app: &AppHandle, f: &str) -> std::path::PathBuf {
              let d = app.path().app_data_dir().unwrap_or_else(|_| std::env::temp_dir());
              let _ = std::fs::create_dir_all(&d);
              d.join(f)
          }
          fn log(app: &AppHandle, m: &str) {
              use std::io::Write;
              if let Ok(mut f) = std::fs::OpenOptions::new().create(true).append(true).open(data_path(app, "log.txt")) {
                  let _ = writeln!(f, "{} {}", chrono::Local::now().format("%Y-%m-%d %H:%M:%S"), m);
              }
          }
          fn load_state(app: &AppHandle) -> Value {
              let def = json!({"uid":"","mode":"wall","setupDone":false,"wakeDay":"","hideSleep":false,"noEmo":false,"noShare":false,"autoStart":false,"countTaps":false,"lowQ":false,"catScale":1.0,"cardWall":true,"cardBar":false,"noTapShow":false,"sleepMode":"show","wallOn":false,"sceneTier":0,"sceneTime":"auto"});
              let mut v = std::fs::read_to_string(data_path(app, "state.json")).ok().and_then(|t| serde_json::from_str::<Value>(&t).ok()).unwrap_or(json!({}));
              if !v.is_object() { v = json!({}); }
              if let (Some(o), Some(d)) = (v.as_object_mut(), def.as_object()) {
                  for (k, x) in d { if !o.contains_key(k) { o.insert(k.clone(), x.clone()); } }
              }
              v
          }
          fn save_state(app: &AppHandle, st: &St) {
              let mut v = st.s.lock().unwrap().clone();
              let t = st.taps.lock().unwrap().clone();
              if let Some(o) = v.as_object_mut() { o.insert("taps".into(), json!({"day": t.0, "n": t.1})); }
              let _ = std::fs::write(data_path(app, "state.json"), v.to_string());
          }
          fn sget(st: &St, k: &str) -> Value { st.s.lock().unwrap().get(k).cloned().unwrap_or(Value::Null) }
          fn sbool(st: &St, k: &str) -> bool { sget(st, k).as_bool().unwrap_or(false) }
          fn sstr(st: &St, k: &str) -> String { sget(st, k).as_str().unwrap_or("").to_string() }
          fn cats_label(st: &St) -> String { st.cats.lock().unwrap().clone() }
          fn link_from(a: &[String]) -> Option<String> {
              a.iter().find(|x| x.starts_with("zzcard://")).and_then(|u| u.split("c=").nth(1)).map(|c| c.chars().take_while(|ch| ch.is_ascii_alphanumeric()).collect::<String>()).filter(|c| !c.is_empty())
          }
          /* タスクバーの 高さ（画面の 単位）。カードを その すぐ 上に 置く */
          fn taskbar_h(app: &AppHandle) -> i64 {
              primary(app).and_then(|(mx, my, mw, mh, sc)| win::taskbar(mx, my, mw, mh).filter(|t| t.1).map(|t| (((my + mh) - t.0) as f64 / sc).round() as i64)).unwrap_or(48).max(0)
          }
          fn primary(app: &AppHandle) -> Option<(i32, i32, i32, i32, f64)> {
              let m = app.primary_monitor().ok().flatten()?;
              Some((m.position().x, m.position().y, m.size().width as i32, m.size().height as i32, m.scale_factor()))
          }

          /* ===== Windows の 部品（タスクバーの 位置・壁紙の うしろ・全画面の 判定） ===== */
          #[cfg(windows)]
          mod win {
              #[repr(C)]
              #[derive(Default, Clone, Copy)]
              pub struct Rect { pub left: i32, pub top: i32, pub right: i32, pub bottom: i32 }
              #[link(name = "user32")]
              extern "system" {
                  fn FindWindowW(cls: *const u16, name: *const u16) -> isize;
                  fn FindWindowExW(parent: isize, after: isize, cls: *const u16, name: *const u16) -> isize;
                  fn SendMessageTimeoutW(h: isize, msg: u32, wp: usize, lp: isize, flags: u32, timeout: u32, res: *mut usize) -> isize;
                  fn SetParent(child: isize, parent: isize) -> isize;
                  fn SetWindowPos(h: isize, after: isize, x: i32, y: i32, cx: i32, cy: i32, flags: u32) -> i32;
                  fn EnumWindows(cb: extern "system" fn(isize, isize) -> i32, lp: isize) -> i32;
                  fn GetWindowRect(h: isize, r: *mut Rect) -> i32;
                  fn IsWindowVisible(h: isize) -> i32;
                  fn RedrawWindow(h: isize, r: *const Rect, rgn: isize, flags: u32) -> i32;
              }
              #[link(name = "user32")]
              extern "system" {
                  fn GetForegroundWindow() -> isize;
                  fn GetCursorPos(p: *mut Pt) -> i32;
                  fn GetAsyncKeyState(vk: i32) -> i16;
                  fn GetClassNameW(h: isize, buf: *mut u16, n: i32) -> i32;
                  fn IsZoomed(h: isize) -> i32;
                  fn RegisterClassExW(wc: *const WndClass) -> u16;
                  fn CreateWindowExW(ex: u32, cls: *const u16, name: *const u16, style: u32, x: i32, y: i32, w: i32, h: i32, parent: isize, menu: isize, inst: isize, param: *mut std::ffi::c_void) -> isize;
                  fn DefWindowProcW(h: isize, msg: u32, wp: usize, lp: isize) -> isize;
                  fn GetMessageW(msg: *mut Msg, h: isize, min: u32, max: u32) -> i32;
                  fn TranslateMessage(msg: *const Msg) -> i32;
                  fn DispatchMessageW(msg: *const Msg) -> isize;
                  fn RegisterRawInputDevices(devs: *const RawDev, n: u32, size: u32) -> i32;
                  fn GetRawInputData(h: isize, cmd: u32, data: *mut std::ffi::c_void, size: *mut u32, hsize: u32) -> u32;
              }
              #[link(name = "kernel32")]
              extern "system" { fn GetModuleHandleW(name: *const u16) -> isize; }
              #[link(name = "shell32")]
              extern "system" {
                  fn SHQueryUserNotificationState(state: *mut i32) -> i32;
              }
              #[repr(C)] pub struct WndClass { size: u32, style: u32, proc_: extern "system" fn(isize, u32, usize, isize) -> isize, cls_extra: i32, wnd_extra: i32, inst: isize, icon: isize, cursor: isize, bg: isize, menu: *const u16, name: *const u16, icon_sm: isize }
              #[repr(C)] pub struct Msg { hwnd: isize, message: u32, wp: usize, lp: isize, time: u32, x: i32, y: i32, private: u32 }
              #[repr(C)] pub struct RawDev { page: u16, usage: u16, flags: u32, target: isize }
              #[repr(C)] #[derive(Default, Clone, Copy)] pub struct Pt { pub x: i32, pub y: i32 }
              pub fn cursor() -> Option<(i32, i32)> { unsafe { let mut p = Pt::default(); if GetCursorPos(&mut p) != 0 { Some((p.x, p.y)) } else { None } } }
              pub static BACKS: std::sync::atomic::AtomicU64 = std::sync::atomic::AtomicU64::new(0);
              /* いま その キーが 全部 押されて いるか（操作モードの 長押し 判定） */
              pub fn keys_held(vks: &[i32]) -> bool { unsafe { vks.iter().all(|&k| GetAsyncKeyState(k) < 0) } }
              #[repr(C)] #[derive(Clone, Copy)] struct RawHeader { kind: u32, size: u32, device: isize, wp: usize }
              #[repr(C)] #[derive(Clone, Copy)] struct RawKb { make: u16, flags: u16, reserved: u16, vkey: u16, message: u32, extra: u32 }
              #[repr(C)] #[derive(Clone, Copy)] struct RawInputKb { h: RawHeader, kb: RawKb }
              /* 今日の タップ数（押した 回数だけ）。押しっぱなしは 数えない */
              pub static TAPS: std::sync::atomic::AtomicU64 = std::sync::atomic::AtomicU64::new(0);
              static mut DOWN: [bool; 256] = [false; 256];
              extern "system" fn raw_proc(h: isize, msg: u32, wp: usize, lp: isize) -> isize {
                  unsafe {
                      if msg == 0x00FF {
                          let mut buf: RawInputKb = std::mem::zeroed();
                          let mut size = std::mem::size_of::<RawInputKb>() as u32;
                          let r = GetRawInputData(lp, 0x1000_0003, &mut buf as *mut RawInputKb as *mut std::ffi::c_void, &mut size, std::mem::size_of::<RawHeader>() as u32);
                          if r != u32::MAX && buf.h.kind == 1 {
                              let vk = (buf.kb.vkey & 0xFF) as usize;
                              if vk != 0xFF && vk != 0 {
                                  let d = std::ptr::addr_of_mut!(DOWN);
                                  if buf.kb.flags & 1 != 0 { (*d)[vk] = false; }
                                  else if !(*d)[vk] { (*d)[vk] = true; TAPS.fetch_add(1, std::sync::atomic::Ordering::Relaxed); if vk == 0x08 { BACKS.fetch_add(1, std::sync::atomic::Ordering::Relaxed); } }
                              }
                          }
                      }
                      DefWindowProcW(h, msg, wp, lp)
                  }
              }
              /* キーボードの 知らせだけを 受け取る（Raw Input）。ほかの アプリの 入力には 割りこまないので ゲームが 遅れない。マウスは 見ない */
              pub fn keys_loop() {
                  unsafe {
                      let inst = GetModuleHandleW(std::ptr::null());
                      let cls = w("zzRawKeys");
                      let wc = WndClass { size: std::mem::size_of::<WndClass>() as u32, style: 0, proc_: raw_proc, cls_extra: 0, wnd_extra: 0, inst, icon: 0, cursor: 0, bg: 0, menu: std::ptr::null(), name: cls.as_ptr(), icon_sm: 0 };
                      RegisterClassExW(&wc);
                      let hwnd = CreateWindowExW(0, cls.as_ptr(), cls.as_ptr(), 0, 0, 0, 0, 0, -3, 0, inst, std::ptr::null_mut());
                      if hwnd == 0 { return; }
                      let dev = RawDev { page: 1, usage: 6, flags: 0x0000_0100, target: hwnd };
                      if RegisterRawInputDevices(&dev, 1, std::mem::size_of::<RawDev>() as u32) == 0 { return; }
                      let mut msg: Msg = std::mem::zeroed();
                      while GetMessageW(&mut msg, 0, 0, 0) > 0 { TranslateMessage(&msg); DispatchMessageW(&msg); }
                  }
              }
              /* 前に 出ている まど：(画面 全部を おおう ＝ ゲームや 動画の 全画面, デスクトップが かくれる ＝ 全画面・最大化・ほぼ 全部) */
              pub fn fg_state(mx: i32, my: i32, mw: i32, mh: i32) -> (bool, bool) {
                  unsafe {
                      let h = GetForegroundWindow(); if h == 0 { return (false, false); }
                      let mut buf = [0u16; 64]; let n = GetClassNameW(h, buf.as_mut_ptr(), 64);
                      let cls = String::from_utf16_lossy(&buf[..n.max(0) as usize]);
                      if ["Progman", "WorkerW", "Shell_TrayWnd", "Shell_SecondaryTrayWnd"].contains(&cls.as_str()) { return (false, false); }
                      let mut r = Rect::default(); if GetWindowRect(h, &mut r) == 0 { return (false, false); }
                      let full = r.left <= mx && r.top <= my && r.right >= mx + mw && r.bottom >= my + mh;
                      let iw = (r.right.min(mx + mw) - r.left.max(mx)).max(0) as i64;
                      let ih = (r.bottom.min(my + mh) - r.top.max(my)).max(0) as i64;
                      let big = iw * ih * 100 >= (mw as i64) * (mh as i64) * 85;   /* メインの 画面の 85%以上を おおって いる */
                      (full, full || big)
                  }
              }
              fn w(s: &str) -> Vec<u16> { s.encode_utf16().chain(std::iter::once(0)).collect() }
              /* タスクバー：上の ふちの y・画面の 下に あるか・見えて いるか（自動で かくれて いる 時は false） */
              pub fn taskbar(mx: i32, my: i32, mw: i32, mh: i32) -> Option<(i32, bool, bool)> {
                  unsafe {
                      let c = w("Shell_TrayWnd");
                      let h = FindWindowW(c.as_ptr(), std::ptr::null());
                      if h == 0 { return None; }
                      let mut r = Rect::default();
                      if GetWindowRect(h, &mut r) == 0 { return None; }
                      let width = r.right - r.left;
                      let bottom = width >= mw / 2 && r.top > my + mh / 2;
                      let seen = r.bottom.min(my + mh) - r.top.max(my);
                      let _ = mx;
                      Some((r.top, bottom, IsWindowVisible(h) != 0 && seen >= 10))
                  }
              }
              extern "system" fn find_worker(top: isize, lp: isize) -> i32 {
                  unsafe {
                      let dv = w("SHELLDLL_DefView");
                      if FindWindowExW(top, 0, dv.as_ptr(), std::ptr::null()) != 0 {
                          let wk = w("WorkerW");
                          let out = lp as *mut isize;
                          *out = FindWindowExW(0, top, wk.as_ptr(), std::ptr::null());
                      }
                  }
                  1
              }
              /* 壁紙：アイコンの うしろに まどを 入れる（Windows 11 24H2 と それより 前の 両方） */
              pub fn attach(h: isize, width: i32, height: i32) -> Result<&'static str, String> {
                  unsafe {
                      let pm = w("Progman");
                      let progman = FindWindowW(pm.as_ptr(), std::ptr::null());
                      if progman == 0 { return Err("progman".into()); }
                      let mut res: usize = 0;
                      SendMessageTimeoutW(progman, 0x052C, 0xD, 0x1, 0, 1000, &mut res);
                      SendMessageTimeoutW(progman, 0x052C, 0, 0, 0, 1000, &mut res);
                      let dv = w("SHELLDLL_DefView");
                      let wk = w("WorkerW");
                      let def_in = FindWindowExW(progman, 0, dv.as_ptr(), std::ptr::null());
                      let wk_in = FindWindowExW(progman, 0, wk.as_ptr(), std::ptr::null());
                      if def_in != 0 && wk_in != 0 {
                          SetParent(h, progman);
                          SetWindowPos(h, def_in, 0, 0, width, height, 0x0010 | 0x0040);
                          return Ok("24h2");
                      }
                      let mut worker: isize = 0;
                      EnumWindows(find_worker, &mut worker as *mut isize as isize);
                      if worker == 0 { return Err(format!("workerw def_in={} wk_in={}", def_in != 0, wk_in != 0)); }
                      SetParent(h, worker);
                      SetWindowPos(h, 0, 0, 0, width, height, 0x0010 | 0x0040);
                      Ok("classic")
                  }
              }
              pub fn redraw() {
                  unsafe {
                      let pm = w("Progman");
                      let p = FindWindowW(pm.as_ptr(), std::ptr::null());
                      if p != 0 { RedrawWindow(p, std::ptr::null(), 0, 0x0001 | 0x0004 | 0x0080 | 0x0100); }
                  }
              }
              /* 1=ロック・スクリーンセーバー 2=全画面 3=全画面ゲーム 4=プレゼン */
              pub fn quns() -> i32 { unsafe { let mut s: i32 = 0; if SHQueryUserNotificationState(&mut s) == 0 { s } else { 0 } } }
          }
          #[cfg(not(windows))]
          mod win {
              pub fn taskbar(_: i32, _: i32, _: i32, _: i32) -> Option<(i32, bool, bool)> { None }
              pub fn attach(_: isize, _: i32, _: i32) -> Result<&'static str, String> { Err("not windows".into()) }
              pub fn redraw() {}
              pub fn quns() -> i32 { 0 }
              pub static TAPS: std::sync::atomic::AtomicU64 = std::sync::atomic::AtomicU64::new(0);
              pub fn keys_loop() {}
              pub fn fg_state(_: i32, _: i32, _: i32, _: i32) -> (bool, bool) { (false, false) }
              pub static BACKS: std::sync::atomic::AtomicU64 = std::sync::atomic::AtomicU64::new(0);
              pub fn cursor() -> Option<(i32, i32)> { None }
              pub fn keys_held(_: &[i32]) -> bool { false }
          }

          /* ===== まど ===== */
          fn open_setup(app: &AppHandle) {
              if let Some(w) = app.get_webview_window("setup") { let _ = w.unminimize(); let _ = w.show(); let _ = w.set_focus(); return; }
              let r = WebviewWindowBuilder::new(app, "setup", WebviewUrl::App("setup.html".into()))
                  .additional_browser_args(WV_ARGS)
                  .title("ズズラジオ体操部").inner_size(620.0, 800.0).resizable(false).maximizable(false).build();
              match r {
                  Ok(w) => {
                      let a = app.clone();
                      w.on_window_event(move |e| {
                          if let WindowEvent::Destroyed = e {
                              let st = a.state::<St>().inner().clone();
                              let lb = cats_label(&st);
                              if lb.is_empty() || a.get_webview_window(&lb).is_none() { a.exit(0); }
                          }
                      });
                  }
                  Err(e) => log(app, &format!("setup window {}", e)),
              }
          }
          fn open_panel(app: &AppHandle, show: bool) {
              if let Some(w) = app.get_webview_window("panel") {
                  if !show { return; }
                  let min = w.is_minimized().unwrap_or(false);
                  let vis = w.is_visible().unwrap_or(false);
                  let foc = w.is_focused().unwrap_or(false);
                  if min || !vis || !foc {
                      let _ = w.unminimize(); let _ = w.show(); let _ = w.set_focus();
                      let _ = app.emit_to("panel", "zz-panel-open", ());
                  } else { let _ = w.minimize(); }
                  return;
              }
              let Some((mx, my, _mw, mh, sc)) = primary(app) else { return };
              let lh = ((mh as f64) / sc - 120.0).min(840.0).max(560.0);
              let r = WebviewWindowBuilder::new(app, "panel", WebviewUrl::App("panel.html".into()))
                  .additional_browser_args(WV_ARGS)
                  .title("ズズラジオ体操部").inner_size(420.0, lh).resizable(false).maximizable(false)
                  .decorations(false).transparent(true).shadow(false).always_on_top(true).visible(false).build();
              match r {
                  Ok(w) => {
                      let _ = w.set_position(PhysicalPosition::new(mx + (24.0 * sc) as i32, my + mh - ((lh + 80.0) * sc) as i32));
                      let a = app.clone();
                      w.on_window_event(move |e| { if let WindowEvent::CloseRequested { .. } = e { a.exit(0); } });
                      let _ = w.show();
                      if show { let _ = w.set_focus(); } else { let _ = w.minimize(); }
                  }
                  Err(e) => log(app, &format!("panel window {}", e)),
              }
          }
          /* キーの 回数を 数える しくみ（Raw Input）は「数える」に した 人だけ・1回だけ 始める */
          static KEYS_ON: std::sync::atomic::AtomicBool = std::sync::atomic::AtomicBool::new(false);
          static P_HOLD: std::sync::atomic::AtomicBool = std::sync::atomic::AtomicBool::new(false);
          /* 操作モード：猫の まどが クリックを 受け取る（タスクバー・全画面だけ） */
          fn set_op(app: &AppHandle, on: bool) {
              let st = app.state::<St>().inner().clone();
              if on && sstr(&st, "mode") == "wall" {
                  let _ = app.notification().builder().title("ズズラジオ体操部").body("操作モードは タスクバーか 全画面で 使えるよ").show();
                  return;
              }
              let lb = cats_label(&st);
              if let Some(w) = app.get_webview_window(&lb) { let _ = w.set_ignore_cursor_events(!on); }
              let _ = app.emit_to(lb.as_str(), "zz-op", on);
          }
          fn start_keys(st: &St) {
              if !sbool(st, "countTaps") { return; }
              if KEYS_ON.swap(true, std::sync::atomic::Ordering::SeqCst) { return; }
              std::thread::spawn(|| win::keys_loop());
          }
          /* きろくの まどを 前に 出して、タブ（せってい など）を 開く */
          fn show_panel_tab(app: &AppHandle, tab: &str) {
              let st = app.state::<St>().inner().clone();
              *st.tab.lock().unwrap() = Some(tab.to_string());
              if app.get_webview_window("panel").is_none() { open_panel(app, true); }
              if let Some(w) = app.get_webview_window("panel") { let _ = w.unminimize(); let _ = w.show(); let _ = w.set_focus(); }
              let _ = app.emit_to("panel", "zz-panel-open", tab);
          }
          fn open_cats(app: &AppHandle, st: &St) {
              let old = cats_label(st);
              if let Some(w) = app.get_webview_window(&old) { let _ = w.destroy(); }
              let oldw = st.wall.lock().unwrap().clone();
              if !oldw.is_empty() { if let Some(w) = app.get_webview_window(&oldw) { let _ = w.destroy(); } *st.wall.lock().unwrap() = String::new(); win::redraw(); }
              let n = { let mut q = st.seq.lock().unwrap(); *q += 1; *q };
              let label = format!("cats{}", n);
              *st.cats.lock().unwrap() = label.clone();
              *st.bar_shown.lock().unwrap() = false;
              *st.sent.lock().unwrap() = -1;
              let mode = sstr(st, "mode");
              /* json! の 中で { } の 計算は できないので、先に 計算して おく */
              let cw = sget(st, "cardW").as_str().map(|s| s.to_string()).unwrap_or_else(|| if sget(st, "cardWall").as_bool().unwrap_or(true) { "corner".to_string() } else { "off".to_string() });
              let cb = sget(st, "cardB").as_str().map(|s| s.to_string()).unwrap_or_else(|| if sbool(st, "cardBar") { "corner".to_string() } else { "off".to_string() });
              let card_v = match (if mode == "wall" { cw } else { cb }).as_str() { "corner" => "1", "head" => "h", _ => "0" };
              let mv_v = { let v = sstr(st, "motion"); if v.is_empty() { "normal".to_string() } else { v } };
              let q = json!({
                  "mode": mode, "uid": sstr(st, "uid"),
                  "sleep": match sstr(st, "sleepMode").as_str() { "hide" => "0", "wake" => "2", "show" => "1", _ => if sbool(st, "hideSleep") { "0" } else { "1" } },
                  "emo": if sbool(st, "noEmo") { "0" } else { "1" },
                  "share": if sbool(st, "noShare") { "0" } else { "1" },
                  "q": if sbool(st, "lowQ") { "lo" } else { "hi" },
                  "tp": if sbool(st, "noTapShow") { "0" } else { "1" },
                  "st": sget(st, "sceneTier").as_i64().unwrap_or(0).to_string(),
                  "tm": sstr(st, "sceneTime"),
                  "tb": taskbar_h(app).to_string(),
                  "card": card_v,
                  "mv": mv_v,
                  "sz": sget(st, "catScale").as_f64().unwrap_or(1.0).to_string()
              });
              let r = WebviewWindowBuilder::new(app, &label, WebviewUrl::App("cats.html".into()))
                  .additional_browser_args(WV_ARGS)
                  .initialization_script(&format!("window.__ZZQ={};", q))
                  .title("zz").transparent(mode != "wall").decorations(false).shadow(false).skip_taskbar(true)
                  .resizable(false).focused(false).visible(false).always_on_top(mode != "wall").build();
              let w = match r { Ok(w) => w, Err(e) => { log(app, &format!("cats window {}", e)); return; } };
              let _ = w.set_ignore_cursor_events(true);
              let Some((mx, my, mw, mh, sc)) = primary(app) else { return };
              match mode.as_str() {
                  "wall" => {
                      let _ = w.set_position(PhysicalPosition::new(mx, my));
                      let _ = w.set_size(PhysicalSize::new(mw as u32, mh as u32));
                      let _ = w.show();
                      let a = app.clone();
                      let st2 = st.clone();
                      let lb = label.clone();
                      std::thread::spawn(move || {
                          std::thread::sleep(Duration::from_millis(700));
                          let Some(w) = a.get_webview_window(&lb) else { return };
                          let h = w.hwnd().map(|h| h.0 as isize).unwrap_or(0);
                          let r = if h != 0 { win::attach(h, mw, mh) } else { Err("hwnd".into()) };
                          log(&a, &format!("wallpaper attach {:?}", r));
                          if r.is_err() {
                              if let Some(o) = st2.s.lock().unwrap().as_object_mut() { o.insert("mode".into(), json!("bar")); }
                              save_state(&a, &st2);
                              let _ = a.notification().builder().title("ズズラジオ体操部").body("壁紙に 出せなかったので、タスクバーに したよ").show();
                              open_cats(&a, &st2);
                          }
                      });
                  }
                  "full" => {
                      let h = (170.0 * sc) as i32;
                      let _ = w.set_position(PhysicalPosition::new(mx, my + mh - h));
                      let _ = w.set_size(PhysicalSize::new(mw as u32, h as u32));
                      let _ = w.show();
                  }
                  _ => { place_bar(app, st); }
              }
              if mode != "wall" && sbool(st, "wallOn") { open_wall_scene(app, st, n); }
              open_panel(app, false);
          }
          /* うしろの 景色の 壁紙（猫なし）。猫は タスクバー／全画面の まどに 出す */
          fn open_wall_scene(app: &AppHandle, st: &St, n: u32) {
              let label = format!("wall{}", n);
              let q = json!({ "mode": "wall", "nocats": "1", "uid": sstr(st, "uid"), "q": if sbool(st, "lowQ") { "lo" } else { "hi" }, "card": "0", "tp": "0",
                  "st": sget(st, "sceneTier").as_i64().unwrap_or(0).to_string(), "tm": sstr(st, "sceneTime") });
              let r = WebviewWindowBuilder::new(app, &label, WebviewUrl::App("cats.html".into()))
                  .additional_browser_args(WV_ARGS)
                  .initialization_script(&format!("window.__ZZQ={};", q))
                  .title("zz").transparent(false).decorations(false).shadow(false).skip_taskbar(true)
                  .resizable(false).focused(false).visible(false).always_on_top(false).build();
              let w = match r { Ok(w) => w, Err(e) => { log(app, &format!("wall scene window {}", e)); return; } };
              *st.wall.lock().unwrap() = label.clone();
              let _ = w.set_ignore_cursor_events(true);
              let Some((mx, my, mw, mh, _sc)) = primary(app) else { return };
              let _ = w.set_position(PhysicalPosition::new(mx, my));
              let _ = w.set_size(PhysicalSize::new(mw as u32, mh as u32));
              let _ = w.show();
              let a = app.clone();
              std::thread::spawn(move || {
                  std::thread::sleep(Duration::from_millis(700));
                  let Some(w) = a.get_webview_window(&label) else { return };
                  let h = w.hwnd().map(|h| h.0 as isize).unwrap_or(0);
                  let r = if h != 0 { win::attach(h, mw, mh) } else { Err("hwnd".into()) };
                  log(&a, &format!("wall scene attach {:?}", r));
                  if r.is_err() {
                      let _ = w.destroy();
                      let _ = a.notification().builder().title("ズズラジオ体操部").body("景色の 壁紙を 出せなかったよ").show();
                  }
              });
          }
          /* タスクバーモード：猫の 足を タスクバーの 上の ふちに。タスクバーが 消えたら 猫も 消える */
          fn place_bar(app: &AppHandle, st: &St) {
              if sstr(st, "mode") != "bar" { return; }
              let Some(w) = app.get_webview_window(&cats_label(st)) else { return };
              let Some((mx, my, mw, mh, sc)) = primary(app) else { return };
              let h = (170.0 * sc) as i32;
              let mut top = my + mh - (48.0 * sc) as i32;
              let mut show = !*st.paused.lock().unwrap();
              if let Some((t, bottom, vis)) = win::taskbar(mx, my, mw, mh) {
                  if bottom { top = t; if !vis { show = false; } } else { top = my + mh; }
              }
              let want = PhysicalPosition::new(mx, top - h);
              if w.outer_position().map(|p| p != want).unwrap_or(true) { let _ = w.set_position(want); }
              if w.outer_size().map(|s| s.width as i32 != mw || s.height as i32 != h).unwrap_or(true) { let _ = w.set_size(PhysicalSize::new(mw as u32, h as u32)); }
              let mut sh = st.bar_shown.lock().unwrap();
              if show && !*sh { let _ = w.show(); *sh = true; }
              if !show && *sh { let _ = w.hide(); *sh = false; }
          }
          fn apply_autostart(app: &AppHandle, st: &St) {
              let al = app.autolaunch();
              let r = if sbool(st, "autoStart") { al.enable() } else { al.disable() };
              if let Err(e) = r { log(app, &format!("autostart {}", e)); }
          }

          /* ===== 画面から よばれる もの ===== */
          #[tauri::command]
          fn zz_state(st: tauri::State<'_, St>) -> Value { st.s.lock().unwrap().clone() }
          #[tauri::command]
          fn zz_set(app: AppHandle, st: tauri::State<'_, St>, o: Value) -> Value {
              let st = st.inner().clone();
              {
                  let mut s = st.s.lock().unwrap();
                  if let (Some(a), Some(b)) = (s.as_object_mut(), o.as_object()) { for (k, v) in b { a.insert(k.clone(), v.clone()); } }
              }
              save_state(&app, &st);
              let v = st.s.lock().unwrap().clone();
              v
          }
          /* ★Windows では ボタンの 処理（同期）の 中で まどを 作ると 固まるので、async で 別の 作業に する */
          #[tauri::command]
          async fn zz_start(app: AppHandle, o: Value) -> Result<(), String> {
              let st = app.state::<St>().inner().clone();
              {
                  let mut s = st.s.lock().unwrap();
                  if let Some(a) = s.as_object_mut() {
                      let mode = o.get("mode").and_then(|m| m.as_str()).unwrap_or("wall");
                      a.insert("mode".into(), json!(if ["wall", "bar", "full"].contains(&mode) { mode } else { "wall" }));
                      for k in ["hideSleep", "noEmo", "noShare", "noTapShow", "lowQ", "wallOn"] { a.insert(k.into(), json!(o.get(k).and_then(|v| v.as_bool()).unwrap_or(false))); }
                      let hide = o.get("hideSleep").and_then(|v| v.as_bool()).unwrap_or(false);
                      let slm = o.get("sleepMode").and_then(|v| v.as_str()).unwrap_or(if hide { "hide" } else { "show" });
                      a.insert("sleepMode".into(), json!(if ["show", "wake", "hide"].contains(&slm) { slm } else { "show" }));   /* 寝ている子：出す／起こす／出さない */
                      let tier = o.get("sceneTier").and_then(|v| v.as_i64()).unwrap_or(0).max(0).min(7);
                      a.insert("sceneTier".into(), json!(tier));   /* 景色の 合目（0＝自動） */
                      let tm = o.get("sceneTime").and_then(|v| v.as_str()).unwrap_or("auto");
                      a.insert("sceneTime".into(), json!(if ["auto", "sky-dawn", "sky-morning", "sky-day", "sky-evening", "sky-night"].contains(&tm) { tm } else { "auto" }));
                      if let Some(r) = o.get("room") { if r.is_object() { a.insert("room".into(), r.clone()); } }   /* えらんだ お部屋 */
                      let mv = o.get("motion").and_then(|v| v.as_str()).unwrap_or("normal");
                      a.insert("motion".into(), json!(if ["normal", "calm", "still"].contains(&mv) { mv } else { "normal" }));   /* 猫の 動き */
                      for (k, d) in [("cardW", "corner"), ("cardB", "off")] {   /* ひとこと：左下／頭の上／出さない */
                          let v = o.get(k).and_then(|v| v.as_str()).unwrap_or(d);
                          a.insert(k.into(), json!(if ["corner", "head", "off"].contains(&v) { v } else { d }));
                      }
                      a.insert("autoStart".into(), json!(o.get("autoStart").and_then(|v| v.as_bool()).unwrap_or(false)));   /* PCを つけたら 開く：はじめは オフ */
                      a.insert("countTaps".into(), json!(o.get("countTaps").and_then(|v| v.as_bool()).unwrap_or(false)));   /* キーの 回数：数える 人だけ */
                      a.insert("cardWall".into(), json!(o.get("cardWall").and_then(|v| v.as_bool()).unwrap_or(true)));
                      a.insert("cardBar".into(), json!(o.get("cardBar").and_then(|v| v.as_bool()).unwrap_or(false)));
                      let sc = o.get("catScale").and_then(|v| v.as_f64()).unwrap_or(1.0).max(0.5).min(2.0);
                      a.insert("catScale".into(), json!(sc));
                      a.insert("setupDone".into(), json!(true));
                  }
              }
              save_state(&app, &st);
              apply_autostart(&app, &st);
              start_keys(&st);
              open_cats(&app, &st);
              if let Some(w) = app.get_webview_window("setup") { let _ = w.destroy(); }
              Ok(())
          }
          #[tauri::command]
          async fn zz_open_setup(app: AppHandle) -> Result<(), String> {
              let st = app.state::<St>().inner().clone();
              if sstr(&st, "uid").is_empty() { open_setup(&app); } else { show_panel_tab(&app, "settings"); }
              Ok(())
          }
          #[tauri::command]
          fn zz_panel_tab(st: tauri::State<'_, St>) -> Option<String> { st.tab.lock().unwrap().take() }
          #[tauri::command]
          fn zz_op(app: AppHandle, on: bool) { set_op(&app, on); }
          #[tauri::command]
          fn zz_update_info(st: tauri::State<'_, St>) -> Option<String> { st.update.lock().unwrap().clone() }
          #[tauri::command]
          async fn zz_update_install(app: AppHandle) -> Result<(), String> {
              let up = app.updater().map_err(|e| e.to_string())?;
              let found = up.check().await.map_err(|e| e.to_string())?;
              if let Some(u) = found {
                  u.download_and_install(|_, _| {}, || {}).await.map_err(|e| e.to_string())?;
                  app.restart();
              }
              Ok(())
          }
          #[tauri::command]
          fn zz_quit(app: AppHandle) { app.exit(0); }
          #[tauri::command]
          fn zz_hide_panel(app: AppHandle) { if let Some(w) = app.get_webview_window("panel") { let _ = w.minimize(); } }
          #[tauri::command]
          fn zz_recorded(app: AppHandle, st: tauri::State<'_, St>) { let lb = cats_label(st.inner()); let _ = app.emit_to(lb.as_str(), "zz-refresh", ()); }
          #[tauri::command]
          fn zz_set_wake(st: tauri::State<'_, St>, h: f64) { if h.is_finite() { *st.wake.lock().unwrap() = Some(h); } }
          #[tauri::command]
          fn zz_log(app: AppHandle, m: String) { log(&app, &m.chars().take(500).collect::<String>()); }
          #[tauri::command]
          fn zz_ready(app: AppHandle, st: tauri::State<'_, St>) { if let Some(c) = st.link.lock().unwrap().take() { let _ = app.emit_to("setup", "zz-link", c); } }

          fn main() {
              let st: St = Arc::new(Zz {
                  s: Mutex::new(json!({})), taps: Mutex::new((today(), 0)), sent: Mutex::new(-1), paused: Mutex::new(false),
                  wake: Mutex::new(None), link: Mutex::new(None), cats: Mutex::new(String::new()), seq: Mutex::new(0), bar_shown: Mutex::new(false), tab: Mutex::new(None), wall: Mutex::new(String::new()), update: Mutex::new(None),
              });
              tauri::Builder::default()
                  .plugin(tauri_plugin_single_instance::init(|app, argv, _cwd| {
                      let a = app.clone();
                      std::thread::spawn(move || {
                          if let Some(c) = link_from(&argv) {
                              let st = a.state::<St>().inner().clone();
                              *st.link.lock().unwrap() = Some(c.clone());
                              open_setup(&a);
                              let _ = a.emit_to("setup", "zz-link", c);
                          } else { open_panel(&a, true); }
                      });
                  }))
                  .plugin(tauri_plugin_deep_link::init())
                  .plugin(tauri_plugin_global_shortcut::Builder::new().with_handler(|app, sc, ev| {
                      if ev.state() != ShortcutState::Pressed { return; }
                      let settings = sc.matches(Modifiers::CONTROL | Modifiers::ALT | Modifiers::SHIFT, Code::KeyP);
                      let record = sc.matches(Modifiers::CONTROL | Modifiers::ALT, Code::KeyP);
                      if sc.matches(Modifiers::CONTROL | Modifiers::ALT, Code::KeyI) { let st = app.state::<St>().inner().clone(); let lb = cats_label(&st); let _ = app.emit_to(lb.as_str(), "zz-item", ()); return; }
                      if record && !P_HOLD.swap(true, std::sync::atomic::Ordering::SeqCst) {
                          let a2 = app.clone();
                          std::thread::spawn(move || {
                              let mut held = true;
                              for _ in 0..50 { std::thread::sleep(Duration::from_millis(100)); if !win::keys_held(&[0x11, 0x12, 0x50]) { held = false; break; } }
                              P_HOLD.store(false, std::sync::atomic::Ordering::SeqCst);
                              if held { if let Some(w) = a2.get_webview_window("panel") { let _ = w.minimize(); } set_op(&a2, true); }
                          });
                      }
                      let a = app.clone();
                      std::thread::spawn(move || {
                          if settings {
                              let st = a.state::<St>().inner().clone();
                              if sstr(&st, "uid").is_empty() { open_setup(&a); } else { show_panel_tab(&a, "settings"); }
                          } else if record { open_panel(&a, true); }
                      });
                  }).build())
                  .plugin(tauri_plugin_autostart::init(MacosLauncher::LaunchAgent, None))
                  .plugin(tauri_plugin_updater::Builder::new().build())
                  .plugin(tauri_plugin_notification::init())
                  .manage(st.clone())
                  .invoke_handler(tauri::generate_handler![zz_state, zz_set, zz_start, zz_open_setup, zz_quit, zz_hide_panel, zz_recorded, zz_set_wake, zz_log, zz_ready, zz_panel_tab, zz_update_info, zz_update_install, zz_op])
                  .setup(move |app| {
                      let h = app.handle().clone();
                      {
                          let v = load_state(&h);
                          if let Some(t) = v.get("taps") { if t.get("day").and_then(|d| d.as_str()) == Some(today().as_str()) { *st.taps.lock().unwrap() = (today(), t.get("n").and_then(|n| n.as_u64()).unwrap_or(0)); } }
                          *st.s.lock().unwrap() = v;
                      }
                      #[cfg(desktop)]
                      {
                          use tauri_plugin_deep_link::DeepLinkExt;
                          let _ = app.deep_link().register_all();
                      }
                      *st.link.lock().unwrap() = link_from(&std::env::args().collect::<Vec<_>>());
                      let _ = app.global_shortcut().register(Shortcut::new(Some(Modifiers::CONTROL | Modifiers::ALT), Code::KeyP));
                      let _ = app.global_shortcut().register(Shortcut::new(Some(Modifiers::CONTROL | Modifiers::ALT | Modifiers::SHIFT), Code::KeyP));
                      let _ = app.global_shortcut().register(Shortcut::new(Some(Modifiers::CONTROL | Modifiers::ALT), Code::KeyI));
                      apply_autostart(&h, &st);
                      let first = !sbool(&st, "setupDone") || sstr(&st, "uid").is_empty() || st.link.lock().unwrap().is_some();
                      if first { open_setup(&h); } else { open_cats(&h, &st); }

                      /* 今日の キーボードの タップ数：数える 人だけ（Raw Input・割りこまない・マウスは 見ない） */
                      start_keys(&st);
                      /* タップ数を 猫の 画面へ（1.5秒ごと）・ときどき 保存 */
                      let (a1, st1) = (h.clone(), st.clone());
                      std::thread::spawn(move || {
                          let mut saved: i64 = -1;
                          let mut since = std::time::Instant::now();
                          loop {
                              std::thread::sleep(Duration::from_millis(1500));
                              let add = win::TAPS.swap(0, std::sync::atomic::Ordering::Relaxed);
                              if !sbool(&st1, "countTaps") { continue; }   /* 数えない 人は 何も 送らない */
                              let n = { let mut t = st1.taps.lock().unwrap(); let d = today(); if t.0 != d { *t = (d, 0); } t.1 += add; t.1 as i64 };
                              let mut s = st1.sent.lock().unwrap();
                              if n != *s { *s = n; let lb = cats_label(&st1); let _ = a1.emit_to(lb.as_str(), "zz-taps", n); }
                              let bk = win::BACKS.swap(0, std::sync::atomic::Ordering::Relaxed);
                              if bk > 0 { let lb = cats_label(&st1); let _ = a1.emit_to(lb.as_str(), "zz-back", bk); }
                              drop(s);
                              if n != saved && since.elapsed() >= Duration::from_secs(10) { saved = n; since = std::time::Instant::now(); save_state(&a1, &st1); }   /* 10秒ごと（閉じる 時にも 保存） */
                          }
                      });
                      /* 止める／うごかす（3秒ごと）・タスクバーに あわせる（0.7秒ごと） */
                      let (a2, st2) = (h.clone(), st.clone());
                      std::thread::spawn(move || {
                          let mut k = 0u32;
                          loop {
                              std::thread::sleep(Duration::from_millis(700));
                              k += 1;
                              if k % 2 == 0 {
                                  let q = win::quns();
                                  let (fs, cover) = match primary(&a2) { Some((mx, my, mw, mh, _)) => win::fg_state(mx, my, mw, mh), None => (false, false) };
                                  let busy = match sstr(&st2, "mode").as_str() {
                                      "full" => q == 1 || q == 3,                          /* 全画面モード：ロック中・専用の 全画面ゲームの 時だけ */
                                      "wall" => (1..=4).contains(&q) || cover,             /* 壁紙：デスクトップが かくれて いる 時は 全部 止める */
                                      _ => (1..=4).contains(&q) || fs,                     /* タスクバー：全画面の ゲームや 動画の 時 */
                                  };
                                  let mut p = st2.paused.lock().unwrap();
                                  if busy != *p { *p = busy; let lb = cats_label(&st2); let _ = a2.emit_to(lb.as_str(), "zz-pause", busy); }
                              }
                              let (a3, st3) = (a2.clone(), st2.clone());
                              let _ = a2.run_on_main_thread(move || place_bar(&a3, &st3));
                          }
                      });
                      /* なでなで用：カーソルが 猫の まどの 上で 動いた 時だけ 位置を 送る */
                      let (a6, st6) = (h.clone(), st.clone());
                      std::thread::spawn(move || {
                          let mut last = (i32::MIN, i32::MIN);
                          loop {
                              std::thread::sleep(Duration::from_millis(50));
                              if *st6.paused.lock().unwrap() { continue; }
                              let Some(p) = win::cursor() else { continue };
                              if p == last { continue; }
                              last = p;
                              let lb = cats_label(&st6);
                              let Some(w) = a6.get_webview_window(&lb) else { continue };
                              let (Ok(pos), Ok(sz), Ok(sc)) = (w.outer_position(), w.outer_size(), w.scale_factor()) else { continue };
                              if p.0 < pos.x || p.1 < pos.y || p.0 >= pos.x + sz.width as i32 || p.1 >= pos.y + sz.height as i32 { continue; }
                              let _ = a6.emit_to(lb.as_str(), "zz-cursor", json!({ "x": (p.0 - pos.x) as f64 / sc, "y": (p.1 - pos.y) as f64 / sc }));
                          }
                      });
                      /* 起きる 時刻（20秒ごと） */
                      let (a4, st4) = (h.clone(), st.clone());
                      std::thread::spawn(move || loop {
                          std::thread::sleep(Duration::from_secs(20));
                          let Some(wk) = *st4.wake.lock().unwrap() else { continue };
                          let now = chrono::Local::now();
                          let hh = now.hour() as f64 + now.minute() as f64 / 60.0;
                          let d = today();
                          if sstr(&st4, "wakeDay") == d || !(hh >= wk && hh < wk + 0.25) { continue; }
                          if let Some(o) = st4.s.lock().unwrap().as_object_mut() { o.insert("wakeDay".into(), json!(d)); }
                          save_state(&a4, &st4);
                          let lb = cats_label(&st4);
                          let _ = a4.emit_to(lb.as_str(), "zz-wake", ());
                          let _ = a4.notification().builder().title("おはよう！").body("体操の 時間だよ").show();
                      });
                      /* アップデート：見つけたら 知らせる だけ（入れるのは「入れる」を 押した 時） */
                      let (a5, st5) = (h.clone(), st.clone());
                      tauri::async_runtime::spawn(async move {
                          if let Ok(up) = a5.updater() {
                              match up.check().await {
                                  Ok(Some(u)) => {
                                      let v = u.version.clone();
                                      log(&a5, &format!("update available {}", v));
                                      *st5.update.lock().unwrap() = Some(v.clone());
                                      let _ = a5.emit_to("panel", "zz-update", v.clone());
                                      let _ = a5.notification().builder().title("ズズラジオ体操部").body(format!("新しい 版（{}）が あるよ。ラジオ体操の 画面から 入れられるよ", v)).show();
                                  }
                                  Ok(None) => {}
                                  Err(e) => log(&a5, &format!("update check {}", e)),
                              }
                          }
                      });
                      let _ = win::redraw;
                      Ok(())
                  })
                  .build(tauri::generate_context!())
                  .expect("zzcard failed")
                  .run(|app, e| {
                      if let tauri::RunEvent::Exit = e { let st = app.state::<St>().inner().clone(); save_state(app, &st); }   /* 閉じる 時も 保存 */
                  });
          }
