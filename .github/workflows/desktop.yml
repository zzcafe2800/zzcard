          </style></head><body>
          <div class="wrap">
           <h1>画面のねっこ</h1>
           <div class="cols">
            <section class="col" id="colNew">
             <div class="ttl">あなたの 猫</div>
             <div class="pv" id="catPv"></div>
             <input type="text" id="nm" maxlength="12" placeholder="猫の なまえ" autocomplete="off">
             <div class="lb">からだ</div><div class="dots" id="bodyDots"></div>
             <div class="lb">みみ・目</div><div class="dots" id="earDots"></div>
            </section>

           </div>
           <div class="opts">
            <div class="opt">PCを つけたら 開く<div class="sw" data-k="autoStart"><button type="button" data-v="1">する</button><button type="button" data-v="0">しない</button></div></div>
            <div class="opt">キーの 回数を 数える<div class="sw" data-k="countTaps"><button type="button" data-v="1">数える</button><button type="button" data-v="0">数えない</button></div></div>
           </div>
           <button id="go" type="button" disabled>はじめる</button>
           <div class="msg" id="msg"></div>
          </div>
          <script src="zz.js"></script>
