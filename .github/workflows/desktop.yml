          async function doLink(code) {
            $('err').textContent = ''; $('link').disabled = true;
            try { const uid = await redeem(code); st = await zz.set({ uid }); }
            catch (e) { $('err').textContent = 'つなげなかったよ（' + (e && e.message || '') + '）'; }
            $('link').disabled = false; paint();
          }
          $('link').addEventListener('click', () => doLink($('code').value));
          $('code').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLink($('code').value); });
          document.querySelectorAll('.tile').forEach((t) => t.addEventListener('click', () => { mode = t.dataset.m; paint(); }));
          $('go').addEventListener('click', () => zz.start({ mode, hideSleep: opt.hideSleep, noEmo: opt.noEmo, noShare: opt.noShare, autoStart: opt.autoStart, lowQ: opt.lowQ, catScale: size / 100, cardWall: st.cardWall !== false, cardBar: !!st.cardBar }));
          document.querySelectorAll('.sw button').forEach((b) => b.addEventListener('click', () => { opt[b.parentNode.dataset.k] = b.dataset.v === '1'; paint(); }));
          zz.on('zz-link', (code) => { $('code').value = code; doLink(code); });
          zz.ready();
          paint();
