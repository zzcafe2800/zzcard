          <script type="module">
          import { record, recData, redeem } from './fb.js';
          const R = window.ZZREC || { mood: [], slpy: [] };
          let W = 0, Bd = 0, done = true, edited = false, photos = [], md = null, sq = null, sy = 3;
          const fmt = (h) => { h = ((h % 24) + 24) % 24; let hh = Math.floor(h), mm = Math.round((h - hh) * 60); if (mm === 60) { hh = (hh + 1) % 24; mm = 0; } return hh + ':' + String(mm).padStart(2, '0'); };
          $('md').innerHTML = R.mood.map((m, i) => '<button class="ch" data-v="' + i + '" type="button"><b>' + m.e + '</b><i>' + m.l + '</i></button>').join('');
          $('sy').innerHTML = R.slpy.map((q, i) => '<button class="ch" data-v="' + (5 - i) + '" type="button">' + (typeof _krFace === 'function' ? _krFace(q.k, 26) : '') + '<i>' + q.l.replace('とても', 'とても<br>') + '</i></button>').join('');
          function shrink(img, max, q) { const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); return { d: c.toDataURL('image/jpeg', q), w: c.width, h: c.height }; }
          function loadImg(f) { return new Promise((ok, ng) => { const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => ok(im); im.onerror = ng; im.src = r.result; }; r.onerror = ng; r.readAsDataURL(f); }); }
          function paintPh() { const box = $('ph'); box.querySelectorAll('.th').forEach((e) => e.remove()); photos.forEach((q, i) => { const d = document.createElement('div'); d.className = 'th'; d.innerHTML = '<img alt=""><button type="button" aria-label="けす">×</button>'; d.querySelector('img').src = q.t; d.querySelector('button').onclick = () => { photos.splice(i, 1); paintPh(); }; box.insertBefore(d, $('phAdd')); }); $('phAdd').hidden = photos.length >= 4; }
          function defaults() { if (edited) return; const n = new Date(); W = n.getHours() + n.getMinutes() / 60; Bd = ((W - 7) % 24 + 24) % 24; paint(); }
          function paint() {
            $('vw').textContent = fmt(W); $('vb').textContent = fmt(Bd); $('done').classList.toggle('on', done);
            [['md', md], ['sq', sq], ['sy', sy]].forEach(([id, v]) => $(id).querySelectorAll('.ch').forEach((b) => b.classList.toggle('on', String(v) === b.dataset.v)));
          }
          function step(t, d) { edited = true; const q = 0.25 * d; if (t === 'w') W = ((W + q) % 24 + 24) % 24; else Bd = ((Bd + q) % 24 + 24) % 24; paint(); }
          document.querySelectorAll('.st button').forEach((b) => b.addEventListener('click', () => step(b.dataset.t, +b.dataset.d)));
          [['tw', 'w'], ['tb', 'b']].forEach(([id, t]) => $(id).addEventListener('wheel', (e) => { e.preventDefault(); step(t, e.deltaY < 0 ? 1 : -1); }, { passive: false }));
          $('done').addEventListener('click', () => { done = !done; paint(); });
          $('md').addEventListener('click', (e) => { const b = e.target.closest('.ch'); if (b) { md = +b.dataset.v; paint(); } });
          $('sq').addEventListener('click', (e) => { const b = e.target.closest('.ch'); if (b) { sq = +b.dataset.v; paint(); } });
          $('sy').addEventListener('click', (e) => { const b = e.target.closest('.ch'); if (b) { sy = +b.dataset.v; paint(); } });
          $('phAdd').addEventListener('click', () => $('phIn').click());
          $('phIn').addEventListener('change', async () => { for (const f of Array.from($('phIn').files || [])) { if (photos.length >= 4) break; try { const im = await loadImg(f), big = shrink(im, 1280, .82), sm = shrink(im, 240, .72); photos.push({ u: big.d, t: sm.d, w: big.w, h: big.h }); } catch (_) {} } $('phIn').value = ''; paintPh(); });
          $('go').addEventListener('click', async () => {
            if (cur === 'S') { if (!suid) { $('msg').textContent = 'さきに つないでね'; return; } const o = Object.assign({}, so); delete o.card; await zz.start(Object.assign({ mode: sm, catScale: ssz / 100, cardWall: cw, cardBar: cb }, o)); $('msg').textContent = 'かえたよ！'; return; }
            const st = await zz.state(); if (!st.uid) { $('msg').textContent = 'せってい で つないでね'; return; }
            $('go').disabled = true; $('msg').textContent = '';
            try {
              await record(st.uid, { done, wake: +W.toFixed(3), bed: +Bd.toFixed(3), md, sq, sy, comment: $('cm').value.trim(), photos });
              $('msg').textContent = 'きろく できたよ！'; zz.recorded(); setTimeout(() => zz.hidePanel(), 1200);
              $('cm').value = ''; edited = false; photos = []; paintPh();
            } catch (e) { $('msg').style.color = '#c9546b'; $('msg').textContent = 'きろく できなかったよ'; setTimeout(() => { $('msg').style.color = ''; }, 3000); }
            $('go').disabled = false;
          });
          /* うつりかわり：サイトと 同じ 折れ線グラフ（サイトの きろく＋PC版の きろく） */
          let gModes = ['wake', 'bed'];
          async function graph() {
            const st = await zz.state(); if (!st.uid) return;
            try {
              const { data, pcrec } = await recData(st.uid);
              ['radio_wakelog', 'radio_sleeplog', 'radio_moods', 'radio_profile', 'radio_sleepts'].forEach((k) => { if (data[k] != null) localStorage.setItem(k, data[k]); else localStorage.removeItem(k); });
              const wl = JSON.parse(localStorage.getItem('radio_wakelog') || '{}'), sl = JSON.parse(localStorage.getItem('radio_sleeplog') || '{}'), mm = JSON.parse(localStorage.getItem('radio_moods') || '{}');
              Object.keys(pcrec).forEach((d) => { const r = pcrec[d]; if (!r || r.m) return; if (Number.isFinite(r.w)) wl[d] = r.w; if (Number.isFinite(r.b)) sl[d] = r.b; if (Number.isFinite(r.md) && R.mood[r.md]) mm[d] = { e: R.mood[r.md].e, l: R.mood[r.md].l }; });
              localStorage.setItem('radio_wakelog', JSON.stringify(wl)); localStorage.setItem('radio_sleeplog', JSON.stringify(sl)); localStorage.setItem('radio_moods', JSON.stringify(mm));
            } catch (_) {}
            try { _recGraphModes = gModes.slice(); buildRecGraph($('gr')); } catch (e) { $('gr').textContent = ''; }
          }
          document.querySelectorAll('.gm').forEach((b) => b.addEventListener('click', () => {
            const m = b.dataset.m, on = gModes.includes(m);
            if (on && gModes.length === 1) return;
            gModes = on ? gModes.filter((x) => x !== m) : gModes.concat(m);
            document.querySelectorAll('.gm').forEach((x) => { const o = gModes.includes(x.dataset.m); x.classList.toggle('on', o); x.textContent = (o ? '☑ ' : '☐ ') + x.textContent.slice(2); });
            graph();
          }));
          let cur = 'R';
          function tab(t) {
            cur = t;
            $('tR').classList.toggle('on', t === 'R'); $('tG').classList.toggle('on', t === 'G'); $('tS').classList.toggle('on', t === 'S');
            $('pR').hidden = t !== 'R'; $('pG').hidden = t !== 'G'; $('pS').hidden = t !== 'S';
            $('go').hidden = t === 'G'; $('msg').hidden = t === 'G'; $('go').textContent = t === 'S' ? 'これで OK' : 'きろく'; $('msg').textContent = '';
            if (t === 'G') graph(); if (t === 'S') loadS();
          }
          $('tR').addEventListener('click', () => tab('R')); $('tG').addEventListener('click', () => tab('G')); $('tS').addEventListener('click', () => tab('S'));
          /* せってい（タブで 切りかえ） */
          let sm = 'wall', so = {}, ssz = 100, suid = '', cw = true, cb = false;
          function paintS() {
            $('sOk').hidden = !suid; $('sNg').hidden = !!suid; so.card = sm === 'wall' ? cw : cb;
            $('cardSub').textContent = sm === 'wall' ? 'ひとこと・写真（壁紙）' : 'ひとこと・写真（画面の 左に 小さく）';
            document.querySelectorAll('#pS .tile').forEach((t) => t.classList.toggle('on', t.dataset.m === sm));
            document.querySelectorAll('#pS .sw').forEach((w) => w.querySelectorAll('button').forEach((b) => b.classList.toggle('on', String(+!!so[w.dataset.k]) === b.dataset.v)));
            $('sz').value = ssz; $('szV').textContent = ssz;
          }
          async function loadS() { const st = await zz.state(); suid = st.uid || ''; sm = st.mode || 'wall'; so = { hideSleep: !!st.hideSleep, noEmo: !!st.noEmo, noShare: !!st.noShare, autoStart: !!st.autoStart, lowQ: !!st.lowQ }; cw = st.cardWall !== false; cb = !!st.cardBar; ssz = Math.round((st.catScale || 1) * 100); paintS(); }
          document.querySelectorAll('#pS .tile').forEach((t) => t.addEventListener('click', () => { sm = t.dataset.m; paintS(); }));
          document.querySelectorAll('#pS .sw button').forEach((b) => b.addEventListener('click', () => { const k = b.parentNode.dataset.k, v = b.dataset.v === '1'; if (k === 'card') { if (sm === 'wall') cw = v; else cb = v; } else so[k] = v; paintS(); }));
          $('sz').addEventListener('input', () => { ssz = +$('sz').value; $('szV').textContent = ssz; });
          $('sLink').addEventListener('click', async () => { $('sLink').disabled = true; try { const uid = await redeem($('sCode').value); await zz.set({ uid }); suid = uid; paintS(); } catch (e) { $('msg').style.color = '#c9546b'; $('msg').textContent = 'つなげなかったよ'; setTimeout(() => { $('msg').style.color = ''; }, 3000); } $('sLink').disabled = false; });
          function openTab() { zz.panelTab().then((t) => { if (t === 'settings') tab('S'); }).catch(() => {}); }
          $('x').addEventListener('click', () => zz.hidePanel());
          $('quit').addEventListener('click', () => zz.quit());
          document.addEventListener('keydown', (e) => { if (e.key === 'Escape') zz.hidePanel(); });
          zz.on('zz-panel-open', () => { $('msg').textContent = ''; defaults(); if (!$('pG').hidden) graph(); openTab(); });
          defaults(); openTab();
          </script></body></html>
