            const [sy, pr] = await Promise.all([get('sync/' + uid), get('pcrec/' + uid)]);
            let data = {}; try { data = JSON.parse((sy && sy.data) || '{}') || {}; } catch (_) {}
            return { data, pcrec: pr || {} };
          }
          /* タップ数：PC版を 開いている 人どうしで 共有（見せる 設定の 人だけ） */
          export async function pubTaps(uid, n, share) {
            const { db, D } = await fb();
            if (!share) { await D.remove(D.ref(db, 'pctaps/' + uid)).catch(() => {}); return; }
            await D.set(D.ref(db, 'pctaps/' + uid), { n: n | 0, day: jstKey(), t: Date.now() });
          }
          export async function allTaps() {
            const { db, D } = await fb();
            const v = (await D.get(D.ref(db, 'pctaps')).catch(() => null));
            const o = (v && v.val()) || {}, day = jstKey(), out = {};
            Object.keys(o).forEach((u) => { const x = o[u]; if (x && x.day === day && (x.n | 0) > 0) out[u] = x.n | 0; });   /* その日の あいだは 閉じても 出す */
            return out;
          }

          /* ===== なでなで・アイテム（同じ 時間に 開いて いる 人にも 届く）・日記 ===== */
          export async function sendPet(o) { const { db, D } = await fb(); await D.push(D.ref(db, 'pcpets'), { to: o.to, by: o.by, tn: String(o.tn || '').slice(0, 20), bn: String(o.bn || '').slice(0, 20), t: Date.now() }); }
          export async function sendItem(k, by) { const { db, D } = await fb(); await D.push(D.ref(db, 'pcitems'), { k, by, t: Date.now() }); }
          async function live(path, cb) { const { db, D } = await fb(); D.onChildAdded(D.query(D.ref(db, path), D.orderByChild('t'), D.startAt(Date.now() - 3000)), (s) => { const v = s.val(); if (v) cb(v); }); }
          export function onPets(cb) { return live('pcpets', cb); }
          export function onItems(cb) { return live('pcitems', cb); }
          export async function diaryAdd(uid, o) { const { db, D } = await fb(); await D.push(D.ref(db, 'pcdiary/' + uid + '/' + jstKey()), Object.assign({ t: Date.now() }, o)); }
          /* その日の 日記：なでられた・なでた（pcpets）＋ 自分の 日記（pcdiary）＋ 体操（pcrec） */
          export async function diaryDay(uid, day) {
            const { db, D } = await fb();
            const q = (k) => D.get(D.query(D.ref(db, 'pcpets'), D.orderByChild(k), D.equalTo(uid))).then((s) => s.val() || {}).catch(() => ({}));
            const qv = D.get(D.query(D.ref(db, 'pcvisits'), D.orderByChild('to'), D.equalTo(uid))).then((s) => s.val() || {}).catch(() => ({}));
            const [to, by, mine, rec, vis] = await Promise.all([q('to'), q('by'), D.get(D.ref(db, 'pcdiary/' + uid + '/' + day)).then((s) => s.val() || {}).catch(() => ({})), D.get(D.ref(db, 'pcrec/' + uid + '/' + day)).then((s) => s.val()).catch(() => null), qv]);
            const dayOf = (t) => new Date(t + 9 * 3600e3).toISOString().slice(0, 10), out = [];
            const agg = (src, k, nameKey) => { const m = {}; Object.values(src).forEach((v) => { if (!v || dayOf(v.t) !== day || v.to === v.by) return; const who = v[(k === 'petBy' || k === 'visitBy') ? 'by' : 'to']; if (!m[who]) m[who] = { k, t: v.t, name: v[nameKey] || '', n: 0 }; m[who].n++; }); Object.values(m).forEach((e) => out.push(e)); };
            agg(to, 'petBy', 'bn'); agg(by, 'pet', 'tn'); agg(vis, 'visitBy', 'bn');
            Object.values(mine).forEach((v) => { if (v && v.t) out.push(v); });
            if (rec && rec.t && rec.dn !== false) out.push({ k: 'taiso', t: rec.t });
            return out.sort((a, b) => a.t - b.t);
          }

          export async function setOnline(uid, extra) { const { db, D } = await fb(); await D.set(D.ref(db, 'pconline/' + uid), Object.assign({ t: Date.now() }, extra || {})); }

          /* ===== フレンド：6文字の コード・おたがい フレンド・いっしょに 遊ぶ 人を 選ぶ ===== */
          const CODE_CH = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
          export async function myCode(uid, name) {
            const { db, D } = await fb();
            const nm = String(name || '').slice(0, 20);
            const cur = await D.get(D.ref(db, 'pccodeOf/' + uid)).then((s) => s.val()).catch(() => null);
            if (cur) { if (nm) D.update(D.ref(db, 'pccode/' + cur), { n: nm }).catch(() => {}); return cur; }
            for (let i = 0; i < 8; i++) {
              let c = ''; for (let k = 0; k < 6; k++) c += CODE_CH[Math.floor(Math.random() * CODE_CH.length)];
              const r = await D.runTransaction(D.ref(db, 'pccode/' + c), (v) => (v ? undefined : { u: uid, n: nm, t: Date.now() }));
              if (r.committed) { await D.set(D.ref(db, 'pccodeOf/' + uid), c); return c; }
            }
            throw new Error('code');
          }
          export async function addFriend(uid, code, myName) {   /* コードで 申請 */
            const { db, D } = await fb();
            const c = String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
            const v = await D.get(D.ref(db, 'pccode/' + c)).then((s) => s.val()).catch(() => null);
            if (!v || !v.u) throw new Error('nocode');
            if (v.u === uid) throw new Error('self');
            await sendReq(uid, v.u, myName);
            return { uid: v.u, name: v.n || '' };
          }
          export async function sendReq(uid, to, myName) { const { db, D } = await fb(); await D.set(D.ref(db, 'pcfreq/' + to + '/' + uid), { n: String(myName || '').slice(0, 20), t: Date.now() }); }
          export async function requests(uid) { const { db, D } = await fb(); const v = await D.get(D.ref(db, 'pcfreq/' + uid)).then((s) => s.val()).catch(() => null); return Object.keys(v || {}).map((u) => ({ uid: u, name: v[u].n || '', t: v[u].t })); }
          export async function answerReq(uid, from, ok, myName, fromName) {
            const { db, D } = await fb(), now = Date.now();
            if (ok) {
              await D.set(D.ref(db, 'pcfriends/' + uid + '/' + from), { n: String(fromName || '').slice(0, 20), t: now, play: true });
              await D.set(D.ref(db, 'pcfriends/' + from + '/' + uid), { n: String(myName || '').slice(0, 20), t: now, play: true });
            }
            await D.remove(D.ref(db, 'pcfreq/' + uid + '/' + from)).catch(() => {});
          }
          export async function friends(uid) {
            const { db, D } = await fb();
            const get = (p) => D.get(D.ref(db, p)).then((s) => s.val()).catch(() => null);
            const [fr, onl] = await Promise.all([get('pcfriends/' + uid), get('pconline')]);
            const now = Date.now();
            return Object.keys(fr || {}).map((u) => { const o = onl && onl[u], live = !!(o && now - (o.t || 0) < 180000); return { uid: u, name: fr[u].n || '', play: fr[u].play !== false, online: live, room: live ? (o.room || '') : '', priv: live && o.kind === 'my' }; })
              .sort((a, b) => (b.online ? 1 : 0) - (a.online ? 1 : 0));
          }
          export async function setPlay(uid, fuid, on) { const { db, D } = await fb(); await D.update(D.ref(db, 'pcfriends/' + uid + '/' + fuid), { play: !!on }); }
          export async function friendSet(uid) { const l = await friends(uid).catch(() => []); return new Set(l.filter((x) => x.play).map((x) => x.uid)); }

          /* ===== はじめから：PC版だけの アカウント（サイトと つながって いない 新しい 枠） ===== */
          export async function createLocal(o) {
            const { db, D, au } = await fb();
            const A = 'abcdefghijkmnpqrstuvwxyz23456789'; let id = 'pc_'; for (let i = 0; i < 14; i++) id += A[Math.floor(Math.random() * A.length)];
            await D.set(D.ref(db, 'owners/' + id), { [au]: 'local' });
            const prof = { name: String(o.name || '').slice(0, 12) || 'ねこ', body: o.body, ear: o.ear, t: Date.now() };
            await D.set(D.ref(db, 'pcprof/' + id), prof);
            await D.set(D.ref(db, 'pcfig/' + id), { s: o.s, z: o.z, h: 60, w: 74, tier: 1, name: prof.name, t: Date.now() });
            return id;
          }

          /* ===== お部屋：一覧（公開ルーム）・猫の 絵・フレンドの 部屋に 来た 知らせ ===== */
          export async function publishRoom(code, o) {
            const { db, D } = await fb();
            const r = D.ref(db, 'pcrooms/' + code);
            await D.set(r, Object.assign({ t: Date.now() }, o));
            try { D.onDisconnect(r).remove(); } catch (_) {}
          }
          export async function closeRoom(code) { const { db, D } = await fb(); await D.remove(D.ref(db, 'pcrooms/' + code)).catch(() => {}); }
          export async function rooms() {
            const { db, D } = await fb();
            const v = (await D.get(D.ref(db, 'pcrooms')).catch(() => null));
            const o = (v && v.val()) || {}, now = Date.now();
            return Object.keys(o).map((k) => Object.assign({ id: k }, o[k])).filter((r) => now - (r.t || 0) < 120000);
          }
          export async function figOf(uid) {
            const { db, D } = await fb();
            const get = (p) => D.get(D.ref(db, p)).then((s) => s.val()).catch(() => null);
            const [a, b, p] = await Promise.all([get('pcfigs/' + uid), get('pcfig/' + uid), get('pcprof/' + uid)]);
            const f = (a && a.s) ? a : b;
            return { fig: f || null, name: (p && p.name) || (b && b.name) || '', body: p && p.body, ear: p && p.ear };
          }
          export async function sendVisit(o) { const { db, D } = await fb(); await D.push(D.ref(db, 'pcvisits'), { to: o.to, by: o.by, bn: String(o.bn || '').slice(0, 20), t: Date.now() }); }

          /* ===== おさいふ（サイトの zz ＋ PC版の 差し引き）・親密度 ===== */
          export async function wallet(uid) {
            const { db, D } = await fb();
            const r = D.ref(db, 'pczz/' + uid + '/bal'); let v = await D.get(r).then((s) => s.val()).catch(() => null);
            if (v == null) { v = 100; await D.set(r, v).catch(() => {}); }   /* PC版だけの おさいふ（はじめは 100zz） */
            return { bal: v };
          }
          export async function addNet(uid, d) { const { db, D } = await fb(); await D.runTransaction(D.ref(db, 'pczz/' + uid + '/bal'), (v) => Math.max(0, (v == null ? 100 : v) + d)); }
          export async function getAff(uid) { const { db, D } = await fb(); const v = await D.get(D.ref(db, 'pcaff/' + uid)).then((s) => s.val()).catch(() => null); return (v && v.p) || 0; }
          export async function setAff(uid, p) { const { db, D } = await fb(); await D.set(D.ref(db, 'pcaff/' + uid), { p: Math.max(0, Math.round(p)), t: Date.now() }); }

          /* ===== フレンドの 親密度：Lv1〜100・次の Lvまで 3.3×Lv^1.2（合計 約36,500）・1日 120 まで ===== */
          export function fLevel(e) { let L = 1, need = 3.3; e = +e || 0; while (L < 100 && e >= need) { e -= need; L++; need = 3.3 * Math.pow(L, 1.2); } return { lv: L, cur: e, need: L >= 100 ? 0 : need }; }
          export async function fAffAll(uid) { const { db, D } = await fb(); const v = await D.get(D.ref(db, 'pcfaff/' + uid)).then((s) => s.val()).catch(() => null); const o = {}; Object.keys(v || {}).forEach((u) => { o[u] = (v[u] && v[u].e) || 0; }); return o; }
          export async function fAffAdd(uid, fu, add) {
            const { db, D } = await fb(), day = jstKey();
            await D.runTransaction(D.ref(db, 'pcfaff/' + uid + '/' + fu), (v) => { v = v || { e: 0, d: '', g: 0 }; if (v.d !== day) { v.d = day; v.g = 0; } const a = Math.max(0, Math.min(add, 120 - v.g)); v.e = (v.e || 0) + a; v.g += a; return v; });
          }
          ZZEOF
          cat > pc/prep.js << 'ZZEOF'
          /* サイトの index.html から PC版に いる 部品だけを 取り出す：アイコン・景色・空の色・猫の うごき・Firebaseの 設定 */
          const fs = require('fs');
          const s = fs.readFileSync('index.html', 'utf8');
          function cut(a, b, name) { const i = s.indexOf(a), j = s.indexOf(b, i + 1); if (i < 0 || j <= i) { console.error('not found: ' + name); process.exit(1); } return s.slice(i, j); }
          function fn(name) { const i = s.indexOf('function ' + name + '('); if (i < 0) { console.error('not found: ' + name); process.exit(1); } let d = 0, k = i, st = false; for (; k < s.length; k++) { const c = s[k]; if (c === '{') { d++; st = true; } else if (c === '}') { d--; if (st && d === 0) break; } } return s.slice(i, k + 1); }
          const m = s.match(/rel="apple-touch-icon" href="data:image\/png;base64,([^"]+)"/);
          if (!m) { console.error('icon not found'); process.exit(1); }
          fs.writeFileSync('pc/dist/icon192.png', Buffer.from(m[1], 'base64'));
          fs.writeFileSync('pc/dist/engine.js', cut('/* ===== UIが 消えている 間：今日 体操した 子たちが 奥で あそぶ', '/* ===== /奥で あそぶ 猫 ===== */', 'engine'));
          fs.writeFileSync('pc/dist/scene.js', cut('function _scPal(tk){', 'function renderHomeScenery(', 'scene') + '\n' + fn('skyGradientForHour') + '\n');
          const cfg = cut('const firebaseConfig={', '};', 'firebaseConfig').replace('const firebaseConfig=', 'window.FBCFG=') + '};\n';
          fs.writeFileSync('pc/dist/fbconfig.js', cfg);
          /* きろく用：気分（いちばん上の 3つ）・ねむけ・顔の イラスト */
          function stmt(a) { const i = s.indexOf(a); if (i < 0) { console.error('not found: ' + a); process.exit(1); } let d = 0, k = s.indexOf('[', i); for (; k < s.length; k++) { if (s[k] === '[') d++; else if (s[k] === ']') { d--; if (d === 0) break; } } return s.slice(s.indexOf('[', i), k + 1); }
          const vm = require('vm');
          const M = vm.runInNewContext('(' + stmt('var MOOD3=') + ')').map((x) => ({ e: x.e, l: x.l }));
          const Y = vm.runInNewContext('(' + stmt('var KR_SLPY=') + ')');
          fs.writeFileSync('pc/dist/rec.js', 'window.ZZREC=' + JSON.stringify({ mood: M, slpy: Y }) + ';\n' + fn('_krFace') + '\n');
          console.log('prep ok');
          /* サイトの「きろくの うつりかわり」グラフを そのまま 取り出す（PC版の グラフ用） */
          function graphJS(s) {
            const FN = ['buildRecGraph','_buildBedGraph','_buildMoodGraph','_buildWakeGraph','_circMean','_dayMid','_floatHM','_graphAnchorCalc','_graphCont','_graphHourLines','_graphRange','_graphSpan','_graphWrap','_graphYf','_moodMap','_moodVal','_recDot','_recHM','_sleepDurColor','_sleepDurOf','dk','fmtHM','getProfile','getSleepLog','getSleepTs','getWakeLog','hx','lsGet','profileWake','profileWakeHM','rgb','jstKey','addDays'];
            const VARS = ['DEFAULT_WAKE','GRAPH_ANCHOR','MMOOD_KEY','PROF_KEY','SLEEPTS_KEY','SLEEP_KEY','_MOOD_VAL','_recGraphModes','WAKELOG_KEY'];
            function fn(name) { const i = s.indexOf('function ' + name + '('); if (i < 0) throw new Error('graph fn not found: ' + name); let d = 0, k = i, st = false; for (; k < s.length; k++) { const c = s[k]; if (c === '{') { d++; st = true; } else if (c === '}') { d--; if (st && d === 0) break; } } return s.slice(i, k + 1); }
            function stmt(name) {
              const re = new RegExp('(^|\\n)[ \\t]*(var|const|let)\\s[^;\\n]*?\\b' + name.replace(/\$/g, '\\$') + '\\s*=', 'g'); const m = re.exec(s);
              if (!m) throw new Error('graph var not found: ' + name);
              const st = m.index + m[1].length; let d = 0, q = null, k = st;
              for (; k < s.length; k++) { const c = s[k]; if (q) { if (c === '\\') { k++; continue; } if (c === q) q = null; continue; } if (c === '"' || c === "'" || c === '`') { q = c; continue; } if ('([{'.includes(c)) d++; else if (')]}'.includes(c)) d--; else if (c === ';' && d === 0) break; }
              return s.slice(st, k + 1).replace(/^\s*(const|let)\s/, 'var ');
            }
            const seen = new Set(); let out = '';
            VARS.forEach((v) => { const t = stmt(v); if (!seen.has(t)) { seen.add(t); out += t + '\n'; } });
            FN.forEach((f) => { out += fn(f) + '\n'; });
            return out;
          }
          fs.writeFileSync('pc/dist/graph.js', graphJS(s));
          console.log('graph ok');
          ZZEOF
          sed -i "s/0\.3\.RUNNUM/0.3.$GITHUB_RUN_NUMBER/" pc/src-tauri/tauri.conf.json
          grep '"version"' pc/src-tauri/tauri.conf.json
          node pc/prep.js
          rm pc/prep.js
      - name: アイコンを 大きくする（1024px・角を 丸く）
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $bytes = [System.IO.File]::ReadAllBytes("$PWD\pc\dist\icon192.png")
          $ms = New-Object System.IO.MemoryStream(,$bytes)
          $src = [System.Drawing.Image]::FromStream($ms)
          $bmp = New-Object System.Drawing.Bitmap 1024, 1024
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
          $g.PixelOffsetMode = [System.Drawing.Drawing2D.PixelOffsetMode]::HighQuality
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $g.Clear([System.Drawing.Color]::Transparent)
          $r = 200
          $path = New-Object System.Drawing.Drawing2D.GraphicsPath
          $path.AddArc(0, 0, $r * 2, $r * 2, 180, 90)
          $path.AddArc(1024 - $r * 2, 0, $r * 2, $r * 2, 270, 90)
          $path.AddArc(1024 - $r * 2, 1024 - $r * 2, $r * 2, $r * 2, 0, 90)
          $path.AddArc(0, 1024 - $r * 2, $r * 2, $r * 2, 90, 90)
          $path.CloseFigure()
          $brush = New-Object System.Drawing.TextureBrush($src)
          $brush.ScaleTransform(1024 / $src.Width, 1024 / $src.Height)
          $g.FillPath($brush, $path)
          $bmp.Save("$PWD\pc\app-icon.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $brush.Dispose(); $path.Dispose(); $g.Dispose(); $bmp.Dispose(); $src.Dispose(); $ms.Dispose()
          Remove-Item "$PWD\pc\dist\icon192.png"
      - name: PC版を 作る
        working-directory: pc
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          npm install
          npx tauri icon app-icon.png
          npx tauri build
          ls src-tauri/target/release/bundle/nsis
      - name: Releases に のせる（インストーラー と 自動アップデート用の latest.json）
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="0.3.$GITHUB_RUN_NUMBER"
          EXE=$(ls pc/src-tauri/target/release/bundle/nsis/*-setup.exe | head -n 1)
          cp "$EXE" zzcard-setup.exe
          SIG=$(cat "$EXE.sig")
          printf '{"version":"%s","notes":"PC版 %s","pub_date":"%s","platforms":{"windows-x86_64":{"signature":"%s","url":"https://github.com/zzcafe2800/zzcard/releases/download/v%s/zzcard-setup.exe"}}}\n' "$VER" "$VER" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$SIG" "$VER" > latest.json
          cat latest.json
          ls -la zzcard-setup.exe
          # BOOTH の 作品ファイル（インストーラー ＋ はじめに お読み ください）
          mkdir -p booth
          cp zzcard-setup.exe booth/zzcard-setup.exe
          printf '\xEF\xBB\xBF' > booth/README.txt
          cat >> booth/README.txt << 'ZZEOF'
          ズズラジオ体操部 PC版（Windows）　バージョン VERSION_HERE

          ■ 入れ方
          1. zzcard-setup.exe を ダブルクリック
          2.「Windows によって PC が 保護されました」と 出たら「詳細情報」→「実行」
             （できた ばかりの アプリに 出る お知らせ です）
          3. 画面の とおりに 進めると 入ります

          ■ はじめての 設定
          1. ズズラジオ体操部の サイトを 開く → おしらせ →「アプリと つなぐ」
             （出た つなぎコードを アプリに 入れても OK）
          2. 猫を 出す 場所（壁紙・タスクバー・全画面）を えらんで「はじめる」

          ■ キー
          Ctrl+Alt+P　　　　　ラジオ体操（きろく・うつりかわり・ねっこ・にっき）
          Ctrl+Alt+Shift+P　ねっこ（設定）
          Ctrl+Alt+I　　　　　アイテムを 投げこむ

          ■ この アプリが する こと
          ・デスクトップに みんなの 猫を 表示
          ・ズズラジオ体操部の サーバーと 体操の きろくを やりとり
          ・新しい 版が 出たら お知らせ（入れるのは「入れる」を 押した 時だけ）
          ・（オンに した 人だけ）今日 キーを 押した 回数を 数える
          ・（オンに した 人だけ）PC の 起動時に 開く

          ■ この アプリが しない こと
          ・何を 打ったか（キーの 内容）は 記録も 送信も しません
          ・画面の 撮影は しません
          ・あなたが 選んだ 写真 以外の ファイルは 読みません
          ・広告は ありません

          ■ やめる 時は
          Windows の 設定 → アプリ → インストールされて いる アプリ →「ズズラジオ体操部」→ アンインストール

          ■ 動作環境
          Windows 10 / 11（64ビット）

          ■ お問い合わせ
          BOOTH の メッセージから どうぞ
          ZZEOF
          sed -i "s/VERSION_HERE/$VER/" booth/README.txt
          (cd booth && 7z a -tzip ../zzcard-booth.zip zzcard-setup.exe README.txt > /dev/null)
          ls -la zzcard-booth.zip
          gh release create "v$VER" zzcard-setup.exe latest.json zzcard-booth.zip --target "$GITHUB_SHA" --title "PC版 $VER" --notes "ズズラジオ体操部 PC版 $VER（かるい 版）" --latest
