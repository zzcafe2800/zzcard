          <script type="module">
          import { redeem } from './fb.js';
          let st = await zz.state(), mode = st.mode || 'wall', opt = { hideSleep: !!st.hideSleep, noEmo: !!st.noEmo, noShare: !!st.noShare, autoStart: !!st.autoStart, lowQ: !!st.lowQ }, size = Math.round((st.catScale || 1) * 100);
          const $ = (id) => document.getElementById(id);
          function paint() {
            $('ok').hidden = !st.uid; $('ng').hidden = !!st.uid;
