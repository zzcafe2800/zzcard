          <script>var $=function(id){ return document.getElementById(id); };</script>
          <script src="graph.js"></script>
          <script src="scene.js"></script>
          <script type="module">
          import { record, recData, redeem, hill, allTaps, diaryDay, myCode, addFriend, friends, setPlay, rooms, getAff, wallet, fAffAll, fLevel, requests, answerReq, sendReq } from './fb.js';
          const R = window.ZZREC || { mood: [], slpy: [] };
          /* ===== ステータスバーの 時計 ===== */
          function clk() { const d = new Date(); $('clk').textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); }
          clk(); setInterval(clk, 20000);
          /* ===== ラジオ体操：きろく ===== */
          let W = 0, Bd = 0, done = true, edited = false, photos = [], md = null, sq = null, sy = 3, stp = 1;
          const fmt = (h) => { h = ((h % 24) + 24) % 24; let hh = Math.floor(h), mm = Math.round((h - hh) * 60); if (mm === 60) { hh = (hh + 1) % 24; mm = 0; } return hh + ':' + String(mm).padStart(2, '0'); };
          $('md').innerHTML = R.mood.map((m, i) => '<button class="ch" data-v="' + i + '" type="button"><b>' + m.e + '</b><i>' + m.l + '</i></button>').join('');
          $('sy').innerHTML = R.slpy.map((q, i) => '<button class="ch" data-v="' + (5 - i) + '" type="button">' + (typeof _krFace === 'function' ? _krFace(q.k, 26) : '') + '<i>' + q.l.replace('とても', 'とても<br>') + '</i></button>').join('');
          function showStep(n) { stp = n; [1, 2, 3].forEach((k) => { $('s' + k).hidden = k !== n; }); paint(); }
          function paint() {
            $('vw').textContent = fmt(W); $('vb').textContent = fmt(Bd);
            $('done').classList.toggle('on', done); $('done').textContent = (done ? '✓ ' : '') + '体操した';
            [['md', md], ['sq', sq], ['sy', sy]].forEach(([id, v]) => $(id).querySelectorAll('.ch').forEach((b) => b.classList.toggle('on', String(v) === b.dataset.v)));
            document.querySelectorAll('.stp').forEach((b) => { const n = +b.dataset.s; b.classList.toggle('on', n === stp); b.classList.toggle('ok', n === 1 ? md != null : n === 2 ? (sq != null || edited) : sy != null); });
          }
          function defaults() { if (edited) return; const n = new Date(); W = n.getHours() + n.getMinutes() / 60; Bd = ((W - 7) % 24 + 24) % 24; paint(); }
          function stepT(t, d) { edited = true; const q = 0.25 * d; if (t === 'w') W = ((W + q) % 24 + 24) % 24; else Bd = ((Bd + q) % 24 + 24) % 24; paint(); }
          document.querySelectorAll('.st button').forEach((b) => b.addEventListener('click', () => stepT(b.dataset.t, +b.dataset.d)));
          [['tw', 'w'], ['tb', 'b']].forEach(([id, t]) => $(id).addEventListener('wheel', (e) => { e.preventDefault(); stepT(t, e.deltaY < 0 ? 1 : -1); }, { passive: false }));
          document.querySelectorAll('.stp').forEach((b) => b.addEventListener('click', () => showStep(+b.dataset.s)));
          $('md').addEventListener('click', (e) => { const b = e.target.closest('.ch'); if (b) { md = +b.dataset.v; paint(); setTimeout(() => showStep(2), 250); } });
          $('sq').addEventListener('click', (e) => { const b = e.target.closest('.ch'); if (b) { sq = +b.dataset.v; paint(); setTimeout(() => showStep(3), 250); } });
          $('sy').addEventListener('click', (e) => { const b = e.target.closest('.ch'); if (b) { sy = +b.dataset.v; paint(); } });
          $('done').addEventListener('click', () => { done = !done; paint(); });
          function shrink(img, max, q) { const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); return { d: c.toDataURL('image/jpeg', q), w: c.width, h: c.height }; }
          function loadImg(f) { return new Promise((ok, ng) => { const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => ok(im); im.onerror = ng; im.src = r.result; }; r.onerror = ng; r.readAsDataURL(f); }); }
          function paintPh() { const box = $('ph'); box.innerHTML = ''; photos.forEach((q, i) => { const d = document.createElement('div'); d.className = 'th'; d.innerHTML = '<img alt=""><button type="button" aria-label="けす">×</button>'; d.querySelector('img').src = q.t; d.querySelector('button').onclick = () => { photos.splice(i, 1); paintPh(); }; box.appendChild(d); }); $('phAdd').hidden = photos.length >= 4; }
          $('phAdd').addEventListener('click', () => $('phIn').click());
          $('phIn').addEventListener('change', async () => { for (const f of Array.from($('phIn').files || [])) { if (photos.length >= 4) break; try { const im = await loadImg(f), big = shrink(im, 1280, .82), sm = shrink(im, 240, .72); photos.push({ u: big.d, t: sm.d, w: big.w, h: big.h }); } catch (_) {} } $('phIn').value = ''; paintPh(); });
          $('go').addEventListener('click', async () => {
            const st = await zz.state(); if (!st.uid) { $('msg').textContent = 'ねっこ で つないでね'; return; }
            $('go').disabled = true; $('msg').textContent = '';
            try {
              await record(st.uid, { done, wake: +W.toFixed(3), bed: +Bd.toFixed(3), md, sq, sy, comment: $('cm').value.trim(), photos });
              $('msg').textContent = 'きろく できたよ！'; zz.recorded(); graph(); setTimeout(() => zz.hidePanel(), 1400);
              $('cm').value = ''; edited = false; photos = []; paintPh();
            } catch (e) { $('msg').style.color = '#c9546b'; $('msg').textContent = 'きろく できなかったよ'; setTimeout(() => { $('msg').style.color = ''; }, 3000); }
            $('go').disabled = false;
          });
          /* ===== ラジオ体操：うつりかわり（サイトと 同じ 折れ線） ===== */
          let gModes = ['wake', 'bed'];
          async function graph() {
            const st = await zz.state(); if (!st.uid) return;
            try {
              const { data, pcrec } = await recData(st.uid);
              ['radio_wakelog', 'radio_sleeplog', 'radio_moods', 'radio_profile', 'radio_sleepts'].forEach((k) => { if (data[k] != null) localStorage.setItem(k, data[k]); else localStorage.removeItem(k); });
              const wl = JSON.parse(localStorage.getItem('radio_wakelog') || '{}'), sl = JSON.parse(localStorage.getItem('radio_sleeplog') || '{}'), mm = JSON.parse(localStorage.getItem('radio_moods') || '{}');
              Object.keys(pcrec).forEach((d) => { const r = pcrec[d]; if (!r || r.m) return; if (Number.isFinite(r.w)) wl[d] = r.w; if (Number.isFinite(r.b)) sl[d] = r.b; if (Number.isFinite(r.md) && R.mood[r.md]) mm[d] = { e: R.mood[r.md].e, l: R.mood[r.md].l }; });
              localStorage.setItem('radio_wakelog', JSON.stringify(wl)); localStorage.setItem('radio_sleeplog', JSON.stringify(sl)); localStorage.setItem('radio_moods', JSON.stringify(mm));
            } catch (_) {}
            try { _recGraphModes = gModes.slice(); buildRecGraph($('gr')); } catch (e) { $('gr').textContent = ''; }
          }
          document.querySelectorAll('#gms .pl').forEach((b) => b.addEventListener('click', () => {
            const m = b.dataset.m, on = gModes.includes(m); if (on && gModes.length === 1) return;
            gModes = on ? gModes.filter((x) => x !== m) : gModes.concat(m);
            document.querySelectorAll('#gms .pl').forEach((x) => x.classList.toggle('on', gModes.includes(x.dataset.m))); graph();
          }));
          /* ===== ねっこ ===== */
          let S = {};
          const TMH = { 'sky-dawn': 6, 'sky-morning': 9, 'sky-day': 13, 'sky-evening': 17, 'sky-night': 22 };
          function skyNow() { const h = new Date().getHours(); return (h >= 5 && h < 9) ? 'sky-dawn' : (h >= 9 && h < 10) ? 'sky-morning' : (h >= 10 && h < 16) ? 'sky-day' : (h >= 16 && h < 19) ? 'sky-evening' : 'sky-night'; }
          function tierP() { return S.stT || Math.max(1, Math.min(7, +localStorage.getItem('zz_tier') || 1)); }
          function skyP() { return S.stM !== 'auto' ? S.stM : skyNow(); }
          function sceneSvg(w) { try { return _hs2(tierP(), skyP(), w); } catch (_) { return ''; } }
          function skyBg() { try { const k = skyP(); return skyGradientForHour(TMH[k] != null ? TMH[k] : new Date().getHours()); } catch (_) { return '#cfd8e8'; } }
          async function loadS() {
            const st = await zz.state();
            S = { uid: st.uid || '', mode: st.mode || 'wall', strip: (st.mode === 'bar' || st.mode === 'full') ? st.mode : 'none', wallOn: !!st.wallOn || !st.mode || st.mode === 'wall', room: st.room || { kind: st.net === 'offline' ? 'my' : 'hill' }, noEmo: !!st.noEmo, noShare: !!st.noShare, noTapShow: !!st.noTapShow, autoStart: !!st.autoStart, countTaps: !!st.countTaps, lowQ: !!st.lowQ,
              slm: st.sleepMode || (st.hideSleep ? 'hide' : 'show'), stT: +st.sceneTier || 0, stM: st.sceneTime || 'auto', sz: Math.round((st.catScale || 1) * 100),
              cardW: st.cardW || (st.cardWall === false ? 'off' : 'corner'), cardB: st.cardB || (st.cardBar ? 'corner' : 'off'), mv: st.motion || 'normal' };
            paintS();
          }
          const DIC = '<div class="dic"><svg viewBox="0 0 24 20"><path d="M1 3a2 2 0 0 1 2-2h6l2 2h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2z" fill="#f4c95d"/></svg><svg viewBox="0 0 18 22"><path d="M1 2a1 1 0 0 1 1-1h10l5 5v14a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1z" fill="#fff"/><path d="M12 1v5h5" fill="#dfe6ee"/><path d="M4 11h9M4 14h9M4 17h6" stroke="#9aa6b6" stroke-width="1.2"/></svg><svg viewBox="0 0 22 22"><rect x="1" y="1" width="20" height="20" rx="5" fill="#7cc8ee"/><path d="M6 15l3.5-4.5 2.5 3 2-2.5L17 15z" fill="#fff"/><circle cx="8" cy="7.5" r="1.8" fill="#fff"/></svg></div>';
          let prevKey = '';
          function paintS() {
            $('sNg').hidden = !!S.uid; $('sOk').hidden = !S.uid;
            if (S.strip === 'none') S.wallOn = true; S.mode = S.strip !== 'none' ? S.strip : 'wall';
            document.querySelectorAll('.tile').forEach((t) => t.classList.toggle('on', t.dataset.m === 'wall' ? !!S.wallOn : t.dataset.m === S.strip));
            $('alw').classList.toggle('on', !!S.wallOn); $('alw').setAttribute('aria-checked', String(!!S.wallOn));
            $('selT').value = String(S.stT); $('selM').value = S.stM; $('scnRow').hidden = !(S.mode === 'wall' || S.wallOn);   /* 壁紙を 使う 時だけ */
            const cardV = S.mode === 'wall' ? S.cardW : S.cardB;
            document.querySelectorAll('.sg').forEach((g) => { const k = g.dataset.k; const v = k === 'card' ? cardV : (typeof S[k] === 'boolean' ? String(+S[k]) : String(S[k])); g.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.v === v)); });
            $('sz').value = S.sz; $('szV').textContent = S.sz;
            const key = tierP() + skyP();
            if (key !== prevKey) { prevKey = key; $('wallPrev').style.background = skyBg(); $('wallPrev').innerHTML = sceneSvg(1600).replace('<svg', '<svg preserveAspectRatio="xMidYMid slice"') + DIC; }
            preview();
          }
          document.querySelectorAll('.tile').forEach((t) => t.addEventListener('click', (e) => { if (e.target.closest('select,.alw')) return; const m = t.dataset.m; if (m === 'wall') S.wallOn = !S.wallOn; else S.strip = S.strip === m ? 'none' : m; paintS(); }));
          $('alw').addEventListener('click', (e) => { e.stopPropagation(); S.wallOn = !S.wallOn; paintS(); });   /* いつでも 押せる */
          $('alw').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); S.wallOn = !S.wallOn; paintS(); } });
          $('selT').addEventListener('change', () => { S.stT = +$('selT').value; paintS(); });
          $('selM').addEventListener('change', () => { S.stM = $('selM').value; paintS(); });
          document.querySelectorAll('.sg button').forEach((b) => b.addEventListener('click', () => {
            const k = b.parentNode.dataset.k, v = b.dataset.v;
            if (k === 'card') { if (S.mode === 'wall') S.cardW = v; else S.cardB = v; }
            else if (typeof S[k] === 'boolean') S[k] = v === '1'; else S[k] = v;
            paintS();
          }));
          $('sz').addEventListener('input', () => { S.sz = +$('sz').value; $('szV').textContent = S.sz; preview(); });
          $('sLink').addEventListener('click', async () => { $('sLink').disabled = true; try { const uid = await redeem($('sCode').value); await zz.set({ uid }); S.uid = uid; paintS(); } catch (e) { $('msgB').style.color = '#c9546b'; $('msgB').textContent = 'つなげなかったよ'; setTimeout(() => { $('msgB').style.color = ''; }, 3000); } $('sLink').disabled = false; });
          /* プレビュー：実際と ほぼ 同じ 見え方（自分と みんなの 本物の 猫・今日の タップ数・本当の ひとこと） */
          let PV = null, PT = {}, myTaps = 0;
          async function loadPV() {
            if (!S.uid) return;
            try { const st = await zz.state(); const t = st.taps || {}; const d = new Date(); const dk = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); myTaps = t.day === dk ? (t.n | 0) : 0; } catch (_) {}
            if (!PV) { try { PV = await hill(S.uid); } catch (_) { PV = { cats: [], cards: [] }; } try { PT = await allTaps(); } catch (_) {} }
            preview();
          }
          const TASKBAR = (h) => '<div style="position:absolute;left:0;right:0;bottom:0;height:' + h + 'px;background:rgba(32,36,48,.94);display:flex;align-items:center;gap:5px;padding:0 6px"><i style="width:8px;height:8px;border-radius:2px;background:#7cc8ee"></i><i style="width:26px;height:6px;border-radius:3px;background:#4b5263"></i><i style="width:7px;height:7px;border-radius:2px;background:#f4c95d"></i><i style="width:7px;height:7px;border-radius:2px;background:#9ad0a0"></i><i style="width:7px;height:7px;border-radius:2px;background:#e8798f"></i><span style="margin-left:auto;font-size:7px;color:#dfe4ea;font-weight:700">' + $('clk').textContent + '</span></div>';
          function preview() {
            const pv = $('pvIn'), wallBg = S.mode === 'wall' || S.wallOn, card = S.mode === 'wall' ? S.cardW : S.cardB, W0 = pv.clientWidth || 360, H0 = pv.clientHeight || 170;
            let h = '';
            if (S.mode === 'full') h += '<div style="position:absolute;inset:0;background:#1f2433"></div><svg viewBox="0 0 24 24" style="position:absolute;left:50%;top:44%;width:26px;height:26px;transform:translate(-50%,-50%);opacity:.6"><path d="M8 5l11 7-11 7z" fill="#fff"/></svg>';
            else if (wallBg) h += '<div style="position:absolute;inset:0;background:' + skyBg() + '"></div>' + sceneSvg(Math.round(640 * W0 / H0)).replace('<svg', '<svg class="bg" preserveAspectRatio="xMidYMid slice"') + DIC;
            else h += '<div style="position:absolute;inset:0;background:linear-gradient(#d7e0ee,#b9c6db)"></div><div style="position:absolute;left:14%;top:14%;width:52%;height:48%;background:#fff;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.12)"></div>';
            const tbH = 16;
            if (S.mode === 'bar') h += TASKBAR(tbH);
            const hp = Math.round(22 * S.sz / 100), baseY = S.mode === 'wall' ? Math.round(H0 * .27) : S.mode === 'bar' ? tbH : 2;
            let cats = ((PV && PV.cats) || []).slice().sort((a, b) => (b.self ? 1 : 0) - (a.self ? 1 : 0));
            cats = cats.filter((c) => c.today || S.slm !== 'hide').slice(0, 7);
            const x0 = card === 'corner' ? (S.mode === 'wall' ? 22 : 38) : 12, span = 90 - x0, byC = {};
            ((PV && PV.cards) || []).forEach((d) => { if (d.uid && d.c && !byC[d.uid]) byC[d.uid] = d.c; });
            cats.forEach((c, i) => {
              const x = cats.length > 1 ? x0 + span * i / (cats.length - 1) : 50, sleep = !c.today && S.slm === 'show';
              const f = c.fig || {}, src = sleep ? (f.z || f.s) : f.s, fh = f.h || 60, fw = f.w || 74, ww = Math.round(hp * fw / fh);
              h += '<div class="pvc" style="left:' + x + '%;bottom:' + baseY + 'px;width:' + ww + 'px;height:' + (sleep ? Math.round(hp * .75) : hp) + 'px">' + (src || '') + '</div>';
              let up = baseY + hp + 3;
              const n = c.self ? myTaps : (PT[c.uid] | 0);
              if (!S.noTapShow && n > 0) { h += '<div class="bub" style="left:' + x + '%;bottom:' + up + 'px' + (c.self ? ';box-shadow:0 0 0 1.5px rgba(95,180,230,.6)' : '') + '">' + n.toLocaleString('ja-JP') + ' <small style="font-size:7px;color:#8a93a3">タップ</small></div>'; up += 15; }
              if (card === 'head' && byC[c.uid]) { const t = byC[c.uid]; h += '<div class="bub" style="left:' + x + '%;bottom:' + up + 'px;border-radius:8px">' + (t.length > 12 ? t.slice(0, 11) + '…' : t).replace(/[<>&]/g, '') + '</div>'; }
