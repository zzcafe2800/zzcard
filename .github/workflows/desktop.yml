# ズズラジオ体操部 PC版（Windows・かるい Tauri 版）を つくる
# Actions の「PC版をつくる」→「Run workflow」で、Releases に zzcard-setup.exe（数MB）と latest.json（自動アップデート用）が できる。
# 景色・猫の うごき・グラフ・Firebaseの 設定は、作る時に サイトの index.html から 取り出す。
# 自動アップデートの 署名には、リポジトリの Secrets の TAURI_SIGNING_PRIVATE_KEY を 使う。
name: PC版をつくる
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "pc/src-tauri -> target"
      - name: PC版の ファイルを 組み立てる
        shell: bash
        run: |
          mkdir -p pc/dist pc/src-tauri/src pc/src-tauri/capabilities
          cat > pc/package.json << 'ZZEOF'
          { "name": "zzcard-pc", "private": true, "devDependencies": { "@tauri-apps/cli": "^2.12.0" } }
          ZZEOF
          cat > pc/src-tauri/Cargo.toml << 'ZZEOF'
          [package]
          name = "zzcard"
          version = "0.3.0"
          edition = "2021"

          [build-dependencies]
          tauri-build = { version = "2", features = [] }

          [dependencies]
          tauri = { version = "2", features = [] }
          tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
          tauri-plugin-deep-link = "2"
          tauri-plugin-global-shortcut = "2"
          tauri-plugin-autostart = "2"
          tauri-plugin-updater = "2"
          tauri-plugin-notification = "2"
          serde = { version = "1", features = ["derive"] }
          serde_json = "1"
          chrono = "0.4"
          rdev = "0.5"

          [profile.release]
          codegen-units = 1
          lto = true
          opt-level = "s"
          panic = "abort"
          strip = true
          ZZEOF
          cat > pc/src-tauri/build.rs << 'ZZEOF'
          fn main() {
              tauri_build::build()
          }
          ZZEOF
          cat > pc/src-tauri/tauri.conf.json << 'ZZEOF'
          {
            "$schema": "https://schema.tauri.app/config/2",
            "productName": "ズズラジオ体操部",
            "mainBinaryName": "zzcard",
            "version": "0.3.RUNNUM",
            "identifier": "io.github.zzcafe2800.zzcard",
            "build": { "frontendDist": "../dist" },
            "app": { "withGlobalTauri": true, "security": { "csp": null }, "windows": [] },
            "bundle": {
              "active": true,
              "targets": ["nsis"],
              "createUpdaterArtifacts": true,
              "icon": ["icons/32x32.png", "icons/128x128.png", "icons/128x128@2x.png", "icons/icon.ico"],
              "windows": { "nsis": { "installMode": "currentUser" } }
            },
            "plugins": {
              "updater": { "pubkey": "dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDlBMzA2MEI0OTUyMDdGQzkKUldUSmZ5Q1Z0R0F3bXJoWWJSZGUvdnJ3Qlp0Vi9iT3c5Z2xiOFkyUlU0NEVLV2dBVklHRWFXUnoK", "endpoints": ["https://github.com/zzcafe2800/zzcard/releases/latest/download/latest.json"], "windows": { "installMode": "passive" } },
              "deep-link": { "desktop": { "schemes": ["zzcard"] } }
            }
          }
          ZZEOF
          cat > pc/src-tauri/capabilities/default.json << 'ZZEOF'
          {
            "$schema": "../gen/schemas/desktop-schema.json",
            "identifier": "default",
            "windows": ["*"],
            "permissions": ["core:default", "core:window:allow-start-dragging"]
          }
          ZZEOF
          cat > pc/src-tauri/src/main.rs << 'ZZEOF'
          // ズズラジオ体操部 PC版（Tauri・かるい 版）
          // ・はじめての 時だけ 設定（つなぐ → 壁紙／タスクバー／全画面 → はじめる）
          // ・Ctrl+Alt+P で きろく（この まどは タスクバーにも いて、閉じると PC版ごと おわる）・Ctrl+Alt+Shift+P で 設定
          // ・タスクバーの 位置を 本当に 調べて、猫の 足を タスクバーの 上の ふちに。タスクバーが 消えたら 猫も 消える
          // ・全画面の 時・画面ロック中は 止める（全画面モードは ロック中だけ）。起きる 時刻に 知らせる。今日の タップ数を 数える
          #![cfg_attr(not(debug_assertions), windows_subsystem = "windows")]

          use std::sync::{Arc, Mutex};
          use std::time::Duration;

          use chrono::Timelike;
          use serde_json::{json, Value};
          use tauri::{AppHandle, Emitter, Manager, PhysicalPosition, PhysicalSize, WebviewUrl, WebviewWindowBuilder, WindowEvent};
          use tauri_plugin_autostart::{MacosLauncher, ManagerExt};
          use tauri_plugin_global_shortcut::{Code, GlobalShortcutExt, Modifiers, Shortcut, ShortcutState};
          use tauri_plugin_notification::NotificationExt;
          use tauri_plugin_updater::UpdaterExt;

          struct Zz {
              s: Mutex<Value>,
              taps: Mutex<(String, u64)>,
              sent: Mutex<i64>,
              paused: Mutex<bool>,
              wake: Mutex<Option<f64>>,
              link: Mutex<Option<String>>,
              cats: Mutex<String>,
              seq: Mutex<u32>,
              bar_shown: Mutex<bool>,
              tab: Mutex<Option<String>>,
          }
          type St = Arc<Zz>;

          fn today() -> String { chrono::Local::now().format("%Y-%m-%d").to_string() }
          fn data_path(app: &AppHandle, f: &str) -> std::path::PathBuf {
              let d = app.path().app_data_dir().unwrap_or_else(|_| std::env::temp_dir());
              let _ = std::fs::create_dir_all(&d);
              d.join(f)
          }
          fn log(app: &AppHandle, m: &str) {
              use std::io::Write;
              if let Ok(mut f) = std::fs::OpenOptions::new().create(true).append(true).open(data_path(app, "log.txt")) {
                  let _ = writeln!(f, "{} {}", chrono::Local::now().format("%Y-%m-%d %H:%M:%S"), m);
              }
          }
          fn load_state(app: &AppHandle) -> Value {
              let def = json!({"uid":"","mode":"wall","setupDone":false,"wakeDay":"","hideSleep":false,"noEmo":false,"noShare":false,"autoStart":false,"lowQ":false,"catScale":1.0,"cardWall":true,"cardBar":false});
              let mut v = std::fs::read_to_string(data_path(app, "state.json")).ok().and_then(|t| serde_json::from_str::<Value>(&t).ok()).unwrap_or(json!({}));
              if !v.is_object() { v = json!({}); }
              if let (Some(o), Some(d)) = (v.as_object_mut(), def.as_object()) {
                  for (k, x) in d { if !o.contains_key(k) { o.insert(k.clone(), x.clone()); } }
              }
              v
          }
          fn save_state(app: &AppHandle, st: &St) {
              let mut v = st.s.lock().unwrap().clone();
              let t = st.taps.lock().unwrap().clone();
              if let Some(o) = v.as_object_mut() { o.insert("taps".into(), json!({"day": t.0, "n": t.1})); }
              let _ = std::fs::write(data_path(app, "state.json"), v.to_string());
          }
          fn sget(st: &St, k: &str) -> Value { st.s.lock().unwrap().get(k).cloned().unwrap_or(Value::Null) }
          fn sbool(st: &St, k: &str) -> bool { sget(st, k).as_bool().unwrap_or(false) }
          fn sstr(st: &St, k: &str) -> String { sget(st, k).as_str().unwrap_or("").to_string() }
          fn cats_label(st: &St) -> String { st.cats.lock().unwrap().clone() }
          fn link_from(a: &[String]) -> Option<String> {
              a.iter().find(|x| x.starts_with("zzcard://")).and_then(|u| u.split("c=").nth(1)).map(|c| c.chars().take_while(|ch| ch.is_ascii_alphanumeric()).collect::<String>()).filter(|c| !c.is_empty())
          }
          fn primary(app: &AppHandle) -> Option<(i32, i32, i32, i32, f64)> {
              let m = app.primary_monitor().ok().flatten()?;
              Some((m.position().x, m.position().y, m.size().width as i32, m.size().height as i32, m.scale_factor()))
          }

          /* ===== Windows の 部品（タスクバーの 位置・壁紙の うしろ・全画面の 判定） ===== */
          #[cfg(windows)]
          mod win {
              #[repr(C)]
              #[derive(Default, Clone, Copy)]
              pub struct Rect { pub left: i32, pub top: i32, pub right: i32, pub bottom: i32 }
              #[link(name = "user32")]
              extern "system" {
                  fn FindWindowW(cls: *const u16, name: *const u16) -> isize;
                  fn FindWindowExW(parent: isize, after: isize, cls: *const u16, name: *const u16) -> isize;
                  fn SendMessageTimeoutW(h: isize, msg: u32, wp: usize, lp: isize, flags: u32, timeout: u32, res: *mut usize) -> isize;
                  fn SetParent(child: isize, parent: isize) -> isize;
                  fn SetWindowPos(h: isize, after: isize, x: i32, y: i32, cx: i32, cy: i32, flags: u32) -> i32;
                  fn EnumWindows(cb: extern "system" fn(isize, isize) -> i32, lp: isize) -> i32;
                  fn GetWindowRect(h: isize, r: *mut Rect) -> i32;
                  fn IsWindowVisible(h: isize) -> i32;
                  fn RedrawWindow(h: isize, r: *const Rect, rgn: isize, flags: u32) -> i32;
              }
              #[link(name = "shell32")]
              extern "system" {
                  fn SHQueryUserNotificationState(state: *mut i32) -> i32;
              }
              fn w(s: &str) -> Vec<u16> { s.encode_utf16().chain(std::iter::once(0)).collect() }
              /* タスクバー：上の ふちの y・画面の 下に あるか・見えて いるか（自動で かくれて いる 時は false） */
              pub fn taskbar(mx: i32, my: i32, mw: i32, mh: i32) -> Option<(i32, bool, bool)> {
                  unsafe {
                      let c = w("Shell_TrayWnd");
                      let h = FindWindowW(c.as_ptr(), std::ptr::null());
                      if h == 0 { return None; }
                      let mut r = Rect::default();
                      if GetWindowRect(h, &mut r) == 0 { return None; }
                      let width = r.right - r.left;
                      let bottom = width >= mw / 2 && r.top > my + mh / 2;
                      let seen = r.bottom.min(my + mh) - r.top.max(my);
                      let _ = mx;
                      Some((r.top, bottom, IsWindowVisible(h) != 0 && seen >= 10))
                  }
              }
              extern "system" fn find_worker(top: isize, lp: isize) -> i32 {
                  unsafe {
                      let dv = w("SHELLDLL_DefView");
                      if FindWindowExW(top, 0, dv.as_ptr(), std::ptr::null()) != 0 {
                          let wk = w("WorkerW");
                          let out = lp as *mut isize;
                          *out = FindWindowExW(0, top, wk.as_ptr(), std::ptr::null());
                      }
                  }
                  1
              }
              /* 壁紙：アイコンの うしろに まどを 入れる（Windows 11 24H2 と それより 前の 両方） */
              pub fn attach(h: isize, width: i32, height: i32) -> Result<&'static str, String> {
                  unsafe {
                      let pm = w("Progman");
                      let progman = FindWindowW(pm.as_ptr(), std::ptr::null());
                      if progman == 0 { return Err("progman".into()); }
                      let mut res: usize = 0;
                      SendMessageTimeoutW(progman, 0x052C, 0xD, 0x1, 0, 1000, &mut res);
                      SendMessageTimeoutW(progman, 0x052C, 0, 0, 0, 1000, &mut res);
                      let dv = w("SHELLDLL_DefView");
                      let wk = w("WorkerW");
                      let def_in = FindWindowExW(progman, 0, dv.as_ptr(), std::ptr::null());
                      let wk_in = FindWindowExW(progman, 0, wk.as_ptr(), std::ptr::null());
                      if def_in != 0 && wk_in != 0 {
                          SetParent(h, progman);
                          SetWindowPos(h, def_in, 0, 0, width, height, 0x0010 | 0x0040);
                          return Ok("24h2");
                      }
                      let mut worker: isize = 0;
                      EnumWindows(find_worker, &mut worker as *mut isize as isize);
                      if worker == 0 { return Err(format!("workerw def_in={} wk_in={}", def_in != 0, wk_in != 0)); }
                      SetParent(h, worker);
                      SetWindowPos(h, 0, 0, 0, width, height, 0x0010 | 0x0040);
                      Ok("classic")
                  }
              }
              pub fn redraw() {
                  unsafe {
                      let pm = w("Progman");
                      let p = FindWindowW(pm.as_ptr(), std::ptr::null());
                      if p != 0 { RedrawWindow(p, std::ptr::null(), 0, 0x0001 | 0x0004 | 0x0080 | 0x0100); }
                  }
              }
              /* 1=ロック・スクリーンセーバー 2=全画面 3=全画面ゲーム 4=プレゼン */
              pub fn quns() -> i32 { unsafe { let mut s: i32 = 0; if SHQueryUserNotificationState(&mut s) == 0 { s } else { 0 } } }
          }
          #[cfg(not(windows))]
          mod win {
              pub fn taskbar(_: i32, _: i32, _: i32, _: i32) -> Option<(i32, bool, bool)> { None }
              pub fn attach(_: isize, _: i32, _: i32) -> Result<&'static str, String> { Err("not windows".into()) }
              pub fn redraw() {}
              pub fn quns() -> i32 { 0 }
          }

          /* ===== まど ===== */
          fn open_setup(app: &AppHandle) {
              if let Some(w) = app.get_webview_window("setup") { let _ = w.unminimize(); let _ = w.show(); let _ = w.set_focus(); return; }
              let r = WebviewWindowBuilder::new(app, "setup", WebviewUrl::App("setup.html".into()))
                  .title("ズズラジオ体操部").inner_size(620.0, 800.0).resizable(false).maximizable(false).build();
              match r {
                  Ok(w) => {
                      let a = app.clone();
                      w.on_window_event(move |e| {
                          if let WindowEvent::Destroyed = e {
                              let st = a.state::<St>().inner().clone();
                              let lb = cats_label(&st);
                              if lb.is_empty() || a.get_webview_window(&lb).is_none() { a.exit(0); }
                          }
                      });
                  }
                  Err(e) => log(app, &format!("setup window {}", e)),
              }
          }
          fn open_panel(app: &AppHandle, show: bool) {
              if let Some(w) = app.get_webview_window("panel") {
                  if !show { return; }
                  let min = w.is_minimized().unwrap_or(false);
                  let vis = w.is_visible().unwrap_or(false);
                  let foc = w.is_focused().unwrap_or(false);
                  if min || !vis || !foc {
                      let _ = w.unminimize(); let _ = w.show(); let _ = w.set_focus();
                      let _ = app.emit_to("panel", "zz-panel-open", ());
                  } else { let _ = w.minimize(); }
                  return;
              }
              let Some((mx, my, _mw, mh, sc)) = primary(app) else { return };
              let lh = ((mh as f64) / sc - 150.0).min(800.0).max(520.0);
              let r = WebviewWindowBuilder::new(app, "panel", WebviewUrl::App("panel.html".into()))
                  .title("ズズラジオ体操部").inner_size(460.0, lh).resizable(false).maximizable(false)
                  .decorations(false).transparent(true).shadow(false).always_on_top(true).visible(false).build();
              match r {
                  Ok(w) => {
                      let _ = w.set_position(PhysicalPosition::new(mx + (24.0 * sc) as i32, my + mh - ((lh + 80.0) * sc) as i32));
                      let a = app.clone();
                      w.on_window_event(move |e| { if let WindowEvent::CloseRequested { .. } = e { a.exit(0); } });
                      let _ = w.show();
                      if show { let _ = w.set_focus(); } else { let _ = w.minimize(); }
                  }
                  Err(e) => log(app, &format!("panel window {}", e)),
              }
          }
          /* きろくの まどを 前に 出して、タブ（せってい など）を 開く */
          fn show_panel_tab(app: &AppHandle, tab: &str) {
              let st = app.state::<St>().inner().clone();
              *st.tab.lock().unwrap() = Some(tab.to_string());
              if app.get_webview_window("panel").is_none() { open_panel(app, true); }
              if let Some(w) = app.get_webview_window("panel") { let _ = w.unminimize(); let _ = w.show(); let _ = w.set_focus(); }
              let _ = app.emit_to("panel", "zz-panel-open", tab);
          }
          fn open_cats(app: &AppHandle, st: &St) {
              let old = cats_label(st);
              if let Some(w) = app.get_webview_window(&old) { let _ = w.destroy(); }
              let n = { let mut q = st.seq.lock().unwrap(); *q += 1; *q };
              let label = format!("cats{}", n);
              *st.cats.lock().unwrap() = label.clone();
              *st.bar_shown.lock().unwrap() = false;
              *st.sent.lock().unwrap() = -1;
              let mode = sstr(st, "mode");
              let q = json!({
                  "mode": mode, "uid": sstr(st, "uid"),
                  "sleep": if sbool(st, "hideSleep") { "0" } else { "1" },
                  "emo": if sbool(st, "noEmo") { "0" } else { "1" },
                  "share": if sbool(st, "noShare") { "0" } else { "1" },
                  "q": if sbool(st, "lowQ") { "lo" } else { "hi" },
                  "card": if (mode == "wall" && sget(st, "cardWall").as_bool().unwrap_or(true)) || (mode != "wall" && sbool(st, "cardBar")) { "1" } else { "0" },
                  "sz": sget(st, "catScale").as_f64().unwrap_or(1.0).to_string()
              });
              let r = WebviewWindowBuilder::new(app, &label, WebviewUrl::App("cats.html".into()))
                  .initialization_script(&format!("window.__ZZQ={};", q))
                  .title("zz").transparent(true).decorations(false).shadow(false).skip_taskbar(true)
                  .resizable(false).focused(false).visible(false).always_on_top(mode != "wall").build();
              let w = match r { Ok(w) => w, Err(e) => { log(app, &format!("cats window {}", e)); return; } };
              let _ = w.set_ignore_cursor_events(true);
              let Some((mx, my, mw, mh, sc)) = primary(app) else { return };
              match mode.as_str() {
                  "wall" => {
                      let _ = w.set_position(PhysicalPosition::new(mx, my));
                      let _ = w.set_size(PhysicalSize::new(mw as u32, mh as u32));
                      let _ = w.show();
                      let a = app.clone();
                      let st2 = st.clone();
                      let lb = label.clone();
                      std::thread::spawn(move || {
                          std::thread::sleep(Duration::from_millis(700));
                          let Some(w) = a.get_webview_window(&lb) else { return };
                          let h = w.hwnd().map(|h| h.0 as isize).unwrap_or(0);
                          let r = if h != 0 { win::attach(h, mw, mh) } else { Err("hwnd".into()) };
                          log(&a, &format!("wallpaper attach {:?}", r));
                          if r.is_err() {
                              if let Some(o) = st2.s.lock().unwrap().as_object_mut() { o.insert("mode".into(), json!("bar")); }
                              save_state(&a, &st2);
                              let _ = a.notification().builder().title("ズズラジオ体操部").body("壁紙に 出せなかったので、タスクバーに したよ").show();
                              let a2 = a.clone();
                              let _ = a.run_on_main_thread(move || { let st3 = a2.state::<St>().inner().clone(); open_cats(&a2, &st3); });
                          }
                      });
                  }
                  "full" => {
                      let h = (170.0 * sc) as i32;
                      let _ = w.set_position(PhysicalPosition::new(mx, my + mh - h));
                      let _ = w.set_size(PhysicalSize::new(mw as u32, h as u32));
                      let _ = w.show();
                  }
                  _ => { place_bar(app, st); }
              }
              open_panel(app, false);
          }
          /* タスクバーモード：猫の 足を タスクバーの 上の ふちに。タスクバーが 消えたら 猫も 消える */
          fn place_bar(app: &AppHandle, st: &St) {
              if sstr(st, "mode") != "bar" { return; }
              let Some(w) = app.get_webview_window(&cats_label(st)) else { return };
              let Some((mx, my, mw, mh, sc)) = primary(app) else { return };
              let h = (170.0 * sc) as i32;
              let mut top = my + mh - (48.0 * sc) as i32;
              let mut show = !*st.paused.lock().unwrap();
              if let Some((t, bottom, vis)) = win::taskbar(mx, my, mw, mh) {
                  if bottom { top = t; if !vis { show = false; } } else { top = my + mh; }
              }
              let want = PhysicalPosition::new(mx, top - h);
              if w.outer_position().map(|p| p != want).unwrap_or(true) { let _ = w.set_position(want); }
              if w.outer_size().map(|s| s.width as i32 != mw || s.height as i32 != h).unwrap_or(true) { let _ = w.set_size(PhysicalSize::new(mw as u32, h as u32)); }
              let mut sh = st.bar_shown.lock().unwrap();
              if show && !*sh { let _ = w.show(); *sh = true; }
              if !show && *sh { let _ = w.hide(); *sh = false; }
          }
          fn apply_autostart(app: &AppHandle, st: &St) {
              let al = app.autolaunch();
              let r = if sbool(st, "autoStart") { al.enable() } else { al.disable() };
              if let Err(e) = r { log(app, &format!("autostart {}", e)); }
          }

          /* ===== 画面から よばれる もの ===== */
          #[tauri::command]
          fn zz_state(st: tauri::State<'_, St>) -> Value { st.s.lock().unwrap().clone() }
          #[tauri::command]
          fn zz_set(app: AppHandle, st: tauri::State<'_, St>, o: Value) -> Value {
              let st = st.inner().clone();
              {
                  let mut s = st.s.lock().unwrap();
                  if let (Some(a), Some(b)) = (s.as_object_mut(), o.as_object()) { for (k, v) in b { a.insert(k.clone(), v.clone()); } }
              }
              save_state(&app, &st);
              let v = st.s.lock().unwrap().clone();
              v
          }
          #[tauri::command]
          fn zz_start(app: AppHandle, st: tauri::State<'_, St>, o: Value) {
              let st = st.inner().clone();
              {
                  let mut s = st.s.lock().unwrap();
                  if let Some(a) = s.as_object_mut() {
                      let mode = o.get("mode").and_then(|m| m.as_str()).unwrap_or("wall");
                      a.insert("mode".into(), json!(if ["wall", "bar", "full"].contains(&mode) { mode } else { "wall" }));
                      for k in ["hideSleep", "noEmo", "noShare", "autoStart", "lowQ"] { a.insert(k.into(), json!(o.get(k).and_then(|v| v.as_bool()).unwrap_or(false))); }
                      a.insert("cardWall".into(), json!(o.get("cardWall").and_then(|v| v.as_bool()).unwrap_or(true)));
                      a.insert("cardBar".into(), json!(o.get("cardBar").and_then(|v| v.as_bool()).unwrap_or(false)));
                      let sc = o.get("catScale").and_then(|v| v.as_f64()).unwrap_or(1.0).max(0.5).min(2.0);
                      a.insert("catScale".into(), json!(sc));
                      a.insert("setupDone".into(), json!(true));
                  }
              }
              save_state(&app, &st);
              apply_autostart(&app, &st);
              open_cats(&app, &st);
              if let Some(w) = app.get_webview_window("setup") { let _ = w.destroy(); }
          }
          #[tauri::command]
          fn zz_open_setup(app: AppHandle, st: tauri::State<'_, St>) {
              if sstr(st.inner(), "uid").is_empty() { open_setup(&app); } else { show_panel_tab(&app, "settings"); }
          }
          #[tauri::command]
          fn zz_panel_tab(st: tauri::State<'_, St>) -> Option<String> { st.tab.lock().unwrap().take() }
          #[tauri::command]
          fn zz_quit(app: AppHandle) { app.exit(0); }
          #[tauri::command]
          fn zz_hide_panel(app: AppHandle) { if let Some(w) = app.get_webview_window("panel") { let _ = w.minimize(); } }
          #[tauri::command]
          fn zz_recorded(app: AppHandle, st: tauri::State<'_, St>) { let lb = cats_label(st.inner()); let _ = app.emit_to(lb.as_str(), "zz-refresh", ()); }
          #[tauri::command]
          fn zz_set_wake(st: tauri::State<'_, St>, h: f64) { if h.is_finite() { *st.wake.lock().unwrap() = Some(h); } }
          #[tauri::command]
          fn zz_log(app: AppHandle, m: String) { log(&app, &m.chars().take(500).collect::<String>()); }
          #[tauri::command]
          fn zz_ready(app: AppHandle, st: tauri::State<'_, St>) { if let Some(c) = st.link.lock().unwrap().take() { let _ = app.emit_to("setup", "zz-link", c); } }

          fn main() {
              let st: St = Arc::new(Zz {
                  s: Mutex::new(json!({})), taps: Mutex::new((today(), 0)), sent: Mutex::new(-1), paused: Mutex::new(false),
                  wake: Mutex::new(None), link: Mutex::new(None), cats: Mutex::new(String::new()), seq: Mutex::new(0), bar_shown: Mutex::new(false), tab: Mutex::new(None),
              });
              tauri::Builder::default()
                  .plugin(tauri_plugin_single_instance::init(|app, argv, _cwd| {
                      if let Some(c) = link_from(&argv) {
                          let st = app.state::<St>().inner().clone();
                          *st.link.lock().unwrap() = Some(c.clone());
                          open_setup(app);
                          let _ = app.emit_to("setup", "zz-link", c);
                      } else { open_panel(app, true); }
                  }))
                  .plugin(tauri_plugin_deep_link::init())
                  .plugin(tauri_plugin_global_shortcut::Builder::new().with_handler(|app, sc, ev| {
                      if ev.state() != ShortcutState::Pressed { return; }
                      if sc.matches(Modifiers::CONTROL | Modifiers::ALT | Modifiers::SHIFT, Code::KeyP) {
                          let st = app.state::<St>().inner().clone();
                          if sstr(&st, "uid").is_empty() { open_setup(app); } else { show_panel_tab(app, "settings"); }
                      } else if sc.matches(Modifiers::CONTROL | Modifiers::ALT, Code::KeyP) { open_panel(app, true); }
                  }).build())
                  .plugin(tauri_plugin_autostart::init(MacosLauncher::LaunchAgent, None))
                  .plugin(tauri_plugin_updater::Builder::new().build())
                  .plugin(tauri_plugin_notification::init())
                  .manage(st.clone())
                  .invoke_handler(tauri::generate_handler![zz_state, zz_set, zz_start, zz_open_setup, zz_quit, zz_hide_panel, zz_recorded, zz_set_wake, zz_log, zz_ready, zz_panel_tab])
                  .setup(move |app| {
                      let h = app.handle().clone();
                      {
                          let v = load_state(&h);
                          if let Some(t) = v.get("taps") { if t.get("day").and_then(|d| d.as_str()) == Some(today().as_str()) { *st.taps.lock().unwrap() = (today(), t.get("n").and_then(|n| n.as_u64()).unwrap_or(0)); } }
                          *st.s.lock().unwrap() = v;
                      }
                      #[cfg(desktop)]
                      {
                          use tauri_plugin_deep_link::DeepLinkExt;
                          let _ = app.deep_link().register_all();
                      }
                      *st.link.lock().unwrap() = link_from(&std::env::args().collect::<Vec<_>>());
                      let _ = app.global_shortcut().register(Shortcut::new(Some(Modifiers::CONTROL | Modifiers::ALT), Code::KeyP));
                      let _ = app.global_shortcut().register(Shortcut::new(Some(Modifiers::CONTROL | Modifiers::ALT | Modifiers::SHIFT), Code::KeyP));
                      apply_autostart(&h, &st);
                      let first = !sbool(&st, "setupDone") || sstr(&st, "uid").is_empty() || st.link.lock().unwrap().is_some();
                      if first { open_setup(&h); } else { open_cats(&h, &st); }

                      /* 今日の キーボードの タップ数（押した 回数だけ。どの キーかは 記録しない） */
                      let st_k = st.clone();
                      std::thread::spawn(move || {
                          let mut down: Vec<rdev::Key> = Vec::new();
                          let _ = rdev::listen(move |ev: rdev::Event| {
                              match ev.event_type {
                                  rdev::EventType::KeyPress(k) => {
                                      if down.contains(&k) { return; }
                                      down.push(k);
                                      let mut t = st_k.taps.lock().unwrap();
                                      let d = today(); if t.0 != d { *t = (d, 0); }
                                      t.1 += 1;
                                  }
                                  rdev::EventType::KeyRelease(k) => { down.retain(|x| *x != k); }
                                  _ => {}
                              }
                          });
                      });
                      /* タップ数を 猫の 画面へ（1.5秒ごと）・ときどき 保存 */
                      let (a1, st1) = (h.clone(), st.clone());
                      std::thread::spawn(move || {
                          let mut i = 0u32;
                          loop {
                              std::thread::sleep(Duration::from_millis(1500));
                              let n = { let mut t = st1.taps.lock().unwrap(); let d = today(); if t.0 != d { *t = (d, 0); } t.1 as i64 };
                              let mut s = st1.sent.lock().unwrap();
                              if n != *s { *s = n; let lb = cats_label(&st1); let _ = a1.emit_to(lb.as_str(), "zz-taps", n); }
                              drop(s);
                              i += 1; if i % 20 == 0 { save_state(&a1, &st1); }
                          }
                      });
                      /* 止める／うごかす（3秒ごと）・タスクバーに あわせる（0.7秒ごと） */
                      let (a2, st2) = (h.clone(), st.clone());
                      std::thread::spawn(move || {
                          let mut k = 0u32;
                          loop {
                              std::thread::sleep(Duration::from_millis(700));
                              k += 1;
                              if k % 4 == 0 {
                                  let q = win::quns();
                                  let busy = if sstr(&st2, "mode") == "full" { q == 1 } else { (1..=4).contains(&q) };
                                  let mut p = st2.paused.lock().unwrap();
                                  if busy != *p { *p = busy; let lb = cats_label(&st2); let _ = a2.emit_to(lb.as_str(), "zz-pause", busy); }
                              }
                              let (a3, st3) = (a2.clone(), st2.clone());
                              let _ = a2.run_on_main_thread(move || place_bar(&a3, &st3));
                          }
                      });
                      /* 起きる 時刻（20秒ごと） */
                      let (a4, st4) = (h.clone(), st.clone());
                      std::thread::spawn(move || loop {
                          std::thread::sleep(Duration::from_secs(20));
                          let Some(wk) = *st4.wake.lock().unwrap() else { continue };
                          let now = chrono::Local::now();
                          let hh = now.hour() as f64 + now.minute() as f64 / 60.0;
                          let d = today();
                          if sstr(&st4, "wakeDay") == d || !(hh >= wk && hh < wk + 0.25) { continue; }
                          if let Some(o) = st4.s.lock().unwrap().as_object_mut() { o.insert("wakeDay".into(), json!(d)); }
                          save_state(&a4, &st4);
                          let lb = cats_label(&st4);
                          let _ = a4.emit_to(lb.as_str(), "zz-wake", ());
                          let _ = a4.notification().builder().title("おはよう！").body("体操の 時間だよ").show();
                      });
                      /* 自動アップデート */
                      let a5 = h.clone();
                      tauri::async_runtime::spawn(async move {
                          if let Ok(up) = a5.updater() {
                              match up.check().await {
                                  Ok(Some(u)) => {
                                      log(&a5, &format!("update {}", u.version));
                                      if u.download_and_install(|_, _| {}, || {}).await.is_ok() { a5.restart(); }
                                  }
                                  Ok(None) => {}
                                  Err(e) => log(&a5, &format!("update check {}", e)),
                              }
                          }
                      });
                      let _ = win::redraw;
                      Ok(())
                  })
                  .run(tauri::generate_context!())
                  .expect("zzcard failed");
          }
          ZZEOF
          cat > pc/dist/zz.js << 'ZZEOF'
          /* 画面と PC版本体（Tauri）の つなぎ：Electron 版と 同じ 形の window.zz を 用意する */
          (function () {
            var T = window.__TAURI__;
            function inv(c, a) { try { return T.core.invoke(c, a || {}); } catch (e) { return Promise.reject(e); } }
            var CH = ['zz-link', 'zz-wake', 'zz-pause', 'zz-refresh', 'zz-panel-open', 'zz-taps'];
            window.zz = {
              state: function () { return inv('zz_state'); },
              set: function (o) { return inv('zz_set', { o: o }); },
              start: function (o) { return inv('zz_start', { o: o }); },
              openSetup: function () { return inv('zz_open_setup'); },
              quit: function () { return inv('zz_quit'); },
              hidePanel: function () { return inv('zz_hide_panel'); },
              recorded: function () { return inv('zz_recorded'); },
              setWake: function (h) { return inv('zz_set_wake', { h: +h }); },
              log: function (m) { return inv('zz_log', { m: String(m) }); },
              ready: function () { return inv('zz_ready'); },
              panelTab: function () { return inv('zz_panel_tab'); },
              on: function (ch, cb) {
                if (CH.indexOf(ch) < 0) return;
                try { T.webviewWindow.getCurrentWebviewWindow().listen(ch, function (e) { try { cb(e.payload); } catch (_) {} }); } catch (_) {}
              }
            };
          })();
