          *{box-sizing:border-box}[hidden]{display:none !important}html,body{margin:0;height:100%;background:transparent}
          :root{--nv:#2b3242;--pc:#7cc8ee;--pc2:#e3f3fb;--mu:#8a93a3;--ln:#e6eaf0}
          body{font-family:"Yu Gothic UI","Meiryo",system-ui,sans-serif;color:var(--nv);padding:8px}
          .phone{height:100%;background:var(--nv);border-radius:48px;padding:9px;box-shadow:0 14px 34px rgba(20,18,40,.38)}
          .scr{position:relative;height:100%;background:#fff;border-radius:40px;overflow:hidden;display:flex;flex-direction:column}
          .top{position:relative;background:var(--nv);color:#fff;padding:0 18px 12px;border-radius:0 0 26px 26px;margin-bottom:2px;-webkit-app-region:drag}
          .sb{display:flex;justify-content:space-between;align-items:center;height:30px;font-size:12px;font-weight:800}
          .cam{width:12px;height:12px;border-radius:50%;background:#000;box-shadow:0 0 0 2px #3a4254}
          .sb .ic{display:flex;gap:5px;align-items:center}
          .hd{display:flex;justify-content:space-between;align-items:center;padding:4px 0 2px}
          .hd h1{margin:0;font-size:19px;letter-spacing:.04em}
          .wb{display:flex;gap:6px;-webkit-app-region:no-drag}.wb button{width:28px;height:28px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);background:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
          .wb button:hover{background:rgba(255,255,255,.14)}
          main{flex:1;overflow:auto;padding:0 16px 12px}
          .card{border:1.5px solid var(--nv);border-radius:24px;padding:12px;margin-top:10px;background:#fff}
          .lb{font-size:12px;font-weight:800;color:var(--mu);margin-bottom:6px}
          .pills{display:flex;gap:6px;flex-wrap:wrap}
          .pl{border:1.5px solid var(--nv);background:#fff;color:var(--nv);border-radius:999px;padding:5px 12px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}
          .pl.on{background:var(--nv);color:#fff}
          .gr{min-height:170px;margin-top:4px}.gr svg{width:100%;height:auto;display:block}
          .steps{display:flex;justify-content:center;gap:14px;margin-bottom:10px}
          .stp{position:relative;width:46px;height:46px;border-radius:50%;border:1.5px solid var(--nv);background:#fff;color:var(--nv);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
          .stp.on{background:var(--nv);color:#fff}.stp.ok::after{content:"";position:absolute;right:-2px;bottom:-2px;width:14px;height:14px;border-radius:50%;background:var(--pc);border:2px solid #fff}
          .stp i{position:absolute;right:-5px;top:-5px;width:17px;height:17px;border-radius:50%;background:#fff;border:1.5px solid var(--nv);color:var(--nv);font-style:normal;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
          .row{display:flex;gap:6px}
          .ch{flex:1;border:1.5px solid var(--ln);background:#fff;border-radius:16px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font:inherit;color:var(--mu)}
          .ch b{font-size:20px;line-height:1.1;color:var(--nv)}.ch i{font-style:normal;font-size:10px;font-weight:800;white-space:nowrap;text-align:center}
          .ch.on{border-color:var(--nv);background:var(--pc2);color:var(--nv)}.ch svg{display:block}
          .tm{display:flex;gap:8px;margin-bottom:8px}
          .t{flex:1;border:1.5px solid var(--ln);border-radius:16px;padding:5px 8px 5px 12px;display:flex;align-items:center;justify-content:space-between}
          .t small{display:block;font-size:10px;color:var(--mu);font-weight:800}.t b{font-size:24px;font-variant-numeric:tabular-nums}
          .st{display:flex;flex-direction:column;gap:2px}.st button{border:0;background:var(--pc2);border-radius:7px;width:26px;height:20px;cursor:pointer;color:var(--nv);font-size:9px}
          .ex{display:flex;gap:6px;align-items:center;margin-top:10px}
          .dn{flex:none;border:1.5px solid var(--nv);border-radius:999px;background:#fff;padding:0 12px;height:38px;font:inherit;font-size:12px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--nv)}
          .dn.on{background:var(--nv);color:#fff}
          #cm{flex:1;min-width:0;height:38px;border-radius:999px;border:1.5px solid var(--ln);padding:0 14px;font:inherit;font-size:13px}
          .cb{flex:none;width:38px;height:38px;border-radius:50%;border:1.5px dashed #bcc5d2;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--mu)}
          .ph{display:flex;gap:6px;margin-top:8px}.ph:empty{display:none}
          .th{position:relative;width:48px;height:48px;border-radius:14px;overflow:hidden}.th img{width:100%;height:100%;object-fit:cover;display:block}
          .th button{position:absolute;right:2px;top:2px;width:17px;height:17px;border-radius:50%;border:0;background:rgba(43,50,66,.7);color:#fff;font-size:10px;line-height:17px;padding:0;cursor:pointer}
          .go{display:block;width:100%;height:50px;margin-top:12px;border-radius:999px;border:0;background:var(--pc);color:var(--nv);font:inherit;font-size:17px;font-weight:800;cursor:pointer}.go:disabled{opacity:.5}
          .msg{font-size:12px;font-weight:800;text-align:center;min-height:16px;margin-top:6px;color:#3f9c6a}
          /* ねっこ */
          .warn{background:var(--pc2);border-color:var(--pc)}
          .tiles{display:flex;gap:6px}
          .tile{position:relative;flex:1;border:1.5px solid var(--ln);border-radius:18px;background:#fff;padding:5px;display:flex;flex-direction:column;gap:4px;font:inherit;cursor:pointer;color:var(--mu)}
          .tile.on{border-color:var(--nv);box-shadow:0 0 0 1.5px var(--nv) inset}
          .tile .tv{width:100%;aspect-ratio:16/10;border-radius:12px;overflow:hidden;position:relative;background:#cfd8e8}.tile .tv svg{position:absolute;inset:0;width:100%;height:100%;display:block}
          .tile .nm{font-size:11px;font-weight:800;text-align:center;color:inherit;white-space:nowrap}.tile.on .nm{color:var(--nv)}
          .tile .wr{display:flex;align-items:center;justify-content:space-between;gap:2px}
          .tile select{width:36px;height:20px;border:0;border-radius:999px;background:var(--pc2);font:inherit;font-size:10px;font-weight:800;color:var(--nv);padding:0;cursor:pointer;-webkit-appearance:none;appearance:none;text-align:center;text-align-last:center}
          .alw{position:absolute;right:10px;top:10px;display:flex;align-items:center;gap:4px;background:rgba(43,50,66,.72);color:#fff;border-radius:999px;padding:2px 7px 2px 3px;font-size:9px;font-weight:800;cursor:pointer}
          .alw i{width:20px;height:12px;border-radius:999px;background:#6b7384;position:relative}.alw i::after{content:"";position:absolute;left:2px;top:2px;width:8px;height:8px;border-radius:50%;background:#fff;transition:left .15s}
          .alw.on i{background:var(--pc)}.alw.on i::after{left:10px}
          .op{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--ln);font-size:13px;font-weight:800}.pg .op:first-child{border-top:0}
          .sg{display:flex;background:#eef1f5;border-radius:999px;padding:3px}.sg button{border:0;background:none;border-radius:999px;padding:4px 9px;font:inherit;font-size:11px;font-weight:800;color:var(--mu);cursor:pointer}.sg button.on{background:var(--nv);color:#fff}
          .emo{display:flex;gap:2px;align-items:center}
          .sz{display:flex;align-items:center;gap:6px}.sz input{width:110px;accent-color:var(--nv)}.sz b{font-size:15px;min-width:30px;text-align:right}.sz small{font-size:10px;color:var(--mu)}
          details.more summary{cursor:pointer;font-size:12px;font-weight:800;color:var(--mu);list-style:none;padding:6px 0 2px}details.more summary::before{content:"▸ "}details.more[open] summary::before{content:"▾ "}
          .hint{font-size:10px;color:var(--mu);text-align:center;margin-top:6px}
          #sCode{flex:1;min-width:0;height:38px;border-radius:999px;border:1.5px solid var(--nv);padding:0 14px;font:inherit;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
          .sbtn{height:38px;padding:0 16px;border-radius:999px;border:0;background:var(--nv);color:#fff;font:inherit;font-weight:800;cursor:pointer}
          .pv{position:relative;height:170px;border-radius:24px;overflow:hidden;margin-top:10px;border:1.5px solid var(--nv);background:#cfd8e8}
          .pv svg.bg{position:absolute;inset:0;width:100%;height:100%}
          .pv .lay{position:absolute;inset:0}
          .pv{cursor:pointer}
          .scn{display:flex;gap:8px;justify-content:center;margin-top:8px}.scn label{display:flex;align-items:center;gap:5px;height:32px;padding:0 4px 0 10px;border-radius:999px;background:var(--pc2);color:var(--nv)}.scn select{border:0;background:none;font:inherit;font-size:12px;font-weight:800;color:var(--nv);cursor:pointer;padding:0 2px}
          .startT{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#a3e1f9,#5fb4e6);color:#fff;border:1.5px solid rgba(255,255,255,.75);border-radius:999px;padding:6px 22px 6px 7px;font-size:15px;font-weight:800;letter-spacing:.08em;text-shadow:0 1px 2px rgba(43,50,66,.25);box-shadow:0 6px 18px rgba(79,169,223,.45),inset 0 1px 0 rgba(255,255,255,.6)}
          .pi{width:26px;height:26px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(43,50,66,.18)}.pi svg{margin-left:2px}.pi.big{width:44px;height:44px}
          .pvOv{position:absolute;inset:0;z-index:6;background:linear-gradient(135deg,rgba(163,225,249,.95),rgba(95,180,230,.95));display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .18s}
          .ovIn{display:flex;align-items:center;gap:14px;font-size:24px;font-weight:800;color:#fff;letter-spacing:.12em;text-shadow:0 1px 3px rgba(43,50,66,.3);transform:scale(.94);transition:transform .18s}.pv:hover .ovIn{transform:scale(1)}
          .pv:hover .pvOv,.pv:focus-visible .pvOv{opacity:1}
          .pvc{position:absolute;transform:translateX(-50%)}.pvc .catFig{position:relative !important;left:0 !important;top:0 !important;width:100% !important;height:100% !important;margin:0 !important;transform:none !important}.pvc svg{width:100%;height:100%;display:block}.pvc .catZ{display:none}
