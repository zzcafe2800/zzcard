# ズズラジオ体操部 PC版（Windows・専用の 軽い アプリ）を つくる
# Actions の「PC版をつくる」→「Run workflow」で、Releases に zzcard-setup.exe が できる。
# 景色・猫の うごき・Firebaseの 設定は、作る時に サイトの index.html から 取り出す。
# サイトの 景色や 猫の うごきを かえた 時は、もう一度 Run workflow する（版の 番号は 自動で 上がる）。
name: PC版をつくる
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: PC版の ファイルを 組み立てる
        shell: bash
        run: |
          mkdir -p desktop
          cat > desktop/package.json << 'ZZEOF'
          {
            "name": "zzcard-desktop",
            "productName": "ズズラジオ体操部",
            "version": "0.2.RUNNUM",
            "description": "ズズラジオ体操部 PC版",
            "author": "zzcafe2800",
            "main": "main.js",
            "dependencies": { "electron-updater": "^6.8.9", "koffi": "^3.3.1", "uiohook-napi": "^1.5.5" },
            "devDependencies": { "electron": "^44.4.5", "electron-builder": "^26.15.3" },
            "build": {
              "appId": "io.github.zzcafe2800.zzcard",
              "productName": "ズズラジオ体操部",
              "artifactName": "zzcard-setup.${ext}",
              "npmRebuild": false,
              "asarUnpack": ["node_modules/koffi/**", "node_modules/uiohook-napi/**"],
              "files": ["main.js", "preload.js", "setup.html", "panel.html", "cats.html", "cats.js", "fb.js", "engine.js", "scene.js", "fbconfig.js", "rec.js", "icon.png"],
              "protocols": [{ "name": "zzcard", "schemes": ["zzcard"] }],
              "win": { "target": "nsis", "icon": "icon.png" },
              "nsis": { "oneClick": true, "perMachine": false, "createDesktopShortcut": true, "shortcutName": "ズズラジオ体操部" },
              "publish": [{ "provider": "github", "owner": "zzcafe2800", "repo": "zzcard" }]
            }
          }
          ZZEOF
          cat > desktop/main.js << 'ZZEOF'
          /* ズズラジオ体操部 PC版（専用の 軽い アプリ・サイトは 開かない）
             ・はじめての 時だけ 設定（つなぐ → 壁紙 か タスクバー → はじめる）
             ・Ctrl+Alt+P で きろくの 画面。この 画面は タスクバーにも いて、ここから 閉じると PC版ごと おわる（猫も 消える）
             ・全画面の 時・画面ロック中は 猫を 止める。起きる 時刻に 自分の 猫が 知らせる */
          const { app, BrowserWindow, ipcMain, globalShortcut, screen, powerMonitor, Notification, protocol, net } = require('electron');
          const path = require('path');
          const fs = require('fs');
          const os = require('os');
          const { pathToFileURL } = require('url');

          protocol.registerSchemesAsPrivileged([{ scheme: 'app', privileges: { standard: true, secure: true, supportFetchAPI: true, corsEnabled: true } }]);
          const KEY = 'Control+Alt+P', KEY2 = 'Control+Alt+Shift+P';
          const ICON = path.join(__dirname, 'icon.png');
          let setupWin = null, catsWin = null, panelWin = null, pendingLink = null, paused = false, locked = false, wakeH = null, quitting = false;
          let S = { uid: '', mode: 'wall', setupDone: false, wakeDay: '', hideSleep: false, noEmo: false, noShare: false, autoStart: false, lowQ: false, catScale: 1, taps: { day: '', n: 0 } };

          function stFile() { return path.join(app.getPath('userData'), 'state.json'); }
          function loadS() { try { Object.assign(S, JSON.parse(fs.readFileSync(stFile(), 'utf8'))); } catch (_) {} }
          function saveS() { try { fs.writeFileSync(stFile(), JSON.stringify(S)); } catch (_) {} }
          function log(m) { try { fs.appendFileSync(path.join(app.getPath('userData'), 'log.txt'), new Date().toISOString() + ' ' + m + '\n'); } catch (_) {} }
          function url(p, q) { const u = new URL('app://zz/' + p); Object.keys(q || {}).forEach((k) => u.searchParams.set(k, q[k])); return u.href; }
          function prefs(extra) { return Object.assign({ preload: path.join(__dirname, 'preload.js'), contextIsolation: true, sandbox: true }, extra || {}); }
          function notify(body) { try { const n = new Notification({ title: 'ズズラジオ体操部', body, icon: ICON }); n.show(); return n; } catch (_) { return null; } }

          if (process.defaultApp && process.argv.length >= 2) app.setAsDefaultProtocolClient('zzcard', process.execPath, [path.resolve(process.argv[1])]);
          else app.setAsDefaultProtocolClient('zzcard');
          function linkFrom(argv) {
            const u = (argv || []).find((a) => typeof a === 'string' && a.startsWith('zzcard://'));
            if (!u) return null;
            try { return new URL(u).searchParams.get('c'); } catch (_) { return null; }
          }

          /* ===== 設定 ===== */
          function openSetup() {
            if (setupWin) { setupWin.show(); setupWin.focus(); return; }
            setupWin = new BrowserWindow({ width: 620, height: 720, resizable: false, maximizable: false, title: 'ズズラジオ体操部', icon: ICON, backgroundColor: '#eef1f5', webPreferences: prefs() });
            setupWin.setMenu(null);
            setupWin.loadURL(url('setup.html'));
            setupWin.on('closed', () => { setupWin = null; if (!catsWin && !quitting) app.quit(); });
          }
          /* ===== 猫 ===== */
          function petWin(opts, q) {
            const w = new BrowserWindow(Object.assign({
              transparent: true, frame: false, resizable: false, movable: false, minimizable: false, maximizable: false, fullscreenable: false,
              skipTaskbar: true, focusable: false, hasShadow: false, show: false, backgroundColor: '#00000000', webPreferences: prefs({ backgroundThrottling: false })
            }, opts));
            w.setIgnoreMouseEvents(true);
            w.loadURL(url('cats.html', Object.assign({ uid: S.uid, sleep: S.hideSleep ? '0' : '1', emo: S.noEmo ? '0' : '1', share: S.noShare ? '0' : '1', q: S.lowQ ? 'lo' : 'hi', sz: String(S.catScale || 1) }, q)));
            return w;
          }
          function openCats() {
            if (catsWin) { const w = catsWin; catsWin = null; try { w.destroy(); } catch (_) {} }
            const d = screen.getPrimaryDisplay(), b = d.bounds, wa = d.workArea;
            if (S.mode === 'bar' || S.mode === 'full') {
              const H = 170, full = S.mode === 'full';   /* 全画面：画面の いちばん 下（タスクバーにも 重なる）で、ゲームや 動画の 時も 出しつづける */
              catsWin = petWin({ x: full ? b.x : wa.x, y: full ? b.y + b.height - H : wa.y + wa.height - H, width: full ? b.width : wa.width, height: H, alwaysOnTop: true }, { mode: S.mode });
              catsWin.setAlwaysOnTop(true, full ? 'screen-saver' : 'floating');
              barShown = false;
              catsWin.once('ready-to-show', () => { if (!catsWin) return; if (full) catsWin.showInactive(); else placeBar(); });
            } else {
              catsWin = petWin(Object.assign({ alwaysOnTop: false }, b), { mode: 'wall' });
              catsWin.once('ready-to-show', () => {
                if (!catsWin) return;
                catsWin.showInactive();
                setTimeout(() => {
                  if (!catsWin) return;
                  const r = attachToDesktop(catsWin);
                  log('windows ' + os.release() + ' attach ' + JSON.stringify(r));
                  if (!r.ok) { S.mode = 'bar'; saveS(); notify('壁紙に 出せなかったので、タスクバーに したよ'); openCats(); }
                }, 500);
              });
            }
            const me = catsWin;
            me.on('closed', () => { if (catsWin === me) catsWin = null; redrawDesktop(); });
            me.webContents.once('did-finish-load', () => { tapsSent = -1; });
            openPanel(false);
          }
          /* ===== きろくの 画面（タスクバーにも いる） ===== */
          function openPanel(show) {
            if (!panelWin) {
              const wa = screen.getPrimaryDisplay().workArea, W = 440, H = 630;
              panelWin = new BrowserWindow({ width: W, height: H, x: wa.x + 24, y: wa.y + wa.height - H - 24, frame: false, resizable: false, maximizable: false, alwaysOnTop: true, transparent: true, backgroundColor: '#00000000', show: false, title: 'ズズラジオ体操部', icon: ICON, webPreferences: prefs() });
              panelWin.loadURL(url('panel.html'));
              panelWin.once('ready-to-show', () => { if (!panelWin) return; if (show) { panelWin.show(); panelWin.focus(); } else { panelWin.showInactive(); panelWin.minimize(); } });
              panelWin.on('close', () => { quitting = true; app.quit(); });   /* タスクバーから 閉じたら おわる */
              return;
            }
            if (show === false) return;
            if (panelWin.isMinimized() || !panelWin.isVisible() || !panelWin.isFocused()) { panelWin.restore(); panelWin.show(); panelWin.focus(); panelWin.webContents.send('zz-panel-open'); }
            else panelWin.minimize();
          }

          ipcMain.handle('zz-state', () => S);
          ipcMain.handle('zz-set', (_e, o) => { Object.assign(S, o || {}); saveS(); return S; });
          ipcMain.on('zz-start', (_e, o) => {
            o = (typeof o === 'string') ? { mode: o } : (o || {});
            S.mode = ['wall', 'bar', 'full'].includes(o.mode) ? o.mode : 'wall';
            S.hideSleep = !!o.hideSleep; S.noEmo = !!o.noEmo; S.noShare = !!o.noShare; S.lowQ = !!o.lowQ; S.autoStart = !!o.autoStart; applyAutoStart();
            S.catScale = Math.max(0.5, Math.min(2, +o.catScale || 1)); S.setupDone = true; saveS();
            openCats();
            if (setupWin) { const w = setupWin; setupWin = null; w.destroy(); }
          });
          ipcMain.on('zz-open-setup', () => { if (panelWin) panelWin.minimize(); openSetup(); });
          ipcMain.on('zz-quit', () => { quitting = true; app.quit(); });
          ipcMain.on('zz-hide-panel', () => { if (panelWin) panelWin.minimize(); });
          ipcMain.on('zz-recorded', () => { if (catsWin) catsWin.webContents.send('zz-refresh'); });
          ipcMain.on('zz-wake-time', (_e, h) => { if (typeof h === 'number' && isFinite(h)) wakeH = h; });
          ipcMain.on('zz-log', (_e, m) => log(String(m).slice(0, 500)));
          ipcMain.on('zz-ready', (e) => { if (pendingLink && setupWin && e.sender === setupWin.webContents) { e.sender.send('zz-link', pendingLink); pendingLink = null; } });

          /* ===== Windows の 部品（壁紙の うしろに 入れる・全画面の 判定） ===== */
          let K = null;
          function k() {
            if (K !== null) return K;
            try {
              if (process.platform !== 'win32') throw new Error('not windows');
              const koffi = require('koffi');
              const u = koffi.load('user32.dll'), sh = koffi.load('shell32.dll');
              const EnumProc = koffi.proto('bool __stdcall EnumProc(intptr_t hwnd, intptr_t lp)');
              koffi.struct('RECT', { left: 'int32', top: 'int32', right: 'int32', bottom: 'int32' });
              K = {
                FindWindowW: u.func('intptr_t __stdcall FindWindowW(str16 cls, str16 name)'),
                FindWindowExW: u.func('intptr_t __stdcall FindWindowExW(intptr_t parent, intptr_t after, str16 cls, str16 name)'),
                SendMessageTimeoutW: u.func('intptr_t __stdcall SendMessageTimeoutW(intptr_t hwnd, uint32 msg, uintptr_t wp, intptr_t lp, uint32 flags, uint32 timeout, _Out_ uintptr_t *res)'),
                SetParent: u.func('intptr_t __stdcall SetParent(intptr_t child, intptr_t parent)'),
                SetWindowPos: u.func('bool __stdcall SetWindowPos(intptr_t hwnd, intptr_t after, int x, int y, int cx, int cy, uint32 flags)'),
                EnumWindows: u.func('bool __stdcall EnumWindows(EnumProc *cb, intptr_t lp)'),
                RedrawWindow: u.func('bool __stdcall RedrawWindow(intptr_t hwnd, void *rect, void *rgn, uint32 flags)'),
                GetWindowRect: u.func('bool __stdcall GetWindowRect(intptr_t hwnd, _Out_ RECT *r)'),
                IsWindowVisible: u.func('bool __stdcall IsWindowVisible(intptr_t hwnd)'),
                SHQueryUserNotificationState: sh.func('int32 __stdcall SHQueryUserNotificationState(_Out_ int32 *state)')
              };
            } catch (e) { log('koffi ' + (e && e.message)); K = false; }
            return K;
          }
          function big(v) { try { return BigInt(v || 0); } catch (_) { return 0n; } }
          function hwndOf(w) { const b = w.getNativeWindowHandle(); return b.length >= 8 ? b.readBigUInt64LE(0) : BigInt(b.readUInt32LE(0)); }
          function attachToDesktop(w) {
            const K2 = k(); if (!K2) return { ok: false, why: 'koffi' };
            try {
              const h = hwndOf(w), b = screen.getPrimaryDisplay().bounds;
              const progman = big(K2.FindWindowW('Progman', null)); if (!progman) return { ok: false, why: 'progman' };
              K2.SendMessageTimeoutW(progman, 0x052C, 0xD, 0x1, 0, 1000, [0]);
              K2.SendMessageTimeoutW(progman, 0x052C, 0, 0, 0, 1000, [0]);
              const defIn = big(K2.FindWindowExW(progman, 0, 'SHELLDLL_DefView', null));
              const wkIn = big(K2.FindWindowExW(progman, 0, 'WorkerW', null));
              if (defIn && wkIn) {   /* Windows 11 24H2 から：Progman の 中で、アイコンの すぐ 下へ */
                K2.SetParent(h, progman);
                K2.SetWindowPos(h, defIn, 0, 0, b.width, b.height, 0x0010 | 0x0040);
                return { ok: true, how: '24h2' };
              }
              let worker = 0n;   /* それより 前：アイコンの 窓の つぎの WorkerW の 中へ */
              K2.EnumWindows((top) => { const dv = big(K2.FindWindowExW(top, 0, 'SHELLDLL_DefView', null)); if (dv) worker = big(K2.FindWindowExW(0, top, 'WorkerW', null)); return true; }, 0);
              if (!worker) return { ok: false, why: 'workerw', defIn: !!defIn, wkIn: !!wkIn };
              K2.SetParent(h, worker);
              K2.SetWindowPos(h, 0, 0, 0, b.width, b.height, 0x0010 | 0x0040);
              return { ok: true, how: 'classic' };
            } catch (e) { return { ok: false, why: String(e && e.message) }; }
          }
          /* タスクバーの 本当の 位置（見えて いる 部分）。自動で かくれて いる 時は vis=false */
          function taskbar() {
            const K2 = k(); if (!K2) return null;
            try {
              const h = big(K2.FindWindowW('Shell_TrayWnd', null)); if (!h) return null;
              const r = {}; if (!K2.GetWindowRect(h, r)) return null;
              const d = screen.screenToDipRect(null, { x: r.left, y: r.top, width: r.right - r.left, height: r.bottom - r.top });
              const b = screen.getPrimaryDisplay().bounds, bottom = d.width >= b.width * 0.5 && d.y > b.y + b.height * 0.5;
              const seen = Math.min(d.y + d.height, b.y + b.height) - Math.max(d.y, b.y);
              return { top: d.y, bottom, vis: !!K2.IsWindowVisible(h) && seen >= 10 };
            } catch (_) { return null; }
          }
          let barShown = false;
          function placeBar() {   /* タスクバーモード：猫の 足を タスクバーの 上の ふちに。タスクバーが 消えたら 猫も 消える */
            if (S.mode !== 'bar' || !catsWin || catsWin.isDestroyed()) return;
            const b = screen.getPrimaryDisplay().bounds, wa = screen.getPrimaryDisplay().workArea, H = 170, tb = taskbar();
            let top = wa.y + wa.height, show = !paused;
            if (tb) { if (tb.bottom) { top = tb.top; if (!tb.vis) show = false; } else top = b.y + b.height; }
            const nb = { x: b.x, y: Math.round(top - H), width: b.width, height: H }, cur = catsWin.getBounds();
            if (cur.x !== nb.x || cur.y !== nb.y || cur.width !== nb.width || cur.height !== nb.height) catsWin.setBounds(nb);
            if (show && !barShown) { catsWin.showInactive(); barShown = true; }
            if (!show && barShown) { catsWin.hide(); barShown = false; }
          }
          function applyAutoStart() { try { app.setLoginItemSettings({ openAtLogin: !!S.autoStart }); } catch (_) {} }
          function redrawDesktop() { const K2 = k(); if (!K2) return; try { const pm = big(K2.FindWindowW('Progman', null)); if (pm) K2.RedrawWindow(pm, null, null, 0x0001 | 0x0004 | 0x0080 | 0x0100); } catch (_) {} }
          function fullscreenBusy() { const K2 = k(); if (!K2) return false; try { const st = [0]; K2.SHQueryUserNotificationState(st); return st[0] >= 1 && st[0] <= 4; } catch (_) { return false; } }
          function setPaused(p) {
            if (p === paused) return; paused = p;
            if (catsWin && !catsWin.isDestroyed()) { catsWin.webContents.send('zz-pause', p); if (S.mode === 'bar') placeBar(); }
          }
          function busyNow() { return locked || (S.mode !== 'full' && fullscreenBusy()); }   /* 全画面モードは ロック中だけ 止める */
          /* ===== 今日の キーボードの タップ数（押した 回数だけ。どの キーかは 記録しない） ===== */
          function dayKey() { const n = new Date(); return n.getFullYear() + '-' + (n.getMonth() + 1) + '-' + n.getDate(); }
          let tapsSent = -1;
          function startTaps() {
            try {
              const { uIOhook } = require('uiohook-napi');
              const down = new Set();
              uIOhook.on('keydown', (e) => {
                if (down.has(e.keycode)) return;   /* おしっぱなしの くりかえしは 数えない */
                down.add(e.keycode);
                const d = dayKey(); if (S.taps.day !== d) S.taps = { day: d, n: 0 };
                S.taps.n++;
              });
              uIOhook.on('keyup', (e) => { down.delete(e.keycode); });
              uIOhook.start();
              setInterval(() => {
                const d = dayKey(); if (S.taps.day !== d) S.taps = { day: d, n: 0 };
                if (S.taps.n !== tapsSent && catsWin && !catsWin.isDestroyed()) { tapsSent = S.taps.n; catsWin.webContents.send('zz-taps', S.taps.n); }
              }, 1500);
              setInterval(saveS, 30000);
              app.on('will-quit', () => { try { uIOhook.stop(); } catch (_) {} });
            } catch (e) { log('taps ' + (e && e.message)); }
          }
          function checkWake() {
            if (wakeH === null) return;
            const n = new Date(), day = n.toDateString(), h = n.getHours() + n.getMinutes() / 60;
            if (S.wakeDay === day || !(h >= wakeH && h < wakeH + 0.25)) return;
            S.wakeDay = day; saveS();
            if (catsWin && !catsWin.isDestroyed()) { setPaused(false); catsWin.webContents.send('zz-wake'); }
            const nt = notify('おはよう！ 体操の 時間だよ'); if (nt) nt.on('click', () => openPanel(true));
          }

          if (!app.requestSingleInstanceLock()) {
            app.quit();
          } else {
            app.on('second-instance', (_e, argv) => { const c = linkFrom(argv); if (c) { pendingLink = c; openSetup(); if (setupWin) setupWin.webContents.send('zz-link', c); } else openPanel(true); });
            app.whenReady().then(() => {
              app.setAppUserModelId('io.github.zzcafe2800.zzcard');
              protocol.handle('app', (req) => {
                const u = new URL(req.url);
                const f = path.normalize(path.join(__dirname, decodeURIComponent(u.pathname)));
                if (!f.startsWith(__dirname)) return new Response('no', { status: 403 });
                return net.fetch(pathToFileURL(f).href);
              });
              loadS();
              pendingLink = linkFrom(process.argv);
              if (!S.setupDone || !S.uid || pendingLink) openSetup(); else openCats();
              if (!globalShortcut.register(KEY, () => openPanel(true))) log('shortcut failed');
              if (!globalShortcut.register(KEY2, () => { if (panelWin) panelWin.minimize(); openSetup(); })) log('shortcut2 failed');
              startTaps();
              applyAutoStart();
              setInterval(placeBar, 700);
              setInterval(() => setPaused(busyNow()), 3000);
              setInterval(checkWake, 20000);
              powerMonitor.on('lock-screen', () => { locked = true; setPaused(true); });
              powerMonitor.on('unlock-screen', () => { locked = false; setPaused(busyNow()); });
              screen.on('display-metrics-changed', () => { if (catsWin) openCats(); });
              try { require('electron-updater').autoUpdater.checkForUpdatesAndNotify(); } catch (_) {}
            });
            app.on('before-quit', () => { quitting = true; saveS(); });
            app.on('will-quit', () => { try { globalShortcut.unregisterAll(); } catch (_) {} });
            app.on('window-all-closed', () => app.quit());
          }
          ZZEOF
          cat > desktop/preload.js << 'ZZEOF'
          /* 画面と PC版本体の つなぎ */
          const { contextBridge, ipcRenderer } = require('electron');
          const CH = ['zz-link', 'zz-wake', 'zz-pause', 'zz-refresh', 'zz-panel-open', 'zz-taps'];
          contextBridge.exposeInMainWorld('zz', {
            state: () => ipcRenderer.invoke('zz-state'),
            set: (o) => ipcRenderer.invoke('zz-set', o),
            start: (o) => ipcRenderer.send('zz-start', o),
            openSetup: () => ipcRenderer.send('zz-open-setup'),
            quit: () => ipcRenderer.send('zz-quit'),
            hidePanel: () => ipcRenderer.send('zz-hide-panel'),
            recorded: () => ipcRenderer.send('zz-recorded'),
            setWake: (h) => ipcRenderer.send('zz-wake-time', h),
            log: (m) => ipcRenderer.send('zz-log', String(m)),
            ready: () => ipcRenderer.send('zz-ready'),
            on: (ch, cb) => { if (CH.includes(ch)) ipcRenderer.on(ch, (_e, v) => { try { cb(v); } catch (_) {} }); }
          });
          ZZEOF
          cat > desktop/setup.html << 'ZZEOF'
          <!doctype html><html lang="ja"><head><meta charset="utf-8"><title>ズズラジオ体操部</title>
          <style>
          *{box-sizing:border-box}html,body{margin:0;height:100%}[hidden]{display:none !important}
          body{overflow:auto;font-family:"Yu Gothic UI","Meiryo",system-ui,sans-serif;color:#2b3242;background:#eef1f5;display:flex;align-items:flex-start;justify-content:center}
          .card{width:560px;display:flex;flex-direction:column;gap:14px;padding:20px 30px}
          .top{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800}
          .lb{font-size:13px;font-weight:800;color:#8a93a3;margin-bottom:8px}
          .ok{display:flex;align-items:center;justify-content:space-between;background:#e6f4ec;border-radius:14px;padding:14px 18px;font-weight:800}
          .ok i{width:26px;height:26px;border-radius:50%;background:#3f9c6a;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-style:normal;margin-right:10px}
          .row{display:flex;gap:10px}
          input{flex:1;min-width:0;height:48px;border-radius:14px;border:1.5px solid #d6dee8;padding:0 14px;font:inherit;font-size:20px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;background:#fff}
          button{font:inherit;cursor:pointer}
          .b2{height:48px;padding:0 22px;border-radius:14px;border:0;background:#2b3242;color:#fff;font-weight:800;font-size:15px}
          .tiles{display:flex;gap:12px}
          .tile{flex:1;border:2px solid #d6dee8;border-radius:16px;background:#fff;padding:8px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:800;color:#8a93a3}
