          <script src="catfig.js"></script>
          <script>
          var light = (hex) => { const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return false; const n = parseInt(m[1], 16); return ((n >> 16) * 299 + ((n >> 8) & 255) * 587 + (n & 255) * 114) / 255000 > 0.62; };
          function simpleFig(b, e, sleep) {   /* 絵を まだ 置いていない 人：色だけの シンプルな 猫 */
            const ey = light(b) ? '#2b3242' : '#fff';
            const svg = sleep
              ? '<svg viewBox="0 0 120 124" xmlns="http://www.w3.org/2000/svg"><path d="M60 121 C30 121 15 111 17 96 C19 79 38 69 60 69 C82 69 101 79 103 96 C105 111 90 121 60 121 Z" fill="' + b + '"/><path d="M45 75 L49 57 L59 68 Z M75 75 L71 57 L61 68 Z" fill="' + b + '" stroke="' + b + '" stroke-width="3" stroke-linejoin="round"/><path d="M47 86 q5 4 10 0 M63 86 q5 4 10 0" fill="none" stroke="' + ey + '" stroke-width="4.6" stroke-linecap="round"/></svg>'
              : '<svg viewBox="0 0 120 124" xmlns="http://www.w3.org/2000/svg"><path d="M86 112 C104 112 110 92 98 82" fill="none" stroke="' + b + '" stroke-width="13" stroke-linecap="round"/><path d="M60 118 C32 118 26 90 31 66 C35 46 44 41 60 41 C76 41 85 46 89 66 C94 90 88 118 60 118 Z" fill="' + b + '"/><circle cx="60" cy="46" r="27" fill="' + b + '"/><path d="M36 31 L40 8 L55 22 Z M84 31 L80 8 L65 22 Z" fill="' + b + '" stroke="' + b + '" stroke-width="4" stroke-linejoin="round"/><path d="M41 25 L43 14 L50 21 Z M79 25 L77 14 L70 21 Z" fill="' + e + '"/><circle cx="50" cy="48" r="7.5" fill="' + ey + '"/><circle cx="50" cy="48" r="4.8" fill="#1c1c1c"/><circle cx="70" cy="48" r="7.5" fill="' + ey + '"/><circle cx="70" cy="48" r="4.8" fill="#1c1c1c"/></svg>';
            return '<div class="catFig"><span class="catPose">' + svg + '</span></div>';
          }
          </script>
          <script type="module">
          import { createLocal, saveLook } from './fb.js';
          const $ = (id) => document.getElementById(id);
          const BODY = ['#1c1c1c', '#f2efe8', '#c98b5b', '#8a8d99', '#e8c07a', '#7a5230', '#d9d4ce', '#5b6275'];
          const EAR = ['#a6bfd2', '#f2a6b8', '#f4c95d', '#9ad0a0', '#b7a6e8', '#f59f7a'];
          let st = {}, body = BODY[0], ear = EAR[0], linked = false, opt = { autoStart: false, countTaps: false };
          function dots(id, list, set) { $(id).innerHTML = list.map((c) => '<button type="button" data-c="' + c + '" style="background:' + c + '" aria-label="' + c + '"></button>').join(''); $(id).querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { set(b.dataset.c); paint(); })); }
          const fig = (pose) => { try { return buildCatFig(body, ear, {}, pose).outerHTML; } catch (_) { return simpleFig(body, ear, pose === 'sleep'); } };
          function paint() {
            $('catPv').innerHTML = fig('sit');
            $('bodyDots').querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.c === body));
            $('earDots').querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.c === ear));
            const named = $('nm').value.trim().length > 0;
            $('colNew').classList.toggle('on', named); 
            document.querySelectorAll('.sw').forEach((w) => w.querySelectorAll('button').forEach((b) => b.classList.toggle('on', String(+!!opt[w.dataset.k]) === b.dataset.v)));
            $('go').disabled = !named;   /* 名前と 見た目は だれでも 最初から（サイトと つなぐのは つなぎたい 人だけ） */
          }
          dots('bodyDots', BODY, (c) => { body = c; });
          dots('earDots', EAR, (c) => { ear = c; });
          $('nm').addEventListener('input', paint);
          document.querySelectorAll('.sw button').forEach((b) => b.addEventListener('click', () => { opt[b.parentNode.dataset.k] = b.dataset.v === '1'; paint(); }));
          $('go').addEventListener('click', async () => {
            $('go').disabled = true; $('msg').textContent = '';
            try {
              const nm = $('nm').value.trim().slice(0, 12);
              if (!linked) { const uid = await createLocal({ name: nm, body, ear, s: fig('sit'), z: fig('sleep') }); await zz.set({ uid, local: true }); st.uid = uid; }
              await saveLook(st.uid, { body, ear, pose: 'sit', cos: {}, own: {} }, fig('sit'), fig('sleep'), nm);
              await zz.start({ mode: st.mode || 'wall', hideSleep: !!st.hideSleep, noEmo: !!st.noEmo, noShare: !!st.noShare, noTapShow: !!st.noTapShow, autoStart: opt.autoStart, countTaps: opt.countTaps, lowQ: !!st.lowQ, catScale: st.catScale || 1, cardWall: st.cardWall !== false, cardBar: !!st.cardBar, sleepMode: st.sleepMode || 'show' });
            } catch (e) { $('msg').textContent = 'はじめられなかったよ'; $('go').disabled = false; }
          });
          zz.state().then((s) => { st = s || {}; if (window.zzLang) zzLang(st.lang); linked = !!st.uid && st.local !== true; opt = { autoStart: !!st.autoStart, countTaps: !!st.countTaps }; paint(); zz.ready(); }).catch(() => paint());
          paint();
          try { document.body.classList.toggle('dot', localStorage.getItem('zz_dot') === '1'); } catch (_) {}
          </script></body></html>
