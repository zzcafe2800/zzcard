# ズズラジオ体操部 PC版（Windows）を つくる
# Actions の「PC版をつくる」→「Run workflow」で、Releases に zzcard-setup.exe が できる。
# まどの 中身は いつもの サイト。タスクバー／壁紙の 猫は、サイトの「奥で あそぶ 猫」を 作る時に 取り出して 使う。
# 猫の うごきを サイトで かえた 時や、PC版そのものを かえた 時は、もう一度 Run workflow する（版の 番号は 自動で 上がる）。
name: PC版をつくる
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: PC版の ファイルを 組み立てる
        shell: bash
        run: |
          mkdir -p desktop
          cat > desktop/package.json << 'ZZEOF'
          {
            "name": "zzcard-desktop",
            "productName": "ズズラジオ体操部",
            "version": "0.1.RUNNUM",
            "description": "ズズラジオ体操部 PC版",
            "author": "zzcafe2800",
            "main": "main.js",
            "dependencies": { "electron-updater": "^6.8.9", "koffi": "^3.3.1" },
            "devDependencies": { "electron": "^44.4.5", "electron-builder": "^26.15.3" },
            "build": {
              "appId": "io.github.zzcafe2800.zzcard",
              "productName": "ズズラジオ体操部",
              "artifactName": "zzcard-setup.${ext}",
              "npmRebuild": false,
              "files": ["main.js", "preload.js", "offline.html", "icon.png", "pet.html", "pet-preload.js", "pet-main.js", "pet-engine.js"],
              "protocols": [{ "name": "zzcard", "schemes": ["zzcard"] }],
              "win": { "target": "nsis", "icon": "icon.png" },
              "nsis": { "oneClick": true, "perMachine": false, "createDesktopShortcut": true, "shortcutName": "ズズラジオ体操部" },
              "publish": [{ "provider": "github", "owner": "zzcafe2800", "repo": "zzcard" }]
            }
          }
          ZZEOF
          cat > desktop/main.js << 'ZZEOF'
          /* ズズラジオ体操部 PC版（Electron）
             ・まどの 中身は いつもの サイト（サイトを 更新すれば PC版も 最新）
             ・zzcard://link?c=コード で サイトと つなぐ
             ・タスクバーの 上 ／ 壁紙に 猫だけを 出す（うごきは サイトの「奥で あそぶ 猫」と 同じ）
             ・まどを 閉じても 右下の タスクトレイに のこる。全画面の 時・画面ロック中は 猫を 止める
             ・起きる 時刻に 自分の 猫が 知らせる */
          const { app, BrowserWindow, shell, ipcMain, Menu, Tray, nativeImage, screen, powerMonitor, Notification } = require('electron');
          const path = require('path');
          const fs = require('fs');
          const { pathToFileURL } = require('url');

          const SITE = 'https://zzcafe2800.github.io/zzcard/';
          const ICON = path.join(__dirname, 'icon.png');
          let win = null, bar = null, wall = null, tray = null;
          let pendingLink = null, quitting = false, paused = false, locked = false;
          let S = { bar: true, wall: false, wakeDay: '' };
          let cats = null;

          function dataFile() { return path.join(app.getPath('userData'), 'pet.json'); }
          function load() { try { const d = JSON.parse(fs.readFileSync(dataFile(), 'utf8')); if (d.S) S = Object.assign(S, d.S); if (d.cats) cats = d.cats; } catch (_) {} }
          function save() { try { fs.writeFileSync(dataFile(), JSON.stringify({ S, cats })); } catch (_) {} }

          app.commandLine.appendSwitch('autoplay-policy', 'no-user-gesture-required');
          if (process.defaultApp && process.argv.length >= 2) app.setAsDefaultProtocolClient('zzcard', process.execPath, [path.resolve(process.argv[1])]);
          else app.setAsDefaultProtocolClient('zzcard');

          function linkFrom(argv) {
            const u = (argv || []).find((a) => typeof a === 'string' && a.startsWith('zzcard://'));
            if (!u) return null;
            try { return new URL(u).searchParams.get('c'); } catch (_) { return null; }
          }
          function showMain() {
            if (!win || win.isDestroyed()) { createWindow(); return; }
            if (win.isMinimized()) win.restore();
            win.show(); win.focus();
          }
          function sendLink(code) {
            if (!code) return;
            if (win && !win.isDestroyed()) { showMain(); win.webContents.send('zz-link', code); }
            else pendingLink = code;
          }

          function createWindow() {
            Menu.setApplicationMenu(null);
            win = new BrowserWindow({
              width: 1280, height: 800, minWidth: 900, minHeight: 600,
              backgroundColor: '#dfe7ef', title: 'ズズラジオ体操部', icon: ICON,
              webPreferences: { preload: path.join(__dirname, 'preload.js'), contextIsolation: true, nodeIntegration: false, sandbox: true }
            });
            win.loadURL(SITE);
            win.webContents.setWindowOpenHandler(({ url }) => {
              if (url.startsWith(SITE)) return { action: 'allow' };
              shell.openExternal(url);
              return { action: 'deny' };
            });
            win.webContents.on('will-navigate', (e, url) => {
              if (!url.startsWith(SITE) && !url.startsWith('zzcard://')) { e.preventDefault(); shell.openExternal(url); }
            });
            win.webContents.on('did-fail-load', (_e, code, _d, _u, isMain) => {
              if (isMain && code !== -3) win.loadFile(path.join(__dirname, 'offline.html'));
            });
            win.on('close', (e) => { if (!quitting) { e.preventDefault(); win.hide(); } });   /* 閉じても トレイに のこる */
            win.on('closed', () => { win = null; });
          }

          /* ===== 猫だけの まど ===== */
          function petWin(opts, query) {
            const w = new BrowserWindow(Object.assign({
              transparent: true, frame: false, resizable: false, movable: false, minimizable: false, maximizable: false,
              fullscreenable: false, skipTaskbar: true, focusable: false, hasShadow: false, show: false, backgroundColor: '#00000000',
              webPreferences: { preload: path.join(__dirname, 'pet-preload.js'), contextIsolation: true, sandbox: true, backgroundThrottling: false }
            }, opts));
            w.setIgnoreMouseEvents(true);   /* クリックは 下の 画面へ とおす */
            w.loadFile(path.join(__dirname, 'pet.html'), { query });
            return w;
          }
          function barBounds() { const wa = screen.getPrimaryDisplay().workArea, H = 160; return { x: wa.x, y: wa.y + wa.height - H, width: wa.width, height: H }; }
          function makeBar() {
            if (bar) return;
            bar = petWin(Object.assign({ alwaysOnTop: true }, barBounds()), { mode: 'bar' });
            bar.setAlwaysOnTop(true, 'floating');
            bar.once('ready-to-show', () => { if (!paused && bar) bar.showInactive(); });
            bar.on('closed', () => { bar = null; });
          }
          function wallpaperImage() {
            try {
              const src = path.join(process.env.APPDATA || '', 'Microsoft', 'Windows', 'Themes', 'TranscodedWallpaper');
              if (!fs.existsSync(src)) return null;
              const dst = path.join(app.getPath('userData'), 'wallpaper.jpg');
              fs.copyFileSync(src, dst);
              return pathToFileURL(dst).href + '?t=' + Date.now();
            } catch (_) { return null; }
          }
          function makeWall() {
            if (wall) return;
            const d = screen.getPrimaryDisplay(), b = d.bounds, wa = d.workArea;
            const q = { mode: 'wall', tb: String((b.y + b.height) - (wa.y + wa.height)) };
            const img = wallpaperImage(); if (img) q.bg = img;
            wall = petWin(Object.assign({ alwaysOnTop: false }, b), q);
            wall.once('ready-to-show', () => {
              if (!wall) return;
              wall.showInactive();
              setTimeout(() => {
                if (wall && !attachToDesktop(wall)) {
                  try { wall.close(); } catch (_) {}
                  S.wall = false; save(); buildTray();
                  try { new Notification({ title: 'ズズラジオ体操部', body: '壁紙の 猫を 出せなかったよ', icon: ICON }).show(); } catch (_) {}
                }
              }, 400);
            });
            wall.on('closed', () => { wall = null; redrawDesktop(); });
          }
          function applyPets() {
            if (S.bar) makeBar(); else if (bar) bar.close();
            if (S.wall) makeWall(); else if (wall) wall.close();
          }
          function sendCats(w) { if (w && !w.isDestroyed() && cats) w.webContents.send('zz-cats', cats); }
          ipcMain.on('zz-pet-ready', (e) => {
            const w = BrowserWindow.fromWebContents(e.sender);
            sendCats(w);
            if (paused && w) w.webContents.send('zz-pause', true);
          });
          ipcMain.on('zz-cats', (_e, d) => {
            if (!d || !Array.isArray(d.cats)) return;
            cats = d; save(); sendCats(bar); sendCats(wall);
          });
          ipcMain.on('zz-ready', () => {
            if (pendingLink && win) { win.webContents.send('zz-link', pendingLink); pendingLink = null; }
          });
          ipcMain.on('zz-retry', () => { if (win) win.loadURL(SITE); });

          /* ===== Windows の 部品（壁紙の うしろに 入れる・全画面の 判定） ===== */
          let K = null;
          function k() {
            if (K !== null) return K;
            try {
              if (process.platform !== 'win32') throw new Error('not windows');
              const koffi = require('koffi');
              const u = koffi.load('user32.dll'), sh = koffi.load('shell32.dll');
              const EnumProc = koffi.proto('bool __stdcall EnumProc(intptr_t hwnd, intptr_t lp)');
              K = {
                EnumProc,
                FindWindowW: u.func('intptr_t __stdcall FindWindowW(str16 cls, str16 name)'),
                FindWindowExW: u.func('intptr_t __stdcall FindWindowExW(intptr_t parent, intptr_t after, str16 cls, str16 name)'),
                SendMessageTimeoutW: u.func('intptr_t __stdcall SendMessageTimeoutW(intptr_t hwnd, uint32 msg, uintptr_t wp, intptr_t lp, uint32 flags, uint32 timeout, _Out_ uintptr_t *res)'),
                SetParent: u.func('intptr_t __stdcall SetParent(intptr_t child, intptr_t parent)'),
                SetWindowPos: u.func('bool __stdcall SetWindowPos(intptr_t hwnd, intptr_t after, int x, int y, int cx, int cy, uint32 flags)'),
                EnumWindows: u.func('bool __stdcall EnumWindows(EnumProc *cb, intptr_t lp)'),
                RedrawWindow: u.func('bool __stdcall RedrawWindow(intptr_t hwnd, void *rect, void *rgn, uint32 flags)'),
                SHQueryUserNotificationState: sh.func('int32 __stdcall SHQueryUserNotificationState(_Out_ int32 *state)')
              };
            } catch (_) { K = false; }
            return K;
          }
          function big(v) { try { return BigInt(v || 0); } catch (_) { return 0n; } }
          function hwndOf(w) { const b = w.getNativeWindowHandle(); return b.length >= 8 ? b.readBigUInt64LE(0) : BigInt(b.readUInt32LE(0)); }
          function attachToDesktop(w) {
            const K2 = k(); if (!K2) return false;
            try {
              const h = hwndOf(w);
              const progman = big(K2.FindWindowW('Progman', null)); if (!progman) return false;
              K2.SendMessageTimeoutW(progman, 0x052C, 0xD, 0x1, 0, 1000, [0]);
              K2.SendMessageTimeoutW(progman, 0x052C, 0, 0, 0, 1000, [0]);
              const defIn = big(K2.FindWindowExW(progman, 0, 'SHELLDLL_DefView', null));
              const wkIn = big(K2.FindWindowExW(progman, 0, 'WorkerW', null));
              if (defIn && wkIn) {   /* Windows 11 24H2 から：Progman の 中で、アイコンの すぐ 下に 入れる */
                K2.SetParent(h, progman);
                K2.SetWindowPos(h, defIn, 0, 0, 0, 0, 0x0001 | 0x0002 | 0x0010);
                return true;
              }
              let worker = 0n;   /* それより 前：アイコンの 窓の つぎの WorkerW の 中に 入れる */
              K2.EnumWindows((top) => {
                const dv = big(K2.FindWindowExW(top, 0, 'SHELLDLL_DefView', null));
                if (dv) worker = big(K2.FindWindowExW(0, top, 'WorkerW', null));
                return true;
              }, 0);
              if (!worker) return false;
              K2.SetParent(h, worker);
              return true;
            } catch (_) { return false; }
          }
          function redrawDesktop() {
            const K2 = k(); if (!K2) return;
            try { const pm = big(K2.FindWindowW('Progman', null)); if (pm) K2.RedrawWindow(pm, null, null, 0x0001 | 0x0004 | 0x0080 | 0x0100); } catch (_) {}
          }
          function fullscreenBusy() {
            const K2 = k(); if (!K2) return false;
            try { const st = [0]; K2.SHQueryUserNotificationState(st); return st[0] >= 1 && st[0] <= 4; } catch (_) { return false; }
          }
          function setPaused(p) {
            if (p === paused) return;
            paused = p;
            [bar, wall].forEach((w) => { if (w && !w.isDestroyed()) w.webContents.send('zz-pause', p); });
            if (bar && !bar.isDestroyed()) { if (p) bar.hide(); else bar.showInactive(); }
          }

          /* ===== 起きる 時刻（自分の 猫が まんなかまで 歩いてきて 知らせる） ===== */
          function checkWake() {
            if (!cats || typeof cats.wake !== 'number' || !isFinite(cats.wake)) return;
            const n = new Date(), day = n.toDateString(), h = n.getHours() + n.getMinutes() / 60;
            if (S.wakeDay === day) return;
            if (h >= cats.wake && h < cats.wake + 0.25) {
              S.wakeDay = day; save();
              if (bar && !bar.isDestroyed()) { setPaused(false); bar.webContents.send('zz-wake'); }
              try { const nt = new Notification({ title: 'おはよう！', body: '体操の 時間だよ', icon: ICON }); nt.on('click', showMain); nt.show(); } catch (_) {}
            }
          }

          /* ===== トレイ ===== */
          function buildTray() {
            if (!tray) {
              tray = new Tray(nativeImage.createFromPath(ICON).resize({ width: 16, height: 16 }));
              tray.setToolTip('ズズラジオ体操部');
              tray.on('click', showMain);
            }
            tray.setContextMenu(Menu.buildFromTemplate([
              { label: 'ひらく', click: showMain },
              { type: 'separator' },
              { label: 'タスクバーの 猫', type: 'checkbox', checked: S.bar, click: (m) => { S.bar = m.checked; save(); applyPets(); } },
              { label: '壁紙の 猫', type: 'checkbox', checked: S.wall, click: (m) => { S.wall = m.checked; save(); applyPets(); } },
              { type: 'separator' },
              { label: 'おわる', click: () => { quitting = true; app.quit(); } }
            ]));
          }

          if (!app.requestSingleInstanceLock()) {
            app.quit();
          } else {
            app.on('second-instance', (_e, argv) => { const c = linkFrom(argv); if (c) sendLink(c); else showMain(); });
            app.on('open-url', (e, url) => { e.preventDefault(); sendLink(linkFrom([url])); });
            app.whenReady().then(() => {
              app.setAppUserModelId('io.github.zzcafe2800.zzcard');
              load();
              pendingLink = linkFrom(process.argv);
              createWindow();
              buildTray();
              applyPets();
              setInterval(() => setPaused(locked || fullscreenBusy()), 3000);
              setInterval(checkWake, 20000);
              powerMonitor.on('lock-screen', () => { locked = true; setPaused(true); });
              powerMonitor.on('unlock-screen', () => { locked = false; setPaused(fullscreenBusy()); });
              screen.on('display-metrics-changed', () => {
                if (bar && !bar.isDestroyed()) bar.setBounds(barBounds());
                if (wall) { try { wall.close(); } catch (_) {} setTimeout(() => { if (S.wall) makeWall(); }, 800); }
              });
              try { require('electron-updater').autoUpdater.checkForUpdatesAndNotify(); } catch (_) {}
            });
            app.on('before-quit', () => { quitting = true; });
            app.on('window-all-closed', () => { if (quitting) app.quit(); });
          }
          ZZEOF
          cat > desktop/preload.js << 'ZZEOF'
          /* サイトに「PC版で 開いている」ことを つたえる・つなぎコード・猫たちの 絵を あずかる */
          const { contextBridge, ipcRenderer } = require('electron');
          contextBridge.exposeInMainWorld('zzDesktop', {
            isDesktop: true,
            platform: process.platform,
            onLink: (cb) => {
              ipcRenderer.on('zz-link', (_e, code) => { try { cb(code); } catch (_) {} });
              ipcRenderer.send('zz-ready');
            },
            setCats: (d) => { try { ipcRenderer.send('zz-cats', d); } catch (_) {} },
            retry: () => ipcRenderer.send('zz-retry')
          });
          ZZEOF
          cat > desktop/pet-preload.js << 'ZZEOF'
          /* 猫だけの 画面に、猫たち・とめる／うごく・起きる 時刻を わたす */
          const { contextBridge, ipcRenderer } = require('electron');
          contextBridge.exposeInMainWorld('zzPet', {
            onCats: (cb) => ipcRenderer.on('zz-cats', (_e, d) => { try { cb(d); } catch (_) {} }),
            onPause: (cb) => ipcRenderer.on('zz-pause', (_e, p) => { try { cb(!!p); } catch (_) {} }),
            onWake: (cb) => ipcRenderer.on('zz-wake', () => { try { cb(); } catch (_) {} }),
            ready: () => ipcRenderer.send('zz-pet-ready')
          });
          ZZEOF
          cat > desktop/pet-main.js << 'ZZEOF'
          /* 猫だけの 画面：タスクバーの 上（bar）／ 壁紙（wall）。うごきは サイトの「奥で あそぶ 猫」と 同じ */
          (function(){
            var P=new URLSearchParams(location.search),MODE=P.get("mode")||"bar",TB=parseInt(P.get("tb")||"48",10)||48;
            if(MODE==="wall"){ document.body.classList.add("wall"); var bg=P.get("bg"); if(bg)document.body.style.backgroundImage='url("'+bg+'")'; }
            window.requestAnimationFrame=function(cb){ return setTimeout(function(){ cb(performance.now()); },33); };   /* 1秒 30回まで（かるく） */
            window.cancelAnimationFrame=function(id){ clearTimeout(id); };
            var snap=null,paused=false;
            function zone(){ var l=$("farPlay"),bw=l.clientWidth||innerWidth,bh=l.clientHeight||innerHeight,k=bh/640;
              var gp=(MODE==="wall")?(bh-TB-30):(bh-22),catPx=(MODE==="wall")?60:46;
              FP_H[1]=catPx*640/bh;
              window._hsZone={tier:1,W:1000,line:[[25,gp/k],[975,gp/k]],dz:((MODE==="wall")?34:5)/k,props:[]}; }
            function figOf(c){ var d=document.createElement("div"); d.innerHTML=c.svg; return d.firstElementChild; }
            window._fpTodayFigs=function(){ var out=[]; ((snap&&snap.cats)||[]).slice(0,10).forEach(function(c){ var f=figOf(c); if(f)out.push({fig:f,h:c.h||60,w:c.w||74,sleep:!!c.sleep,self:!!c.self}); }); return out; };
            function start(){ zone(); try{ _fpStop(); }catch(_){}
              setTimeout(function(){ if(!snap||!snap.cats||!snap.cats.length)return; zone(); var ok=_fpStart();
                if(ok){ (snap.cats||[]).slice(0,10).forEach(function(c,i){ if(_fpCats[i])_fpCats[i].isSelf=!!c.self; }); if(paused)pause(true); } },80); }
            function pause(p){ paused=!!p; if(paused){ _fpOn=false; try{ cancelAnimationFrame(_fpRaf); }catch(_){} }
              else if(snap&&_fpCats.length&&!_fpOn){ _fpOn=true; _fpLast=performance.now(); _fpRaf=requestAnimationFrame(_fpTick); } }
            /* ⑥ 起きる 時刻：自分の 猫が まんなかまで 歩いてきて 知らせる */
            function wake(){ if(!snap)return; if(paused)pause(false);
              var c=null; for(var i=0;i<_fpCats.length;i++){ if(_fpCats[i].isSelf){ c=_fpCats[i]; break; } }
              if(!c){ if(!snap.me)return; snap.cats=[{svg:snap.me.svg,h:snap.me.h,w:snap.me.w,self:true}].concat((snap.cats||[]).slice(0,9)); start(); setTimeout(wake,900); return; }
              try{ if(c.ev)_fpEvEnd(); }catch(_){}
              if(c.sleep&&snap.me){ var nf=figOf(snap.me); if(nf){ nf.removeAttribute("id"); nf.style.left=(-(snap.me.w||74)*.52).toFixed(1)+"px"; nf.style.top=(-(snap.me.h||60)*.95).toFixed(1)+"px"; nf.style.width=(snap.me.w||74)+"px"; nf.style.height=(snap.me.h||60)+"px"; c.el.replaceChild(nf,c.fig); c.fig=nf; c.fh=snap.me.h||60; c.fw=snap.me.w||74; } }
              c.sleep=false; c.soc=true; c.hidden=false; c.lift=0; c.t=(c.t<.5)?Math.min(c.t,.1):Math.max(c.t,.9);
              c.q=[{a:"go",t:.5,z:.2,sp:2.2},{a:"emo",k:"sun"},{a:"wait",d:1,pose:"stand"},{a:"hops",n:3,d:.15,h:1},{a:"emo",k:"excl"},{a:"wait",d:9,pose:"sit"}];
              var b=document.createElement("div"); b.className="wakeBub"; b.innerHTML=(FP_ICON.sun||"")+"<span>おはよう</span>"; b.style.top=(-((_fpG&&_fpG.hp)||40)*1.5).toFixed(0)+"px"; c.el.appendChild(b);
              setTimeout(function(){ try{ b.remove(); }catch(_){} c.soc=false; },16000); }
            window.addEventListener("resize",function(){ zone(); });
            window.__zzPet={setSnap:function(d){ snap=d; start(); },pause:pause,wake:wake};
            if(window.zzPet){ zzPet.onCats(function(d){ snap=d; start(); }); zzPet.onPause(pause); zzPet.onWake(wake); zzPet.ready(); }
          })();
          ZZEOF
          cat > desktop/pet.html << 'ZZEOF'
          <!doctype html><html lang="ja"><head><meta charset="utf-8"><title>zz</title>
          <style>
          html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;}
          body.wall{background:#243049 center/cover no-repeat;}
          #homeScenery{position:absolute;inset:0;}
          #farPlay{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .8s ease;overflow:hidden;}
          #farPlay.on{opacity:1;}
          #farPlay .fpCat{position:absolute;left:0;top:0;width:0;height:0;will-change:transform;}
          #farPlay .fpCat .catFig{position:absolute;transform-origin:52% 95%;margin:0 !important;pointer-events:none;filter:drop-shadow(0 0 1px rgba(255,255,255,.75)) drop-shadow(0 0 3px rgba(255,255,255,.35));}
          #farPlay .fpSh{position:absolute;border-radius:50%;background:rgba(20,26,40,.55);filter:blur(1px);}
          #farPlay .fpProp{position:absolute;pointer-events:none;}
          #farPlay .fpPropX{position:absolute;left:0;top:0;pointer-events:none;will-change:transform;transform-origin:50% 100%;}
          #farPlay .fpPropX svg{width:100%;height:100%;display:block;overflow:visible;}
          #farPlay .fpEmo{position:absolute;pointer-events:none;animation:fpEmoUp 1.5s ease-out forwards;}
          #farPlay .fpEmo svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 1px rgba(255,255,255,.95));}
          @keyframes fpEmoUp{0%{opacity:0;transform:translateY(4px) scale(.55)}14%{opacity:1;transform:translateY(0) scale(1.08)}24%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
          #farPlay .fpDust{position:absolute;border-radius:50%;background:rgba(240,236,228,.85);pointer-events:none;animation:fpDustA .65s ease-out forwards;}
          @keyframes fpDustA{from{opacity:.8;transform:scale(.5)}to{opacity:0;transform:scale(1.6) translateY(-3px)}}
          #farPlay .fpBf{position:absolute;left:0;top:0;pointer-events:none;will-change:transform;}
          #farPlay .fpBf svg{width:100%;height:100%;display:block;}
          #farPlay .fpBf .fpBfW{transform-origin:10px 8px;animation:fpFlap .16s ease-in-out infinite alternate;}
          @keyframes fpFlap{from{transform:scaleX(1)}to{transform:scaleX(.25)}}
          #farPlay{transition:none;}
          #farPlay .catZ{display:none !important;}
          .wakeBub{position:absolute;left:0;transform:translate(-50%,-100%);display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:6px 13px 6px 8px;font:800 14px/1 "Yu Gothic UI","Meiryo",system-ui,sans-serif;color:#2b3242;box-shadow:0 6px 18px rgba(43,50,66,.22);white-space:nowrap;animation:wkIn .5s ease-out;z-index:30000;}
          .wakeBub svg{width:20px;height:20px;display:block;}
          @keyframes wkIn{from{opacity:0;transform:translate(-50%,-80%) scale(.8)}to{opacity:1;transform:translate(-50%,-100%) scale(1)}}
          </style></head>
          <body class="uiRest1"><div id="selectScreen" style="display:none"></div><div id="homeScenery"><div id="farPlay"></div></div>
          <script>
          /* サイトの 関数の かわり（猫だけの 画面） */
          var $=function(id){ return document.getElementById(id); };
          var _sceneCur=1,_devUnlockAll=false,_DEV_SKY=["sky-day"],_devSkyIdx=0;
          function currentSkyKey(){ var h=new Date().getHours(); return (h>=5&&h<9)?"sky-dawn":(h>=9&&h<10)?"sky-morning":(h>=10&&h<16)?"sky-day":(h>=16&&h<19)?"sky-evening":"sky-night"; }
          </script>
          <script src="pet-engine.js"></script>
          <script src="pet-main.js"></script>
          </body></html>
          ZZEOF
          cat > desktop/offline.html << 'ZZEOF'
          <!doctype html><html lang="ja"><head><meta charset="utf-8"><title>ズズラジオ体操部</title>
          <style>html,body{height:100%;margin:0}body{display:flex;align-items:center;justify-content:center;background:#dfe7ef;font-family:system-ui,sans-serif;color:#2b3242}
          .b{background:#fff;border-radius:20px;padding:28px 34px;text-align:center;box-shadow:0 14px 40px rgba(43,50,66,.16)}b{display:block;font-size:17px;margin-bottom:14px}
          button{height:44px;padding:0 26px;border:0;border-radius:999px;background:#2b3242;color:#fff;font-size:15px;font-weight:800;cursor:pointer}</style></head>
          <body><div class="b"><b>インターネットに つながっていないよ</b><button onclick="window.zzDesktop&&zzDesktop.retry?zzDesktop.retry():location.reload()">もう一度</button></div></body></html>
          ZZEOF
          cat > desktop/prep.js << 'ZZEOF'
          /* サイトの index.html から アイコンと「奥で あそぶ 猫」の 部分を 取り出す */
          const fs = require('fs');
          const s = fs.readFileSync('index.html', 'utf8');
          const m = s.match(/rel="apple-touch-icon" href="data:image\/png;base64,([^"]+)"/);
          if (!m) { console.error('icon not found'); process.exit(1); }
          fs.writeFileSync('desktop/icon192.png', Buffer.from(m[1], 'base64'));
          const a = s.indexOf('/* ===== UIが 消えている 間：今日 体操した 子たちが 奥で あそぶ');
          const b = s.indexOf('/* ===== /奥で あそぶ 猫 ===== */');
          if (a < 0 || b <= a) { console.error('cat engine markers not found'); process.exit(1); }
          fs.writeFileSync('desktop/pet-engine.js', s.slice(a, b));
          console.log('icon + cat engine ok', b - a);
          ZZEOF
          sed -i "s/0\.1\.RUNNUM/0.1.$GITHUB_RUN_NUMBER/" desktop/package.json
          grep '"version"' desktop/package.json
          node desktop/prep.js
          rm desktop/prep.js
      - name: アイコンを 大きくする（512px）
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $src = [System.Drawing.Image]::FromFile("$PWD\desktop\icon192.png")
          $bmp = New-Object System.Drawing.Bitmap 512, 512
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
          $g.PixelOffsetMode = [System.Drawing.Drawing2D.PixelOffsetMode]::HighQuality
          $g.DrawImage($src, 0, 0, 512, 512)
          $bmp.Save("$PWD\desktop\icon.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose(); $bmp.Dispose(); $src.Dispose()
          Remove-Item "$PWD\desktop\icon192.png"
      - name: インストーラーを 作る
        working-directory: desktop
        shell: bash
        run: |
          npm install
          npx electron-builder --win --publish never
          ls dist
      - name: Releases に のせる（先に 版の 目印＝タグを 作ってから 公開）
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="0.1.$GITHUB_RUN_NUMBER"
          git tag "v$VER"
          git push origin "v$VER"
          gh release create "v$VER" desktop/dist/zzcard-setup.exe desktop/dist/zzcard-setup.exe.blockmap desktop/dist/latest.yml --title "PC版 $VER" --notes "ズズラジオ体操部 PC版 $VER" --latest
