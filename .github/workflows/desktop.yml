          <script type="module">
          import { redeem, createLocal } from './fb.js';
          const $ = (id) => document.getElementById(id);
          const BODY = ['#1c1c1c', '#f2efe8', '#c98b5b', '#8a8d99', '#e8c07a', '#7a5230', '#d9d4ce', '#5b6275'];
          const EAR = ['#a6bfd2', '#f2a6b8', '#f4c95d', '#9ad0a0', '#b7a6e8', '#f59f7a'];
          let st = {}, body = BODY[0], ear = EAR[0], linked = false, opt = { autoStart: false, countTaps: false };
          function dots(id, list, set) { $(id).innerHTML = list.map((c) => '<button type="button" data-c="' + c + '" style="background:' + c + '" aria-label="' + c + '"></button>').join(''); $(id).querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { set(b.dataset.c); paint(); })); }
          function paint() {
            $('catPv').innerHTML = simpleFig(body, ear, false);
            $('bodyDots').querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.c === body));
            $('earDots').querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.c === ear));
            const named = $('nm').value.trim().length > 0;
            $('colNew').classList.toggle('on', !linked && named); $('colLink').classList.toggle('on', linked);
            $('lkIn').hidden = linked; $('lkOk').hidden = !linked;
            document.querySelectorAll('.sw').forEach((w) => w.querySelectorAll('button').forEach((b) => b.classList.toggle('on', String(+!!opt[w.dataset.k]) === b.dataset.v)));
            $('go').disabled = !(linked || named);
          }
          dots('bodyDots', BODY, (c) => { body = c; });
          dots('earDots', EAR, (c) => { ear = c; });
          $('nm').addEventListener('input', paint);
          document.querySelectorAll('.sw button').forEach((b) => b.addEventListener('click', () => { opt[b.parentNode.dataset.k] = b.dataset.v === '1'; paint(); }));
          async function link() {
