          *{box-sizing:border-box}[hidden]{display:none !important}
          :root{--nv:#2b3242;--pc:#7cc8ee;--mu:#8a93a3;--ln:#e6eaf0}
          body{margin:0;min-height:100vh;font-family:"Yu Gothic UI","Meiryo",system-ui,sans-serif;color:var(--nv);background:radial-gradient(120% 90% at 50% 0%,#3b4660,#283042 55%,#1c2231);display:flex;justify-content:center;padding:26px 20px}
          .wrap{width:100%;max-width:580px}
          h1{margin:0 0 16px;color:#fff;font-size:22px;letter-spacing:.06em;text-align:center}
          .cols{display:flex;gap:12px;align-items:stretch;max-width:320px;margin:0 auto}
          .col{flex:1;background:#fff;border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:10px;border:3px solid transparent;transition:border-color .15s}
          .col.on{border-color:var(--pc)}
          .ttl{font-size:16px;font-weight:900;text-align:center}
          .pv{height:120px;display:flex;justify-content:center;align-items:flex-end}.pv .catFig{width:100px;height:104px}.pv svg{width:100%;height:100%}
          input{width:100%;height:42px;border-radius:999px;border:1.5px solid var(--ln);padding:0 14px;font:inherit;font-size:14px;font-weight:700}
          input:focus{outline:none;border-color:var(--nv)}
          .lb{font-size:11px;font-weight:800;color:var(--mu)}
          .dots{display:flex;flex-wrap:wrap;gap:6px}.dots button{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--ln);cursor:pointer;padding:0}.dots button.on{box-shadow:0 0 0 2.5px var(--nv)}
          .or{align-self:center;color:rgba(255,255,255,.7);font-size:12px;font-weight:800;writing-mode:vertical-rl}
          .lk{display:flex;flex-direction:column;gap:10px;flex:1;justify-content:center}
          .hint{font-size:12px;color:var(--mu);text-align:center;line-height:1.6}
          .sbtn{height:42px;border-radius:999px;border:0;background:var(--nv);color:#fff;font:inherit;font-size:14px;font-weight:800;cursor:pointer}
          .ok{background:#e6f4ec;color:#2f7d53;border-radius:14px;padding:12px;text-align:center;font-weight:900}
          .opts{display:flex;gap:10px;justify-content:center;margin:14px 0 12px;flex-wrap:wrap}
          .opt{display:flex;align-items:center;gap:8px;color:#fff;font-size:12px;font-weight:800}
          .sw{display:flex;background:rgba(255,255,255,.14);border-radius:999px;padding:3px}.sw button{border:0;background:none;color:rgba(255,255,255,.7);border-radius:999px;padding:4px 10px;font:inherit;font-size:11px;font-weight:800;cursor:pointer}.sw button.on{background:#fff;color:var(--nv)}
          #go{display:block;width:100%;height:56px;border-radius:999px;border:0;background:linear-gradient(135deg,#a3e1f9,#5fb4e6);color:#fff;font:inherit;font-size:19px;font-weight:900;letter-spacing:.1em;cursor:pointer;box-shadow:0 8px 22px rgba(79,169,223,.4)}
          #go:disabled{opacity:.4;cursor:default;box-shadow:none}
