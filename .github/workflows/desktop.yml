              : '<svg viewBox="0 0 120 124" xmlns="http://www.w3.org/2000/svg"><path d="M86 112 C104 112 110 92 98 82" fill="none" stroke="' + b + '" stroke-width="13" stroke-linecap="round"/><path d="M60 118 C32 118 26 90 31 66 C35 46 44 41 60 41 C76 41 85 46 89 66 C94 90 88 118 60 118 Z" fill="' + b + '"/><circle cx="60" cy="46" r="27" fill="' + b + '"/><path d="M36 31 L40 8 L55 22 Z M84 31 L80 8 L65 22 Z" fill="' + b + '" stroke="' + b + '" stroke-width="4" stroke-linejoin="round"/><path d="M41 25 L43 14 L50 21 Z M79 25 L77 14 L70 21 Z" fill="' + e + '"/><circle cx="50" cy="48" r="7.5" fill="' + ey + '"/><circle cx="50" cy="48" r="4.8" fill="#1c1c1c"/><circle cx="70" cy="48" r="7.5" fill="' + ey + '"/><circle cx="70" cy="48" r="4.8" fill="#1c1c1c"/></svg>';
            return '<div class="catFig"><span class="catPose">' + svg + '</span></div>';
