            } catch (e) { $('msg').textContent = 'はじめられなかったよ'; $('go').disabled = false; }
          });
          zz.on('zz-link', (c) => { $('code').value = c; link(); });
          zz.state().then((s) => { st = s || {}; linked = !!st.uid && st.local !== true; opt = { autoStart: !!st.autoStart, countTaps: !!st.countTaps }; paint(); zz.ready(); }).catch(() => paint());
          paint();
          </script></body></html>
