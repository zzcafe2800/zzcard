            try { const uid = await redeem($('code').value); await zz.set({ uid, local: false }); st.uid = uid; linked = true; } catch (e) { $('msg').textContent = 'つなげなかったよ'; }
            $('link').disabled = false; paint();
          }
          $('link').addEventListener('click', link);
          $('go').addEventListener('click', async () => {
            $('go').disabled = true; $('msg').textContent = '';
            try {
              if (!linked) { const uid = await createLocal({ name: $('nm').value.trim().slice(0, 12), body, ear, s: simpleFig(body, ear, false), z: simpleFig(body, ear, true) }); await zz.set({ uid, local: true }); st.uid = uid; }
